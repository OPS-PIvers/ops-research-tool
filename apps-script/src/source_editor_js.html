<script>
const SRC_TYPES = ['website', 'article', 'book', 'primary'];
const PS_OPTS = ['primary', 'secondary', 'unset'];

const ctx = window.OPS_EDITOR_CTX;
const editor = {
  source: null,            // the source currently being edited
  highlights: [],          // highlights for the currently-edited source
  allSources: [],          // full list — drives the source-switcher dropdown
  allHighlights: [],       // full list — used when switching sources
  bundle: ctx.bundle || null,
  perSourceFilter: null,
  editingHighlightId: null,
  confirmingHighlightDeleteId: null,
  confirmingSourceDelete: false,
  busy: false,             // a blocking server op is in flight (see setBusy_)
};

const els = {
  sourceDd:      document.getElementById('ed-source-dd'),
  sourceTrigger: document.getElementById('ed-source-trigger'),
  sourceLabel:   document.getElementById('ed-source-label'),
  sourceMenu:    document.getElementById('ed-source-menu'),
  close:         document.getElementById('ed-close'),
  citation:      document.getElementById('ed-citation'),
  evHeader:      document.getElementById('ed-evheader'),
  filter:        document.getElementById('ed-filter'),
  evidence:      document.getElementById('ed-evidence'),
  status:        document.getElementById('ed-status'),
};

els.close.addEventListener('click', () => { if (!editor.busy) google.script.host.close(); });

// Custom source switcher — toggle on the trigger, dismiss on outside click /
// Escape, arrow-key navigation within the open menu.
els.sourceTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  if (editor.busy || els.sourceTrigger.disabled) return;
  toggleSourceMenu_();
});
document.addEventListener('click', (e) => {
  if (!els.sourceMenu.hidden && !els.sourceDd.contains(e.target)) closeSourceMenu_();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !els.sourceMenu.hidden) {
    closeSourceMenu_();
    els.sourceTrigger.focus();
  }
});
els.sourceMenu.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  const opts = Array.prototype.slice.call(els.sourceMenu.children);
  if (!opts.length) return;
  const idx = opts.indexOf(document.activeElement);
  const next = e.key === 'ArrowDown' ? (opts[idx + 1] || opts[0]) : (opts[idx - 1] || opts[opts.length - 1]);
  next.focus();
});

function openSourceMenu_() {
  els.sourceMenu.hidden = false;
  els.sourceTrigger.setAttribute('aria-expanded', 'true');
  const active = els.sourceMenu.querySelector('.sb-srcdd__opt--active') || els.sourceMenu.firstElementChild;
  if (active) active.focus();
}
function closeSourceMenu_() {
  els.sourceMenu.hidden = true;
  els.sourceTrigger.setAttribute('aria-expanded', 'false');
}
function toggleSourceMenu_() {
  if (els.sourceMenu.hidden) openSourceMenu_(); else closeSourceMenu_();
}

bootstrap();

function bootstrap() {
  google.script.run
    .withSuccessHandler(onData)
    .withFailureHandler(onFail('loading source'))
    .sidebarGetProjectData(ctx.projectId);
}

function onData(resp) {
  if (!resp || !resp.ok) {
    renderEmpty('Could not load this source.');
    return;
  }
  editor.allSources = resp.sources || [];
  editor.allHighlights = resp.highlights || [];
  editor.source = editor.allSources.find((s) => s.sourceId === ctx.sourceId) || null;
  editor.highlights = editor.allHighlights.filter((h) => h.sourceId === ctx.sourceId);
  if (!editor.source) {
    renderEmpty('This source no longer exists. Close this window.');
    return;
  }
  setStatus('');
  populateSourceSelect_();
  render();
  if (ctx.focusHighlightId) {
    // Pre-expand the editor for the target highlight, then re-render and scroll.
    if (editor.highlights.find((h) => h.highlightId === ctx.focusHighlightId)) {
      editor.editingHighlightId = ctx.focusHighlightId;
      render();
      const target = document.getElementById('hl-' + ctx.focusHighlightId);
      if (target) target.scrollIntoView({ behavior: 'auto', block: 'center' });
    }
  }
}

/**
 * Switch the modal to a different source without closing/reopening. Resets
 * per-source editor state so the new source starts clean.
 */
function switchSource_(newSourceId) {
  if (!newSourceId || newSourceId === ctx.sourceId) return;
  const next = editor.allSources.find((s) => s.sourceId === newSourceId);
  if (!next) {
    setStatus('That source is no longer available.', 'bad', 3000);
    populateSourceSelect_();   // re-sync the select back to ctx.sourceId
    return;
  }
  loadSourceIntoEditor_(next);
  render();
}

/**
 * Point the editor at `source` and reset all per-source UI state so it starts
 * clean. Does NOT render or touch the dropdown — callers decide that.
 */
function loadSourceIntoEditor_(source) {
  ctx.sourceId = source.sourceId;
  editor.source = source;
  editor.highlights = editor.allHighlights.filter((h) => h.sourceId === source.sourceId);
  editor.perSourceFilter = null;
  editor.editingHighlightId = null;
  editor.confirmingHighlightDeleteId = null;
  editor.confirmingSourceDelete = false;
}

function sourceLabel_(s) {
  const parsed = s.citationFieldsParsed || {};
  return parsed.title || s.scrapedTitle || '(untitled)';
}

function populateSourceSelect_() {
  els.sourceMenu.innerHTML = '';
  editor.allSources.forEach((s) => {
    const active = s.sourceId === ctx.sourceId;
    const opt = document.createElement('button');
    opt.type = 'button';
    opt.className = 'sb-srcdd__opt' + (active ? ' sb-srcdd__opt--active' : '');
    opt.setAttribute('role', 'option');
    opt.setAttribute('aria-selected', active ? 'true' : 'false');
    opt.setAttribute('data-source-id', s.sourceId);

    const check = document.createElement('span');
    check.className = 'sb-srcdd__opt-check';
    check.textContent = active ? '✓' : '';
    opt.appendChild(check);

    const dot = document.createElement('span');
    dot.className = 'sb-srcdd__opt-dot sb-srcdd__opt-dot--' + (s.primarySecondary || 'unset');
    dot.title = PS_LABELS[s.primarySecondary] || 'Unset';
    opt.appendChild(dot);

    const text = document.createElement('span');
    text.className = 'sb-srcdd__opt-text';
    text.textContent = sourceLabel_(s);
    opt.appendChild(text);

    opt.addEventListener('click', (e) => {
      e.stopPropagation();
      closeSourceMenu_();
      if (editor.busy) return;
      switchSource_(s.sourceId);
      els.sourceTrigger.focus();
    });
    els.sourceMenu.appendChild(opt);
  });
  els.sourceLabel.textContent = editor.source ? sourceLabel_(editor.source) : '(no source)';
  els.sourceTrigger.disabled = editor.allSources.length <= 1;
}

/**
 * Keep the trigger label and the menu's active option in sync with the
 * currently-loaded source. Title edits ripple into the label + option text;
 * a primary/secondary change re-tints the active option's dot; switching
 * sources moves the checkmark + active styling.
 */
function syncSourceDropdown_() {
  if (!editor.source) return;
  const label = sourceLabel_(editor.source);
  els.sourceLabel.textContent = label;
  Array.prototype.forEach.call(els.sourceMenu.children, (opt) => {
    const on = opt.getAttribute('data-source-id') === ctx.sourceId;
    opt.classList.toggle('sb-srcdd__opt--active', on);
    opt.setAttribute('aria-selected', on ? 'true' : 'false');
    const check = opt.querySelector('.sb-srcdd__opt-check');
    if (check) check.textContent = on ? '✓' : '';
    if (on) {
      const text = opt.querySelector('.sb-srcdd__opt-text');
      if (text) text.textContent = label;
      const dot = opt.querySelector('.sb-srcdd__opt-dot');
      if (dot) {
        dot.className = 'sb-srcdd__opt-dot sb-srcdd__opt-dot--' + (editor.source.primarySecondary || 'unset');
        dot.title = PS_LABELS[editor.source.primarySecondary] || 'Unset';
      }
    }
  });
}

function render() {
  // Keep the trigger label + active menu option in sync — citation title edits
  // and primary/secondary changes should ripple into the dropdown.
  syncSourceDropdown_();

  els.evHeader.textContent = 'Evidence (' + editor.highlights.length + ')';

  els.citation.innerHTML = '';
  els.citation.appendChild(renderCitationForm());
  renderFilterChips_();
  renderEvidenceList_();
}

function renderEmpty(message) {
  els.sourceMenu.innerHTML = '';
  els.sourceLabel.textContent = '(no source)';
  els.sourceTrigger.disabled = true;
  closeSourceMenu_();
  els.citation.innerHTML = '';
  els.filter.innerHTML = '';
  els.evidence.innerHTML = '<div class="sb-empty">' + esc_(message) + '</div>';
  setStatus('');
}

function setStatus(text, kind, autoClearMs) {
  els.status.textContent = text || '';
  els.status.className = 'sb-modal__status' + (kind ? ' sb-modal__status--' + kind : '');
  if (autoClearMs) {
    setTimeout(() => {
      if (els.status.textContent === text) {
        els.status.textContent = '';
        els.status.className = 'sb-modal__status';
      }
    }, autoClearMs);
  }
}

function onFail(stage) {
  return (e) => setStatus(stage + ': ' + (e && e.message || e), 'bad');
}

function esc_(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderCitationForm() {
  const source = editor.source;
  const extra = source.scrapedExtraParsed || {};
  const cf = source.citationFieldsParsed || {};
  // Student-entered citationFields win — INCLUDING deliberate empties. A key
  // present in citationFields, even as '', is taken as-is so a wrong scraped
  // value the student cleared never reappears (mirrors the extension sidebar's
  // effectiveFields_ in extension/content/sidebar.js — keep the two in sync).
  // Then the rich scrape (scrapedExtra + the four discrete scraped* columns);
  // 'website' is the final fallback type.
  // `fields` is a resolved VIEW for rendering/preview only. Writes go through
  // `cf` — the explicit store — so citationFields keeps recording ONLY what
  // the student actually set (a scraped fallback shown in an untouched input
  // is never persisted as if the student typed it).
  const pick = (key, fallback) => (key in cf ? cf[key] : (fallback || ''));
  const fields = Object.assign({}, cf);
  fields.sourceType    = ('sourceType' in cf && cf.sourceType) ? cf.sourceType : (source.sourceType || extra.sourceType || 'website');
  fields.title         = pick('title', source.scrapedTitle);
  fields.siteName      = pick('siteName', source.scrapedSite);
  fields.publishedDate = pick('publishedDate', source.scrapedDate);
  fields.author        = pick('author', source.scrapedAuthor);
  fields.publication   = pick('publication', extra.publication);
  fields.publisher     = pick('publisher', extra.publisher);
  fields.volume        = pick('volume', extra.volume);
  fields.issue         = pick('issue', extra.issue);
  fields.pages         = pick('pages', extra.pages);
  fields.url           = pick('url', source.rawUrl);
  fields.archive       = pick('archive', extra.archive);
  fields.accessDate    = pick('accessDate', source.accessDate);

  const form = document.createElement('div');
  form.className = 'sb-source__form';

  // Way back to the original page, so a student can re-read it.
  if (source.rawUrl) form.appendChild(openSourceLink_(source.rawUrl, 'sb-open-source'));

  // Source type
  form.appendChild(formField_('Source type', selectInput_(SRC_TYPES, fields.sourceType, (v) => {
    fields.sourceType = v;
    cf.sourceType = v;
    saveSourcePatch_({ sourceType: v, citationFields: cf });
    source.sourceType = v;
    source.citationFieldsParsed = cf;
    render();   // re-render to swap the field set
  })));

  form.appendChild(renderPasteBlock_(source, cf));

  // Per-type fields — hidden while a pasted citation is in use (they'd have no
  // visible effect); "Use the built citation instead" brings them back.
  if (!pastedOf_(cf)) sourceFieldsFor_(fields.sourceType).forEach((def) => {
    const onChange = (v) => {
      fields[def.key] = v;
      cf[def.key] = v;
      saveSourcePatch_({ citationFields: cf });
      source.citationFieldsParsed = cf;
      updatePreview_(form, fields);
    };
    form.appendChild(formField_(def.label, textInput_(fields[def.key] || '', onChange, def.kind)));
  });

  // Primary / secondary / unset — segmented control.
  form.appendChild(formField_('Tag', psSegmented_(source)));

  // Annotation
  const annWrap = document.createElement('div');
  annWrap.className = 'sb-source__annotation';
  const annLabel = document.createElement('label'); annLabel.textContent = 'Annotation';
  const annTa = document.createElement('textarea');
  annTa.value = source.annotation || '';
  annTa.placeholder = '2–3 sentence annotation…';
  let annTimer;
  annTa.addEventListener('input', () => {
    clearTimeout(annTimer);
    annTimer = setTimeout(() => {
      saveSourcePatch_({ annotation: annTa.value });
      source.annotation = annTa.value;
    }, 600);
  });
  annWrap.appendChild(annLabel);
  annWrap.appendChild(annTa);
  form.appendChild(annWrap);

  // Live preview
  const preview = document.createElement('div');
  preview.className = 'sb-source__preview';
  preview.id = 'ed-preview';
  preview.innerHTML = '<em>Loading preview…</em>';
  form.appendChild(preview);
  updatePreview_(form, fields);

  // Delete source — at the bottom of the left pane, after preview.
  const dangerWrap = document.createElement('div');
  dangerWrap.className = 'sb-modal__danger';
  dangerWrap.appendChild(renderDeleteSourceUi_());
  form.appendChild(dangerWrap);

  return form;
}

/** "Open source ↗" link to the page a source came from (new tab). */
function openSourceLink_(url, className) {
  const a = document.createElement('a');
  a.className = className;
  a.href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.textContent = 'Open source ↗';
  a.title = url;
  return a;
}

// The usable pasted citation ({text, italics}) in a citationFields object, or null.
function pastedOf_(cf) {
  const p = cf && cf.pasted;
  return p && String(p.text || '').trim() ? p : null;
}

// Clipboard HTML → { text, italics: [[start,end],...] }. Italic comes from
// <i>/<em>/<cite> or an inline font-style; whitespace is collapsed and
// trimmed. Same algorithm as citationFromClipboard_ in extension/content/sidebar.js
// — keep the two in sync.
function citationFromClipboard_(html, plain) {
  const chars = [];
  // UTF-16 units (split('')), not code points: the server and previewHtml_
  // index strings by UTF-16, so an emoji must count as two or ranges drift.
  const push = (str, it) => { String(str).split('').forEach((ch) => chars.push({ ch, it })); };
  if (html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const BLOCK = /^(P|DIV|BR|LI|UL|OL|TR|TD|TH|TABLE|BLOCKQUOTE|SECTION|ARTICLE|H[1-6])$/;
    const walk = (node, it) => {
      if (node.nodeType === 3) { push(node.nodeValue, it); return; }
      if (node.nodeType !== 1) return;
      const tag = node.tagName;
      if (tag === 'SCRIPT' || tag === 'STYLE') return;
      let nit = it;
      if (tag === 'I' || tag === 'EM' || tag === 'CITE') nit = true;
      const fs = node.style && node.style.fontStyle;
      if (fs === 'italic' || fs === 'oblique') nit = true;
      else if (fs === 'normal') nit = false;
      if (BLOCK.test(tag)) push(' ', false);
      node.childNodes.forEach((c) => walk(c, nit));
      if (BLOCK.test(tag)) push(' ', false);
    };
    walk(doc.body, false);
  } else {
    push(plain || '', false);
  }
  // Collapse whitespace runs and trim, carrying each kept char's italic flag.
  const out = [];
  chars.forEach((c) => {
    const ws = /\s/.test(c.ch);
    if (ws) {
      if (!out.length || out[out.length - 1].ch === ' ') return;
      out.push({ ch: ' ', it: c.it });
    } else out.push(c);
  });
  while (out.length && out[out.length - 1].ch === ' ') out.pop();
  let text = '';
  const italics = [];
  let start = -1;
  out.forEach((c, i) => {
    text += c.ch;
    if (c.it && start < 0) start = i;
    if (!c.it && start >= 0) { italics.push([start, i]); start = -1; }
  });
  if (start >= 0) italics.push([start, out.length]);
  // Same cap as the server (PASTED_CITATION_MAX_ in 51_citation.js).
  if (text.length > 2000) text = text.slice(0, 2000);
  // Don't italicize the spaces at a range's edges.
  const trimmed = italics.map(([a, b]) => {
    while (a < b && text[a] === ' ') a++;
    while (b > a && text[b - 1] === ' ') b--;
    return [a, b];
  }).map(([a, b]) => [a, Math.min(b, text.length)]).filter(([a, b]) => b > a);
  return { text, italics: trimmed };
}

// "Paste a citation" block — mirrors renderPasteBlock_ in the extension's
// Source tab. With a pasted citation saved it shows that citation and a way
// back to the built one; otherwise a paste box that asks before replacing.
function renderPasteBlock_(source, cf) {
  const wrap = document.createElement('div');
  wrap.className = 'sb-paste';
  const lab = document.createElement('label');
  wrap.appendChild(lab);
  const save = () => {
    saveSourcePatch_({ citationFields: cf });
    source.citationFieldsParsed = cf;
    render();
  };
  const pasted = pastedOf_(cf);
  if (pasted) {
    lab.textContent = 'Your pasted citation';
    const body = document.createElement('div');
    body.className = 'sb-paste__cite';
    body.innerHTML = renderPreviewHtml_(pasted);
    wrap.appendChild(body);
    const back = document.createElement('button');
    back.type = 'button';
    back.className = 'sb-paste__link';
    back.textContent = 'Use the built citation instead';
    back.addEventListener('click', () => { delete cf.pasted; save(); });
    wrap.appendChild(back);
    return wrap;
  }
  lab.textContent = 'Have a citation from the site? Paste it here';
  const ta = document.createElement('textarea');
  ta.placeholder = 'Copy the MLA citation the site gives you, then paste (Ctrl+V)';
  wrap.appendChild(ta);
  const confirm = document.createElement('div');
  confirm.className = 'sb-paste__confirm';
  confirm.hidden = true;
  const q = document.createElement('div');
  q.className = 'sb-paste__q';
  q.textContent = 'Replace your citation with this one?';
  confirm.appendChild(q);
  const btns = document.createElement('div');
  btns.className = 'sb-paste__btns';
  const yes = document.createElement('button');
  yes.type = 'button'; yes.className = 'sb-btn sb-btn--primary'; yes.textContent = 'Replace';
  const no = document.createElement('button');
  no.type = 'button'; no.className = 'sb-btn'; no.textContent = 'Cancel';
  btns.appendChild(yes); btns.appendChild(no);
  confirm.appendChild(btns);
  wrap.appendChild(confirm);

  let pending = null;
  const showConfirm = () => { confirm.hidden = !(pending && pending.text); };
  ta.addEventListener('paste', (e) => {
    const cd = e.clipboardData;
    if (!cd) return;
    e.preventDefault();
    pending = citationFromClipboard_(cd.getData('text/html'), cd.getData('text/plain'));
    ta.value = pending.text;
    showConfirm();
  });
  ta.addEventListener('input', () => {
    // Typed or edited by hand: plain text, so the clipboard italics no longer line up.
    const text = ta.value.replace(/\s+/g, ' ').trim().slice(0, 2000);
    pending = text ? { text: text, italics: [] } : null;
    showConfirm();
  });
  yes.addEventListener('click', () => {
    if (!pending || !pending.text) return;
    cf.pasted = { text: pending.text, italics: pending.italics };
    save();
  });
  no.addEventListener('click', () => { pending = null; ta.value = ''; showConfirm(); });
  return wrap;
}

function sourceFieldsFor_(sourceType) {
  switch (sourceType) {
    case 'website':
      return [
        { key: 'title', label: 'Title', kind: 'text' },
        { key: 'siteName', label: 'Site name', kind: 'text' },
        { key: 'author', label: 'Author', kind: 'text' },
        { key: 'publishedDate', label: 'Published date', kind: 'text' },
        { key: 'url', label: 'URL', kind: 'text' },
      ];
    case 'article':
      return [
        { key: 'title', label: 'Article title', kind: 'text' },
        { key: 'publication', label: 'Publication name', kind: 'text' },
        { key: 'author', label: 'Author', kind: 'text' },
        { key: 'publishedDate', label: 'Published date', kind: 'text' },
        { key: 'volume', label: 'Volume (opt.)', kind: 'text' },
        { key: 'issue', label: 'Issue (opt.)', kind: 'text' },
        { key: 'pages', label: 'Pages (opt.)', kind: 'text' },
        { key: 'url', label: 'URL', kind: 'text' },
      ];
    case 'book':
      return [
        { key: 'title', label: 'Book title', kind: 'text' },
        { key: 'author', label: 'Author', kind: 'text' },
        { key: 'publisher', label: 'Publisher', kind: 'text' },
        { key: 'publishedDate', label: 'Year', kind: 'text' },
      ];
    case 'primary':
      return [
        { key: 'title', label: 'Title', kind: 'text' },
        { key: 'author', label: 'Author / creator', kind: 'text' },
        { key: 'publishedDate', label: 'Date', kind: 'text' },
        { key: 'archive', label: 'Archive / repository', kind: 'text' },
        { key: 'url', label: 'URL', kind: 'text' },
      ];
    default:
      return [];
  }
}

function formField_(labelText, control) {
  const wrap = document.createElement('div');
  const lab = document.createElement('label');
  lab.textContent = labelText;
  wrap.appendChild(lab);
  wrap.appendChild(control);
  return wrap;
}

function textInput_(value, onCommit, kind) {
  const i = document.createElement('input');
  i.type = kind === 'date' ? 'date' : 'text';
  i.value = value || '';
  i.addEventListener('change', () => onCommit(i.value));
  i.addEventListener('blur', () => onCommit(i.value));
  return i;
}

function selectInput_(options, value, onChange) {
  const s = document.createElement('select');
  options.forEach((o) => {
    const opt = document.createElement('option');
    opt.value = o; opt.textContent = o;
    if (o === value) opt.selected = true;
    s.appendChild(opt);
  });
  s.addEventListener('change', () => onChange(s.value));
  return s;
}

const PS_LABELS = { primary: 'Primary', secondary: 'Secondary', unset: 'Unset' };

/**
 * Primary/secondary/unset picker as a full-width segmented control. Re-skins
 * in place on click (no full re-render — keeps focus and the live preview
 * intact) and persists through the same source autosave path as before.
 */
function psSegmented_(source) {
  const group = document.createElement('div');
  group.className = 'sb-segmented';
  group.setAttribute('role', 'radiogroup');
  group.setAttribute('aria-label', 'Primary or secondary source');
  PS_OPTS.forEach((opt) => {
    const active = (source.primarySecondary || 'unset') === opt;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sb-segmented__opt sb-segmented__opt--' + opt + (active ? ' sb-segmented__opt--active' : '');
    b.textContent = PS_LABELS[opt];
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', active ? 'true' : 'false');
    b.addEventListener('click', () => {
      if ((source.primarySecondary || 'unset') === opt) return;   // no change
      source.primarySecondary = opt;
      saveSourcePatch_({ primarySecondary: opt });
      Array.prototype.forEach.call(group.children, (child) => {
        const on = child === b;
        child.classList.toggle('sb-segmented__opt--active', on);
        child.setAttribute('aria-checked', on ? 'true' : 'false');
      });
    });
    group.appendChild(b);
  });
  return group;
}

function updatePreview_(form, fields) {
  const previewEl = form.querySelector('#ed-preview') || form.querySelector('.sb-source__preview');
  if (!previewEl) return;
  google.script.run
    .withSuccessHandler((res) => {
      if (!res || !res.text) { previewEl.textContent = ''; return; }
      previewEl.innerHTML = renderPreviewHtml_(res);
    })
    .withFailureHandler(() => { /* ignore preview errors */ })
    .sidebarPreviewCitation(fields, 'mla');
}

function renderPreviewHtml_(formatted) {
  const text = formatted.text || '';
  const italics = formatted.italics || [];
  let html = '';
  let cursor = 0;
  italics.forEach(([s, e]) => {
    if (s > cursor) html += esc_(text.slice(cursor, s));
    html += '<em>' + esc_(text.slice(s, e)) + '</em>';
    cursor = e;
  });
  if (cursor < text.length) html += esc_(text.slice(cursor));
  return html;
}

function saveSourcePatch_(patch) {
  const merged = Object.assign({}, patch, { sourceId: ctx.sourceId, projectId: ctx.projectId });
  google.script.run
    .withSuccessHandler(() => setStatus('Saved.', 'good', 1500))
    .withFailureHandler(onFail('saving source'))
    .sidebarUpdateSource(merged);
}

function renderEvidenceList_() {
  els.evidence.innerHTML = '';
  if (editor.highlights.length === 0 && editor.source) {
    const banner = document.createElement('div');
    banner.className = 'sb-modal__banner';
    banner.textContent =
      'This source has no evidence. The source still exists — close the editor, or click "Delete source" below to remove it.';
    els.evidence.appendChild(banner);
  }
  const visible = editor.highlights.filter(highlightPassesFilter_);
  if (visible.length === 0) {
    const e = document.createElement('div');
    e.className = 'sb-empty';
    e.textContent = editor.highlights.length === 0
      ? 'No evidence yet for this source.'
      : 'No evidence matches the current filter.';
    els.evidence.appendChild(e);
    return;
  }
  visible.forEach((h) => els.evidence.appendChild(renderEvidenceCard(h)));
}

function highlightPassesFilter_(h) {
  if (!editor.perSourceFilter) return true;
  return h.primaryCategory === editor.perSourceFilter || h.secondaryCategory === editor.perSourceFilter;
}

function renderEvidenceCard(h) {
  const card = document.createElement('div');
  card.className = 'sb-highlight';
  card.id = 'hl-' + h.highlightId;
  card.setAttribute('data-highlight-id', h.highlightId);

  // Category color → faint fill + near-solid same-hue border (matches the
  // sidebar; the border carries the hue since faint fills of close colors are
  // hard to tell apart).
  const color = colorForLabel_(h.primaryCategory);
  if (color) {
    card.style.backgroundColor = tint_(color, 0.08);
    card.style.border = '1.5px solid ' + tint_(color, 0.85);
  }

  const cat = document.createElement('div');
  cat.className = 'sb-highlight__cat';
  cat.appendChild(document.createTextNode(h.primaryCategory || '(no category)'));
  if (h.secondaryCategory) {
    const sec = document.createElement('span');
    sec.className = 'sb-highlight__secondary';
    sec.textContent = '+ ' + h.secondaryCategory;
    cat.appendChild(sec);
  }
  card.appendChild(cat);

  // Full text — no truncation in the modal.
  const t = document.createElement('div');
  t.className = 'sb-highlight__text';
  t.textContent = h.highlightedText || '';
  card.appendChild(t);

  if (h.note) {
    const n = document.createElement('div');
    n.className = 'sb-highlight__note';
    n.textContent = h.note;
    card.appendChild(n);
  }

  const actions = document.createElement('div');
  actions.className = 'sb-highlight__actions';
  const editBtn = document.createElement('button');
  editBtn.type = 'button';
  editBtn.className = 'sb-highlight__btn sb-highlight__btn--edit';
  editBtn.textContent = editor.editingHighlightId === h.highlightId ? 'Done' : 'Edit';
  editBtn.addEventListener('click', () => {
    editor.editingHighlightId = editor.editingHighlightId === h.highlightId ? null : h.highlightId;
    render();
  });
  actions.appendChild(editBtn);
  if (editor.confirmingHighlightDeleteId === h.highlightId) {
    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'sb-highlight__btn sb-highlight__btn--cancel';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', () => {
      editor.confirmingHighlightDeleteId = null;
      render();
    });
    actions.appendChild(cancelBtn);

    const confirmBtn = document.createElement('button');
    confirmBtn.type = 'button';
    confirmBtn.className = 'sb-highlight__btn sb-highlight__btn--confirm';
    confirmBtn.textContent = 'Confirm delete';
    confirmBtn.addEventListener('click', () => optimisticallyDeleteHighlight_(h));
    actions.appendChild(confirmBtn);
  } else {
    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'sb-highlight__btn sb-highlight__btn--delete';
    delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', () => {
      editor.confirmingHighlightDeleteId = h.highlightId;
      render();
    });
    actions.appendChild(delBtn);
  }
  card.appendChild(actions);

  if (editor.editingHighlightId === h.highlightId) {
    card.appendChild(renderHighlightMiniEditor_(h));
  }
  return card;
}

function colorForLabel_(label) {
  if (!editor.bundle || !label) return null;
  for (let i = 1; i <= 5; i++) {
    if (editor.bundle['label' + i] === label) return editor.bundle['color' + i];
  }
  return null;
}

/** "#rrggbb" → "rgba(r,g,b,a)". Returns transparent for anything unparseable. */
function tint_(hex, alpha) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return 'transparent';
  const n = parseInt(m[1], 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
}

function renderHighlightMiniEditor_(h) {
  const editorEl = document.createElement('div');
  editorEl.style.marginTop = '8px';
  editorEl.style.paddingTop = '8px';
  editorEl.style.borderTop = '1px dashed var(--c-line)';

  if (!editor.bundle) {
    editorEl.textContent = '(bundle not loaded — cannot edit)';
    return editorEl;
  }

  // Primary category swatches.
  const primRow = document.createElement('div');
  primRow.style.cssText = 'display:flex; gap:4px; align-items:center; margin-bottom:6px; flex-wrap:wrap;';
  const primLabel = document.createElement('span');
  primLabel.style.cssText = 'font-size:10px; color:var(--c-muted); min-width:70px; text-transform:uppercase;';
  primLabel.textContent = 'Category';
  primRow.appendChild(primLabel);
  for (let i = 1; i <= 5; i++) {
    const label = editor.bundle['label' + i];
    const color = editor.bundle['color' + i];
    if (!label) continue;
    primRow.appendChild(swatch_(label, color, h.primaryCategory === label, () => {
      saveHighlightPatch_(h, { primaryCategory: label });
      h.primaryCategory = label;
      render();
    }));
  }
  editorEl.appendChild(primRow);

  // Secondary category swatches.
  const secRow = document.createElement('div');
  secRow.style.cssText = 'display:flex; gap:4px; align-items:center; margin-bottom:6px; flex-wrap:wrap;';
  const secLabel = document.createElement('span');
  secLabel.style.cssText = 'font-size:10px; color:var(--c-muted); min-width:70px; text-transform:uppercase;';
  secLabel.textContent = 'Secondary';
  secRow.appendChild(secLabel);
  for (let i = 1; i <= 5; i++) {
    const label = editor.bundle['label' + i];
    const color = editor.bundle['color' + i];
    if (!label) continue;
    secRow.appendChild(swatch_(label, color, h.secondaryCategory === label, () => {
      const next = h.secondaryCategory === label ? '' : label;
      saveHighlightPatch_(h, { secondaryCategory: next });
      h.secondaryCategory = next;
      render();
    }));
  }
  const noneBtn = document.createElement('button');
  noneBtn.type = 'button';
  noneBtn.style.cssText = 'width:22px; height:22px; border-radius:50%; border:2px dashed var(--c-muted); background:#fff; font-size:10px; color:var(--c-muted);';
  noneBtn.textContent = '∅';
  noneBtn.title = 'No secondary';
  noneBtn.addEventListener('click', () => {
    saveHighlightPatch_(h, { secondaryCategory: '' });
    h.secondaryCategory = '';
    render();
  });
  secRow.appendChild(noneBtn);
  editorEl.appendChild(secRow);

  // Note textarea.
  const noteWrap = document.createElement('div');
  const noteLabel = document.createElement('div');
  noteLabel.style.cssText = 'font-size:10px; color:var(--c-muted); text-transform:uppercase;';
  noteLabel.textContent = 'Note';
  const ta = document.createElement('textarea');
  ta.style.cssText = 'width:100%; border:1px solid var(--c-line); border-radius:4px; padding:4px 6px; font-size:12px; resize:vertical; min-height:40px;';
  ta.value = h.note || '';
  let timer;
  ta.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      saveHighlightPatch_(h, { note: ta.value });
      h.note = ta.value;
    }, 600);
  });
  noteWrap.appendChild(noteLabel);
  noteWrap.appendChild(ta);
  editorEl.appendChild(noteWrap);

  return editorEl;
}

function swatch_(label, color, active, onClick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.title = label;
  b.style.cssText = 'width:22px; height:22px; border-radius:50%; border:2px solid ' + (active ? '#1d2a5d' : 'transparent') + '; padding:0; background:' + color + '; cursor:pointer; background-clip:padding-box;';
  b.addEventListener('click', onClick);
  return b;
}

function saveHighlightPatch_(highlight, patch) {
  const merged = Object.assign({}, patch, { highlightId: highlight.highlightId, projectId: ctx.projectId });
  google.script.run
    .withSuccessHandler(() => setStatus('Saved.', 'good', 1500))
    .withFailureHandler(onFail('saving highlight'))
    .sidebarUpdateHighlight(merged);
}

/**
 * Same snapshot/restore pattern the sidebar uses today, scoped to the modal's
 * local state. cascadeSource is ALWAYS false from the modal — the modal has
 * its own explicit "Delete source" button, so it never triggers an implicit
 * source-cascade when the last highlight goes away.
 */
function optimisticallyDeleteHighlight_(highlight) {
  const snapshotIdx = editor.highlights.findIndex((h) => h.highlightId === highlight.highlightId);
  const snapshot = highlight;

  editor.highlights = editor.highlights.filter((h) => h.highlightId !== highlight.highlightId);
  editor.confirmingHighlightDeleteId = null;
  if (editor.editingHighlightId === highlight.highlightId) editor.editingHighlightId = null;
  render();
  setStatus('Deleted.', 'good', 1500);

  google.script.run
    .withSuccessHandler(() => { /* already reflected */ })
    .withFailureHandler((e) => {
      const insertAt = (arr, idx, item) => {
        if (idx < 0 || idx > arr.length) arr.push(item);
        else arr.splice(idx, 0, item);
      };
      insertAt(editor.highlights, snapshotIdx, snapshot);
      render();
      setStatus('Delete failed: ' + (e && e.message || e), 'bad');
    })
    .sidebarDeleteHighlight(highlight.highlightId, ctx.projectId, false);
}

function renderFilterChips_() {
  els.filter.innerHTML = '';
  if (!editor.bundle) return;
  const breakdown = categoryBreakdown_();
  if (breakdown.length === 0) return;

  // "All" chip.
  const allCount = editor.highlights.length;
  els.filter.appendChild(makeFilterChip_(null, 'All', '#cccccc', allCount, editor.perSourceFilter === null));

  // Per-category chips.
  breakdown.forEach((b) => {
    els.filter.appendChild(
      makeFilterChip_(b.label, b.label, b.color, b.count, editor.perSourceFilter === b.label)
    );
  });
}

function categoryBreakdown_() {
  if (!editor.bundle) return [];
  const counts = {};
  editor.highlights.forEach((h) => {
    if (h.primaryCategory) counts[h.primaryCategory] = (counts[h.primaryCategory] || 0) + 1;
  });
  const out = [];
  for (let i = 1; i <= 5; i++) {
    const label = editor.bundle['label' + i];
    if (!label) continue;
    if (counts[label]) out.push({ label, color: editor.bundle['color' + i], count: counts[label] });
  }
  return out;
}

function makeFilterChip_(value, label, color, count, active) {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'sb-filter-chip sb-filter-chip--mini' + (active ? ' sb-filter-chip--active' : '');
  const dot = document.createElement('span');
  dot.className = 'sb-filter-chip__dot';
  dot.style.backgroundColor = color;
  chip.appendChild(dot);
  chip.appendChild(document.createTextNode(label));
  const c = document.createElement('span');
  c.className = 'sb-filter-chip__count';
  c.textContent = count;
  chip.appendChild(c);
  chip.addEventListener('click', () => {
    editor.perSourceFilter = editor.perSourceFilter === value ? null : value;
    render();
  });
  return chip;
}

function renderDeleteSourceUi_() {
  const wrap = document.createElement('div');
  if (editor.confirmingSourceDelete) {
    const cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.className = 'sb-modal__btn sb-modal__btn--cancel';
    cancel.textContent = 'Cancel';
    cancel.addEventListener('click', () => {
      editor.confirmingSourceDelete = false;
      render();
    });
    wrap.appendChild(cancel);

    const confirm = document.createElement('button');
    confirm.type = 'button';
    confirm.className = 'sb-modal__btn sb-modal__btn--danger';
    const n = editor.highlights.length;
    confirm.textContent = n > 0
      ? 'Confirm — delete source and ' + n + ' piece' + (n === 1 ? '' : 's') + ' of evidence'
      : 'Confirm — delete source';
    confirm.addEventListener('click', performDeleteSource_);
    wrap.appendChild(confirm);
  } else {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sb-modal__btn sb-modal__btn--danger-outline';
    btn.textContent = '🗑  Delete source';
    btn.addEventListener('click', () => {
      editor.confirmingSourceDelete = true;
      render();
    });
    wrap.appendChild(btn);
  }
  return wrap;
}

/**
 * Non-optimistic delete — modal stays open until the server confirms. On
 * success, drop the source from the local model and switch to a neighboring
 * source so the editor stays open (the user is usually mid-session); only
 * close when nothing's left to edit. The sidebar's polling loop picks up the
 * deletion on its next tick. On failure, revert to the initial single-button
 * state and surface the error.
 */
function performDeleteSource_() {
  setBusy_(true, 'Deleting source…');
  const deletedId = ctx.sourceId;
  google.script.run
    .withSuccessHandler(() => {
      const idx = editor.allSources.findIndex((s) => s.sourceId === deletedId);
      editor.allSources = editor.allSources.filter((s) => s.sourceId !== deletedId);
      editor.allHighlights = editor.allHighlights.filter((h) => h.sourceId !== deletedId);

      if (editor.allSources.length === 0) {
        google.script.host.close();   // nothing left to edit (overlay tears down with it)
        return;
      }

      setBusy_(false);
      // Land on the source that took the deleted one's slot (or the new last).
      const next = editor.allSources[Math.min(Math.max(idx, 0), editor.allSources.length - 1)];
      loadSourceIntoEditor_(next);
      populateSourceSelect_();
      render();
      setStatus('Source deleted.', 'good', 2000);
    })
    .withFailureHandler((e) => {
      setBusy_(false);
      editor.confirmingSourceDelete = false;
      render();
      setStatus('Delete failed: ' + (e && e.message || e), 'bad');
    })
    .sidebarDeleteSource(ctx.projectId, deletedId);
}

/**
 * Full-modal blocking overlay for operations that keep the editor open while a
 * server call is in flight (currently: deleting a source). The overlay captures
 * every click so a student can't double-fire the button or dismiss the editor
 * mid-flight, and editor.busy makes the header close / source-switch handlers
 * bail too. Autosaves (citation fields, annotation, highlight edits) stay
 * optimistic and non-blocking by design — they never raise this.
 */
function setBusy_(on, label) {
  editor.busy = !!on;
  let ov = document.getElementById('ed-busy');
  if (on) {
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'ed-busy';
      ov.className = 'sb-modal__busy';
      const card = document.createElement('div');
      card.className = 'sb-modal__busy-card';
      const sp = document.createElement('div');
      sp.className = 'sb-loading__spinner';
      const lab = document.createElement('div');
      lab.className = 'sb-modal__busy-label';
      card.appendChild(sp);
      card.appendChild(lab);
      ov.appendChild(card);
      ov.addEventListener('click', (e) => { e.stopPropagation(); e.preventDefault(); });
      document.body.appendChild(ov);
    }
    ov.querySelector('.sb-modal__busy-label').textContent = label || 'Working…';
    ov.style.display = 'flex';
  } else if (ov) {
    ov.style.display = 'none';
  }
}
</script>
