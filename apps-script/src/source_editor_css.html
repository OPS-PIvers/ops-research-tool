<style>
/* Source editor — the Docs modal (source_editor.html) and the right pane of
   the "My research" page (research.html). Loaded after sidebar_css, whose
   tokens it uses. Sized for students: 14px body, sentence-case labels, and
   the citation first. */
:root {
  --c-field-border: #949494;  /* 3:1 on white, so field edges stay visible */
  --c-help: #595959;          /* helper text, 7:1 on white */
  --c-cite-bg: #f4f6fa;       /* blue-50, the citation card */
}

/* ---- Frame ---- */
.sb-body--modal {
  height: 100vh;
  overflow: hidden;           /* panes scroll, never the frame */
  display: flex;
  flex-direction: column;
}
.sb-modal__header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--c-line);
  background: var(--c-bg);
  flex-shrink: 0;
}
.sb-modal__close {
  background: none; border: none; font-size: 24px; line-height: 1;
  color: var(--c-muted); padding: 2px 8px; border-radius: 6px; cursor: pointer;
}
.sb-modal__close:hover { color: var(--c-text); background: var(--c-soft); }
.sb-modal__body {
  flex: 1; min-height: 0;
  display: flex; gap: 0;
}
.sb-modal__pane {
  overflow-y: auto;
  min-width: 0;               /* without this, flex children force horizontal overflow */
  display: flex; flex-direction: column; gap: 12px;
  padding: 18px 20px 24px;
}
.sb-modal__pane--left  { flex: 0 0 52%; border-right: 1px solid var(--c-line); }
.sb-modal__pane--right { flex: 1; background: #fafafa; }
.sb-modal__paneheader {
  margin: 0;
  font-family: var(--c-font-head); font-size: 15px; font-weight: 600;
  color: var(--c-accent-strong);
}
.sb-modal__paneheader-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sb-modal__status {
  padding: 6px 16px 8px; font-size: 13px; color: var(--c-muted); text-align: center;
  min-height: 28px; flex-shrink: 0; border-top: 1px solid var(--c-line);
}
.sb-modal__status:empty { border-top-color: transparent; }
.sb-modal__status--good { color: var(--c-good); }
.sb-modal__status--bad  { color: var(--c-bad); font-weight: 500; }

/* ---- Source switcher (custom listbox; cf. .sb-ps-pop / .sb-insert-pop) ---- */
.sb-srcdd { position: relative; flex: 1; min-width: 0; }
.sb-srcdd__trigger {
  display: flex; align-items: center; gap: 8px; width: 100%;
  font-family: var(--c-font-head);
  font-size: 16px; font-weight: 600; color: var(--c-accent-strong);
  background: var(--c-bg);
  border: 1.5px solid var(--c-line); border-radius: 8px;
  padding: 8px 12px;
  text-align: left;
}
.sb-srcdd__trigger:hover:not(:disabled) { border-color: var(--c-accent); background: var(--c-accent-hover); }
.sb-srcdd__trigger[aria-expanded="true"] {
  border-color: var(--c-accent); background: var(--c-bg);
  box-shadow: 0 0 0 3px rgba(45, 63, 137, 0.12);
}
.sb-srcdd__trigger:disabled { cursor: default; color: var(--c-accent-strong); opacity: 1; border-color: transparent; padding-left: 0; }
.sb-srcdd__label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-srcdd__caret { flex-shrink: 0; font-size: 10px; color: var(--c-muted); transition: transform 0.15s ease; }
.sb-srcdd__trigger[aria-expanded="true"] .sb-srcdd__caret { transform: rotate(180deg); }
.sb-srcdd__trigger:disabled .sb-srcdd__caret { display: none; }
.sb-srcdd__menu {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 45;
  max-height: min(60vh, 360px); overflow-y: auto;
  background: #fff; border: 1px solid var(--c-line); border-radius: 10px;
  box-shadow: 0 12px 32px rgba(29, 42, 93, 0.18);
  padding: 6px;
}
.sb-srcdd__menu[hidden] { display: none; }
.sb-srcdd__opt {
  display: flex; align-items: flex-start; gap: 9px; width: 100%;
  padding: 9px 10px; border: none; background: none; border-radius: 7px;
  font-family: var(--c-font-body);
  font-size: 14px; color: var(--c-text); text-align: left; cursor: pointer;
  line-height: 1.35;
}
.sb-srcdd__opt:hover { background: var(--c-soft); }
.sb-srcdd__opt:focus-visible { outline: 2px solid var(--c-accent); outline-offset: -2px; }
.sb-srcdd__opt--active { background: var(--c-blue-subtle); color: var(--c-accent-strong); font-weight: 600; }
.sb-srcdd__opt-check {
  flex-shrink: 0; width: 13px; margin-top: 1px;
  color: var(--c-accent); font-size: 12px; font-weight: 700; text-align: center;
}
.sb-srcdd__opt-dot { flex-shrink: 0; width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; }
.sb-srcdd__opt-dot--primary   { background: var(--c-accent); }
.sb-srcdd__opt-dot--secondary { background: var(--c-bad); }
.sb-srcdd__opt-dot--unset     { background: #bdbdbd; }
.sb-srcdd__opt-text {
  flex: 1; min-width: 0;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
}

/* ---- Citation pane ---- */
.sb-source__form { display: flex; flex-direction: column; gap: 26px; font-size: 14px; }
.sb-sec { display: flex; flex-direction: column; gap: 10px; }
.sb-sec__head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sb-sec__title {
  margin: 0; font-family: var(--c-font-head); font-size: 15px; font-weight: 600;
  color: var(--c-accent-strong);
}
.sb-sec__head .sb-open-source { margin-left: auto; }
.sb-sec__tag {
  font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px;
}
.sb-sec__tag--required { background: var(--c-blue-subtle); color: var(--c-accent-strong); }
.sb-sec__tag--optional { background: var(--c-soft); color: var(--c-muted); }
.sb-sec__body { display: flex; flex-direction: column; gap: 10px; }
.sb-help { margin: 0; font-size: 13px; line-height: 1.5; color: var(--c-help); }

.sb-open-source {
  font-size: 13px; font-weight: 500;
  color: var(--c-accent); text-decoration: none; text-underline-offset: 2px;
}
.sb-open-source:hover { text-decoration: underline; }

/* The citation itself: what the student is making, so it reads like the page
   it will land on — full-size text and an MLA hanging indent. */
.sb-source__preview {
  background: var(--c-cite-bg); border: 1px solid var(--c-blue-subtle); border-radius: 8px;
  padding: 14px 16px 14px calc(16px + 2em); text-indent: -2em;
  font-size: 15px; line-height: 1.6; color: var(--c-text);
  overflow-wrap: anywhere;
}
.sb-source__preview em { font-style: italic; }
.sb-source__preview-wait { color: var(--c-muted); }
.sb-source__missing { margin: 0; font-size: 13px; line-height: 1.5; color: var(--c-help); }
.sb-source__missing strong { color: var(--c-text); font-weight: 600; }
.sb-source__missing[hidden] { display: none; }

.sb-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.sb-field__label { font-size: 13px; font-weight: 500; color: var(--c-text); }
.sb-field__opt { font-weight: 400; color: var(--c-muted); }
.sb-source__fields {
  display: grid; gap: 12px 14px;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
}
.sb-field--wide { grid-column: 1 / -1; }

.sb-source__form input,
.sb-source__form select,
.sb-source__form textarea,
.sb-modal__evidence textarea {
  width: 100%; min-height: 38px;
  padding: 8px 10px;
  border: 1px solid var(--c-field-border); border-radius: 6px;
  background: #fff; color: var(--c-text);
  font: inherit; font-size: 14px; line-height: 1.4;
}
.sb-source__form textarea,
.sb-modal__evidence textarea { resize: vertical; line-height: 1.5; }
.sb-source__form input:focus,
.sb-source__form select:focus,
.sb-source__form textarea:focus,
.sb-modal__evidence textarea:focus {
  outline: none; border-color: var(--c-good);
  box-shadow: 0 0 0 3px rgba(45, 63, 137, 0.15);
}
.sb-source__form .sb-source__annotation-ta { min-height: 132px; }
.sb-source__count { margin: -4px 0 0; font-size: 12px; color: var(--c-muted); text-align: right; font-variant-numeric: tabular-nums; }

/* Paste a citation: a link until asked for. */
.sb-paste { display: flex; flex-direction: column; gap: 8px; }
.sb-paste--open { padding: 12px; border: 1px dashed var(--c-field-border); border-radius: 8px; }
.sb-paste label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 500; }
.sb-paste textarea { min-height: 64px; }
.sb-paste__note { margin: 0; font-size: 13px; color: var(--c-help); }
.sb-paste__confirm[hidden] { display: none; }
.sb-paste__q { font-size: 14px; color: var(--c-text); margin-bottom: 8px; }
.sb-paste__btns { display: flex; gap: 8px; }
.sb-paste__link {
  align-self: flex-start; border: none; background: none; padding: 2px 0;
  color: var(--c-accent); font-size: 13px; text-decoration: underline; text-underline-offset: 2px;
}
.sb-paste__link:hover { color: var(--c-accent-strong); }
.sb-source__form .sb-btn { font-size: 14px; padding: 8px 14px; }

/* Primary / secondary / not sure. */
.sb-segmented {
  display: flex; width: 100%;
  border: 1px solid var(--c-field-border); border-radius: 8px; overflow: hidden;
  background: #fff;
}
.sb-segmented__opt {
  flex: 1 1 0; min-height: 40px; padding: 8px 6px;
  border: none; border-left: 1px solid var(--c-field-border);
  background: #fff; color: var(--c-text);
  font-size: 14px; line-height: 1.2; text-align: center;
  transition: background 0.15s ease, color 0.15s ease;
}
.sb-segmented__opt:first-child { border-left: none; }
.sb-segmented__opt:hover:not(.sb-segmented__opt--active) { background: var(--c-soft); }
.sb-segmented__opt:focus-visible { outline: 2px solid var(--c-accent); outline-offset: -3px; }
.sb-segmented__opt--active { font-weight: 600; }
.sb-segmented__opt--primary.sb-segmented__opt--active   { background: var(--c-accent); color: #fff; }
.sb-segmented__opt--secondary.sb-segmented__opt--active { background: var(--c-bad); color: #fff; }
.sb-segmented__opt--unset.sb-segmented__opt--active     { background: var(--c-soft); color: var(--c-text); }

/* Remove source: last, quiet, confirmed. */
.sb-modal__danger { padding-top: 16px; border-top: 1px solid var(--c-line); }
.sb-del { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sb-del__q { flex-basis: 100%; margin: 0 0 2px; font-size: 14px; color: var(--c-text); }
.sb-del__link {
  border: none; background: none; padding: 2px 0;
  font-size: 13px; color: var(--c-muted); text-decoration: underline; text-underline-offset: 2px;
}
.sb-del__link:hover { color: var(--c-bad); }
.sb-modal__btn {
  min-height: 36px; padding: 7px 14px; border-radius: 6px; font-size: 14px;
  border: 1px solid var(--c-field-border); background: #fff; color: var(--c-text); cursor: pointer;
}
.sb-modal__btn:hover { background: var(--c-soft); }
.sb-modal__btn--danger { background: var(--c-bad); color: #fff; border-color: var(--c-bad); font-weight: 600; }
.sb-modal__btn--danger:hover { background: #8f1b1c; }

/* ---- Highlights pane ---- */
.sb-modal__filter { display: flex; flex-wrap: wrap; gap: 6px; }
.sb-modal__filter .sb-filter-chip { font-size: 13px; padding: 4px 10px 4px 8px; background: #fff; border-color: var(--c-line); }
.sb-modal__filter .sb-filter-chip--active { border-color: var(--c-accent); }
.sb-modal__filter .sb-filter-chip__dot { width: 10px; height: 10px; }
.sb-modal__filter .sb-filter-chip__count { font-size: 12px; }
.sb-modal__evidence { display: flex; flex-direction: column; gap: 12px; padding-bottom: 4px; }
.sb-modal__banner {
  background: #fff; border: 1px dashed var(--c-field-border); border-radius: 8px;
  padding: 14px 16px; font-size: 14px; line-height: 1.5; color: var(--c-text);
}

.sb-ev { padding: 12px 14px; border-radius: 8px; background: #fff; font-size: 14px; }
.sb-ev__cats { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 6px; }
.sb-ev__cat { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--c-text); }
.sb-ev__cat--secondary { font-weight: 400; color: var(--c-help); }
.sb-ev__dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.sb-ev__text { margin: 0; font-size: 14px; line-height: 1.55; color: var(--c-text); white-space: pre-wrap; }
.sb-ev__note { margin: 8px 0 0; font-size: 13px; line-height: 1.5; color: var(--c-text); }
.sb-ev__note-label { font-weight: 600; }
.sb-ev__actions { display: flex; gap: 4px 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; margin-top: 8px; }
.sb-ev__confirm-q { margin-right: auto; font-size: 13px; font-weight: 500; }
.sb-ev__btn {
  min-height: 32px; padding: 5px 10px; border-radius: 6px;
  border: 1px solid transparent; background: none;
  font-size: 13px; font-weight: 500; color: var(--c-accent);
}
.sb-ev__btn:hover { background: var(--c-accent-hover); }
.sb-ev__btn:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 1px; }
.sb-ev__btn--del { color: var(--c-muted); }
.sb-ev__btn--del:hover { color: var(--c-bad); background: #fbeeee; }
.sb-ev__btn--primary { background: var(--c-accent); color: #fff; }
.sb-ev__btn--primary:hover { background: var(--c-accent-strong); }
.sb-ev__btn--danger { background: var(--c-bad); color: #fff; }
.sb-ev__btn--danger:hover { background: #8f1b1c; }

.sb-ev__editor {
  display: flex; flex-direction: column; gap: 12px;
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--c-line);
}
.sb-ev__pick { display: flex; flex-direction: column; gap: 6px; }
.sb-ev__chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sb-chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 32px; padding: 5px 12px 5px 10px;
  border: 1.5px solid var(--c-line); border-radius: 999px; background: #fff;
  font-size: 13px; color: var(--c-text);
}
.sb-chip:hover { border-color: var(--c-field-border); }
.sb-chip:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 1px; }
.sb-chip--on { font-weight: 600; border-color: var(--c-accent); background: var(--c-blue-subtle); }

/* Blocking overlay while a delete keeps the editor open. */
.sb-modal__busy {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, 0.6);
  cursor: progress;
}
.sb-modal__busy-card {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 20px 28px;
  background: #fff; border: 1px solid var(--c-line); border-radius: 10px;
  box-shadow: 0 8px 24px rgba(29, 42, 93, 0.16);
}
.sb-modal__busy .sb-loading__spinner { width: 30px; height: 30px; }
.sb-modal__busy-label { font-size: 14px; color: var(--c-text); font-weight: 500; }

/* The 820px Docs modal and narrow page widths: one column of panes. */
@media (max-width: 760px) {
  .sb-modal__body { flex-direction: column; overflow-y: auto; }
  .sb-modal__pane { overflow-y: visible; }
  .sb-modal__pane--left { flex: none; border-right: none; border-bottom: 1px solid var(--c-line); }
  .sb-modal__pane--right { flex: none; }
}
::selection { background: rgba(45, 63, 137, 0.18); }
</style>
