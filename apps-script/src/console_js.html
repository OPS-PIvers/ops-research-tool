function fetchGroupDetail_(projectId, groupId) {
  google.script.run
    .withSuccessHandler((resp) => {
      if (!resp || !resp.ok) {
        setStatus('Could not load group.', 'bad', 4000);
        return;
      }
      const key = projectId + '|' + groupId;
      viewCachePut_('group:' + key, resp);
      if (state.view !== 'GROUP' || (state.projectId + '|' + state.groupId) !== key) return;
      groupDetail.loadedFor = key;
      groupDetail.data = resp;
      paintGroupDetail_();
    })
    .withFailureHandler(onFail_('loading group'))
    .consoleGetGroupDashboard(projectId, groupId);
}

function paintGroupDetail_() {
  if (!groupDetail.data) return;
  const data = groupDetail.data;
  const title = document.getElementById('gd-title');
  if (title) {
    title.textContent = '[grp] ' + data.group.name + ' · ' + data.group.className + ' · ' +
      data.group.memberCount + ' member' + (data.group.memberCount === 1 ? '' : 's');
  }
  const body = document.getElementById('gd-body');
  if (!body) return;
  body.innerHTML = '';

  // Reuse the student drill-down grid by stashing data into the shape
  // those builders expect.
  body.appendChild(buildGroupDrillGrid_(data));
  body.appendChild(buildGroupSourcesViewer_(data));
}

/** Group equivalent of buildDrillGrid_, adapted to read from groupDetail.data. */
function buildGroupDrillGrid_(data) {
  // Stash into a shape compatible with the per-student drill builders.
  const stashed = studentDetail.data;
  studentDetail.data = {
    student: { email: '', name: data.group.name, class: data.group.className },
    aggregates: data.aggregates,
    sources: data.sources,
    asOf: data.asOf,
  };
  let grid;
  try {
    grid = buildDrillGrid_();
  } finally {
    studentDetail.data = stashed;
  }
  return grid;
}

function buildGroupSourcesViewer_(data) {
  const stashed = studentDetail.data;
  studentDetail.data = {
    student: { email: '', name: data.group.name, class: data.group.className },
    aggregates: data.aggregates,
    sources: data.sources,
    asOf: data.asOf,
  };
  let viewer;
  try {
    viewer = buildSourcesViewer_();
    // Walk highlight items in the viewer and inject an attribution badge.
    viewer.querySelectorAll('.dd-hl').forEach((node) => {
      const hid = node.getAttribute('data-hid');
      if (!hid) return;
      // Find the highlight + its author across all enriched sources.
      let author = '';
      for (let i = 0; i < data.sources.length; i++) {
        const s = data.sources[i];
        const match = (s.highlights || []).find((h) => h.highlightId === hid);
        if (match) { author = match.createdByEmail || ''; break; }
      }
      if (!author) return;
      const badge = document.createElement('span');
      badge.className = 'drill-hl__byline';
      badge.textContent = '— ' + author;
      const meta = node.querySelector('.dd-hl__meta') || node;
      meta.appendChild(badge);
    });
  } finally {
    studentDetail.data = stashed;
  }
  return viewer;
}

function fetchStudentDetail_(projectId, email) {
  const btn = document.getElementById('dd-refresh');
  if (btn) { btn.disabled = true; btn.textContent = '↻ Refreshing…'; }
  google.script.run
    .withSuccessHandler((resp) => {
      const btn2 = document.getElementById('dd-refresh');
      if (btn2) { btn2.disabled = false; btn2.textContent = '↻ Refresh'; }
      if (!resp || !resp.ok) {
        setStatus('Could not load student.', 'bad', 4000);
        return;
      }
      const key = projectId + '|' + email;
      viewCachePut_('student:' + key, resp);
      if (state.view !== 'STUDENT' || (state.projectId + '|' + state.studentEmail) !== key) return;
      studentDetail.loadedFor = key;
      studentDetail.data = resp;
      studentDetail.fetchedAt = Date.now();
      paintStudentDetail_();
    })
    .withFailureHandler((e) => {
      const btn2 = document.getElementById('dd-refresh');
      if (btn2) { btn2.disabled = false; btn2.textContent = '↻ Refresh'; }
      onFail_('loading student detail')(e);
    })
    .consoleGetStudentDetail(projectId, email);
}

function paintStudentDetail_() {
  const d = studentDetail.data;
  if (!d) return;
  const title = document.getElementById('dd-title');
  if (title) title.textContent = formatLastFirst_(d.student.name);

  const asof = document.getElementById('dd-asof');
  if (asof) asof.textContent = 'Refreshed ' + relativeTime_(d.asOf);

  const body = document.getElementById('dd-body');
  if (!body) return;
  body.innerHTML = '';
  body.appendChild(buildDrillGrid_());
  body.appendChild(buildSourcesViewer_());

  // Chart blocks need their canvas elements in the DOM first. Build the
  // Chart.js instances after this microtask so the canvas refs resolve.
  setTimeout(buildDrillCharts_, 0);
}

const SOURCES_DEFAULT_VISIBLE = 5;
const SOURCES_DEFAULT_HL_COLLAPSE = 8;

function buildSourcesViewer_() {
  const d = studentDetail.data;
  const wrap = document.createElement('div');
  wrap.className = 'dd-sources';
  const title = document.createElement('h3');
  title.className = 'dd-sources__title';
  title.textContent = 'Sources & highlights';
  wrap.appendChild(title);

  const showAll = !!studentDetail.showAllSources;
  const visible = showAll ? d.sources : d.sources.slice(0, SOURCES_DEFAULT_VISIBLE);

  if (visible.length === 0) {
    const e = document.createElement('div');
    e.className = 'console-empty';
    e.textContent = 'No sources yet.';
    e.style.padding = '20px';
    wrap.appendChild(e);
    return wrap;
  }

  visible.forEach((s) => wrap.appendChild(buildSourceCard_(s)));

  if (!showAll && d.sources.length > SOURCES_DEFAULT_VISIBLE) {
    const more = document.createElement('div');
    more.className = 'dd-show-all';
    const btn = document.createElement('button');
    btn.textContent = 'Show all (' + d.sources.length + ')';
    btn.addEventListener('click', () => {
      studentDetail.showAllSources = true;
      paintStudentDetail_();
    });
    more.appendChild(btn);
    wrap.appendChild(more);
  }
  return wrap;
}

/**
 * Per-source evidence-depth line for a drill-down source card. Returns null
 * when the project sets no per-source depth target. `depth` =
 * d.aggregates.evidenceDepth (carries minHighlightsPerSource / minDistinctCategories
 * and a perSource[] keyed by sourceId).
 */
function buildEvidenceLine_(sourceId, depth) {
  if (!depth || !depth.targetSet) return null;
  const ps = (depth.perSource || []).find((p) => p.sourceId === sourceId);
  if (!ps) return null;
  const line = document.createElement('div');
  line.className = 'dd-source-card__evidence' + (ps.meets ? ' is-met' : '');
  const bits = [];
  if (depth.minHighlightsPerSource) bits.push(ps.highlightCount + '/' + depth.minHighlightsPerSource + ' highlights');
  if (depth.minDistinctCategories)  bits.push(ps.distinctCategoryCount + '/' + depth.minDistinctCategories + ' categories');
  line.textContent = bits.join(' · ') + (ps.meets ? ' ✓' : '');
  return line;
}

function buildSourceCard_(s) {
  const card = document.createElement('div');
  card.className = 'dd-source-card';

  // Drill-down aggregates carry the project's evidence-depth target + per-source
  // detail, and whether annotations are required. Read off the module-level
  // studentDetail.data (same pattern as colorForCategoryInDrill_).
  const agg = (studentDetail.data && studentDetail.data.aggregates) || {};
  const annotationRequired = agg.requireAnnotation !== false;

  // Head: title + ps chip + count + completion flags
  const head = document.createElement('div');
  head.className = 'dd-source-card__head';
  const t = document.createElement('div');
  t.className = 'dd-source-card__title';
  t.textContent = (s.citationFieldsParsed && s.citationFieldsParsed.title) || s.scrapedTitle || '(untitled)';
  head.appendChild(t);

  const chip = document.createElement('span');
  chip.className = 'dd-source-card__chip dd-source-card__chip--' + s.primarySecondary;
  chip.textContent = s.primarySecondary;
  head.appendChild(chip);

  const cnt = document.createElement('span');
  cnt.className = 'dd-source-card__count';
  cnt.textContent = s.highlights.length + ' highlight' + (s.highlights.length === 1 ? '' : 's');
  head.appendChild(cnt);

  const flags = document.createElement('div');
  flags.className = 'dd-source-card__flags';
  flags.appendChild(makeFlagChip_('Cite', s.completionFlags.citation));
  flags.appendChild(makeFlagChip_('Tag', s.completionFlags.classification));
  if (annotationRequired) flags.appendChild(makeFlagChip_('Note', s.completionFlags.annotation));
  head.appendChild(flags);

  card.appendChild(head);

  // Per-source evidence-depth progress (highlights / categories), when targeted.
  const evidence = buildEvidenceLine_(s.sourceId, agg.evidenceDepth);
  if (evidence) card.appendChild(evidence);

  // Citation (with italics)
  if (s.formattedCitation && s.formattedCitation.text) {
    const cite = document.createElement('div');
    cite.className = 'dd-source-card__citation';
    cite.innerHTML = renderCitationHtml_(s.formattedCitation);
    card.appendChild(cite);
  }

  // Annotation (if present)
  if (s.annotation) {
    const ann = document.createElement('div');
    ann.className = 'dd-source-card__annotation';
    ann.textContent = '"' + s.annotation + '"';
    card.appendChild(ann);
  }

  // Highlights grouped by primary category. Collapsed if many.
  if (s.highlights.length > 0) {
    const collapseByDefault = s.highlights.length > SOURCES_DEFAULT_HL_COLLAPSE;
    const key = 'expand:' + s.sourceId;
    const expanded = studentDetail.expanded && studentDetail.expanded[key];
    if (collapseByDefault && !expanded) {
      const btn = document.createElement('button');
      btn.className = 'dd-source-card__expand';
      btn.textContent = 'Show ' + s.highlights.length + ' highlights';
      btn.addEventListener('click', () => {
        studentDetail.expanded = studentDetail.expanded || {};
        studentDetail.expanded[key] = true;
        paintStudentDetail_();
      });
      card.appendChild(btn);
    } else {
      card.appendChild(buildHighlightGroups_(s));
    }
  }

  return card;
}

function makeFlagChip_(kind, complete) {
  const chip = document.createElement('span');
  chip.className = 'dd-source-card__flag ' + (complete ? 'dd-source-card__flag--complete' : 'dd-source-card__flag--gap');
  chip.textContent = (complete ? '✓ ' : '✗ ') + kind;
  return chip;
}

function buildHighlightGroups_(s) {
  const wrap = document.createElement('div');
  const groups = {};
  s.highlights.forEach((h) => {
    const k = h.primaryCategory || '(no category)';
    if (!groups[k]) groups[k] = [];
    groups[k].push(h);
  });
  Object.keys(groups).forEach((cat) => {
    const g = document.createElement('div');
    g.className = 'dd-cat-group';
    const gt = document.createElement('div');
    gt.className = 'dd-cat-group__title';
    gt.textContent = cat + ': ' + groups[cat].length + ' highlight' + (groups[cat].length === 1 ? '' : 's');
    g.appendChild(gt);
    groups[cat].forEach((h) => g.appendChild(buildHighlightItem_(h)));
    wrap.appendChild(g);
  });
  return wrap;
}

function buildHighlightItem_(h) {
  const row = document.createElement('div');
  row.className = 'dd-hl';
  row.setAttribute('data-hid', h.highlightId);
  const bar = document.createElement('div');
  bar.className = 'dd-hl__bar';
  bar.style.backgroundColor = colorForCategoryInDrill_(h.primaryCategory) || '#dadce0';
  row.appendChild(bar);
  const txt = document.createElement('div');
  txt.textContent = h.highlightedText || '';
  row.appendChild(txt);
  if (h.note) {
    const note = document.createElement('div');
    note.className = 'dd-hl__note';
    note.textContent = h.note;
    row.appendChild(note);
  }
  return row;
}

function colorForCategoryInDrill_(label) {
  if (!studentDetail.data || !studentDetail.data.aggregates) return null;
  const found = studentDetail.data.aggregates.categoryMix.find((m) => m.label === label);
  return found ? found.color : null;
}

function renderCitationHtml_(formatted) {
  const text = formatted.text || '';
  const italics = formatted.italics || [];
  let html = '';
  let cursor = 0;
  italics.forEach(([s, e]) => {
    if (s > cursor) html += esc_(text.slice(cursor, s));
    html += '<em>' + esc_(text.slice(s, e)) + '</em>';
    cursor = e;
  });
  if (cursor < text.length) html += esc_(text.slice(cursor));
  return html;
}

function buildDrillGrid_() {
  const d = studentDetail.data;
  const grid = document.createElement('div');
  grid.className = 'dd-grid';

  // 1. Highlights by category — bar chart (the star)
  const barBlock = document.createElement('div');

  const barTitle = document.createElement('h3');
  barTitle.className = 'dd-block__title';
  barTitle.textContent = 'Highlights by category';
  barBlock.appendChild(barTitle);
  const barCanvas = document.createElement('canvas');
  barCanvas.id = 'dd-chart-bar';
  barCanvas.className = 'dd-chart-canvas';
  barBlock.appendChild(barCanvas);
  grid.appendChild(barBlock);

  // 2. Source counts
  const countsBlock = document.createElement('div');
  countsBlock.className = 'dd-block';
  const countsTitle = document.createElement('h3');
  countsTitle.className = 'dd-block__title';
  countsTitle.textContent = 'Sources';
  countsBlock.appendChild(countsTitle);
  countsBlock.appendChild(buildDrillCountsTiles_(d.aggregates.sourceCounts));
  grid.appendChild(countsBlock);

  // 3. Completion breakdown
  const compBlock = document.createElement('div');
  compBlock.className = 'dd-block';
  const compTitle = document.createElement('h3');
  compTitle.className = 'dd-block__title';
  compTitle.textContent = 'Completion';
  compBlock.appendChild(compTitle);
  compBlock.appendChild(buildDrillCompletion_(d.aggregates.completion));
  grid.appendChild(compBlock);

  // 4. Activity over time
  const actBlock = document.createElement('div');
  actBlock.className = 'dd-block dd-block--wide';
  const actTitle = document.createElement('h3');
  actTitle.className = 'dd-block__title';
  actTitle.textContent = 'Activity over time';
  actBlock.appendChild(actTitle);
  const actCanvas = document.createElement('canvas');
  actCanvas.id = 'dd-chart-activity';
  actCanvas.className = 'dd-chart-canvas';
  actBlock.appendChild(actCanvas);
  grid.appendChild(actBlock);

  return grid;
}

function buildDrillCountsTiles_(c) {
  const wrap = document.createElement('div');
  wrap.className = 'dd-counts';
  const tile = (n, label) => {
    const t = document.createElement('div');
    t.className = 'dd-count-tile';
    const num = document.createElement('div');
    num.className = 'dd-count-tile__n';
    num.textContent = n;
    t.appendChild(num);
    const lab = document.createElement('div');
    lab.className = 'dd-count-tile__label';
    lab.textContent = label;
    t.appendChild(lab);
    return t;
  };
  wrap.appendChild(tile(c.primary, 'Primary'));
  wrap.appendChild(tile(c.secondary, 'Secondary'));
  const outer = document.createElement('div');
  outer.appendChild(wrap);
  if (c.unset > 0) {
    const un = document.createElement('div');
    un.className = 'dd-unclassified';
    un.textContent = 'Untagged: ' + c.unset;
    outer.appendChild(un);
  }
  return outer;
}

function buildDrillCompletion_(comp) {
  const wrap = document.createElement('div');
  const labels = { citation: 'Citation', classification: 'Tag', annotation: 'Annotation' };
  ['citation', 'classification', 'annotation'].forEach((kind) => {
    const c = comp[kind];
    const pct = c.total === 0 ? 0 : Math.round((c.complete / c.total) * 100);
    const row = document.createElement('div');
    row.className = 'dd-comp-row';
    const lab = document.createElement('div');
    lab.className = 'dd-comp-label';
    lab.textContent = labels[kind];
    row.appendChild(lab);
    const bar = document.createElement('div');
    bar.className = 'dd-comp-bar';
    const fill = document.createElement('div');
    const klass = pct >= 80 ? 'db-completion-fill--good'
               : pct >= 40 ? 'db-completion-fill--warn'
               : 'db-completion-fill--bad';
    fill.className = 'dd-comp-fill ' + klass;
    fill.style.width = pct + '%';
    bar.appendChild(fill);
    row.appendChild(bar);
    const pctTxt = document.createElement('div');
    pctTxt.className = 'dd-comp-pct';
    pctTxt.textContent = c.complete + ' / ' + c.total;
    row.appendChild(pctTxt);
    wrap.appendChild(row);
  });
  return wrap;
}

function buildDrillCharts_() {
  destroyDrillCharts_();
  if (typeof Chart === 'undefined') return;
  const d = studentDetail.data;

  // Bar chart — highlights by category
  const barEl = document.getElementById('dd-chart-bar');
  if (barEl) {
    studentDetail.chartInstances.categoryBar = new Chart(barEl, {
      type: 'bar',
      data: {
        labels: d.aggregates.categoryMix.map((m) => m.label),
        datasets: [{
          label: 'Highlights',
          data: d.aggregates.categoryMix.map((m) => m.count),
          backgroundColor: d.aggregates.categoryMix.map((m) => m.color),
          borderWidth: 0,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } },
          x: { ticks: { autoSkip: false } },
        },
      },
    });
  }

  // Line chart — activity over time
  const lineEl = document.getElementById('dd-chart-activity');
  if (lineEl) {
    studentDetail.chartInstances.activityLine = new Chart(lineEl, {
      type: 'line',
      data: {
        labels: d.aggregates.activityByDay.map((a) => a.date),
        datasets: [
          {
            label: 'Highlights',
            data: d.aggregates.activityByDay.map((a) => a.highlights),
            borderColor: '#2d3f89',
            backgroundColor: 'rgba(45, 63, 137, 0.15)',
            tension: 0.2,
            fill: true,
          },
          {
            label: 'Sources',
            data: d.aggregates.activityByDay.map((a) => a.sources),
            borderColor: '#ad2122',
            backgroundColor: 'rgba(173, 33, 34, 0.15)',
            tension: 0.2,
            fill: true,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom' } },
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } },
        },
      },
    });
  }
}

function destroyDrillCharts_() {
  if (studentDetail.chartInstances.categoryBar) {
    studentDetail.chartInstances.categoryBar.destroy();
    studentDetail.chartInstances.categoryBar = null;
  }
  if (studentDetail.chartInstances.activityLine) {
    studentDetail.chartInstances.activityLine.destroy();
    studentDetail.chartInstances.activityLine = null;
  }
}

function buildHeader_() {
  const h = document.createElement('header');
  h.className = 'console-header';

  // Title — clickable to return to My Projects.
  const title = document.createElement('div');
  title.className = 'console-header__title';
  title.textContent = 'OPS Research Tool';
  title.style.cursor = 'pointer';
  title.addEventListener('click', () => navigate_('/projects'));
  h.appendChild(title);

  const right = document.createElement('div');
  right.className = 'console-header__right';

  // Admin-only: demo sample-data toggle + admin dropdown.
  if (state.ctx && state.ctx.role === 'admin') {
    right.appendChild(buildSampleToggle_());
    right.appendChild(buildAdminDropdown_());
  }

  const actor = document.createElement('div');
  actor.className = 'console-header__actor';
  actor.innerHTML = '<strong></strong>';
  actor.querySelector('strong').textContent = state.ctx.staff.Name || state.ctx.actor;
  const tag = document.createElement('span');
  tag.className = 'console-header__role-tag' + (state.ctx.role === 'admin' ? ' console-header__role-tag--admin' : '');
  tag.textContent = state.ctx.role;
  actor.appendChild(tag);
  right.appendChild(actor);

  h.appendChild(right);
  return h;
}

function buildAdminDropdown_() {
  const wrap = document.createElement('div');
  wrap.className = 'console-header__admin';

  const btn = document.createElement('button');
  btn.className = 'console-header__admin-btn';
  btn.textContent = 'Admin ▾';
  wrap.appendChild(btn);

  const menu = document.createElement('div');
  menu.className = 'console-header__admin-menu';
  const opts = [
    { label: 'Classes',               path: '/admin/classes' },
    { label: 'Roster',                path: '/admin/roster' },
    { label: 'Staff',                 path: '/admin/staff' },
    { label: 'Archive school year',   path: '/admin/archive-year' },
  ];
  opts.forEach((o) => {
    const a = document.createElement('button');
    a.className = 'console-header__admin-item';
    a.textContent = o.label;
    a.addEventListener('click', (e) => {
      e.stopPropagation();
      menu.classList.remove('console-header__admin-menu--open');
      navigate_(o.path);
    });
    menu.appendChild(a);
  });
  wrap.appendChild(menu);

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = menu.classList.toggle('console-header__admin-menu--open');
    if (!open) return;
    // One-shot click-away: attach a document listener only while the menu is
    // open and remove it on close. The header is rebuilt on every render, so
    // a permanent per-build listener would leak one handler per re-render.
    const closeAway = (ev) => {
      if (wrap.contains(ev.target)) return;
      menu.classList.remove('console-header__admin-menu--open');
      document.removeEventListener('click', closeAway);
    };
    setTimeout(() => document.addEventListener('click', closeAway), 0);
  });
  return wrap;
}

/**
 * Demo sample-data toggle (admin-only). Flipping ON lazily seeds ~18 fake
 * students into the Dev Project the first time (server-side; can take a few
 * seconds), then it's an instant show/hide. State lives in state.ctx.
 */
function buildSampleToggle_() {
  const on = !!(state.ctx && state.ctx.sampleDataEnabled);
  const btn = document.createElement('button');
  btn.className = 'console-header__sample' + (on ? ' console-header__sample--on' : '');
  btn.id = 'sample-toggle';
  btn.title = 'Show or hide demo sample students on the dashboard';
  const dot = document.createElement('span');
  dot.className = 'console-header__sample-dot';
  btn.appendChild(dot);
  const lbl = document.createElement('span');
  lbl.textContent = 'Sample data: ' + (on ? 'On' : 'Off');
  btn.appendChild(lbl);
  btn.addEventListener('click', () => toggleSampleData_(btn, lbl));
  return btn;
}

function toggleSampleData_(btn, lbl) {
  const next = !(state.ctx && state.ctx.sampleDataEnabled);
  btn.disabled = true;
  lbl.textContent = next ? 'Seeding…' : 'Hiding…';
  setStatus(next ? 'Seeding sample data… (first time only, ~20–30s)' : 'Hiding sample data…', null, 0);
  google.script.run
    .withSuccessHandler((resp) => {
      if (!resp || !resp.ok) {
        setStatus('Sample-data toggle failed.', 'bad', 4000);
        applyHash_();
        return;
      }
      state.ctx.sampleDataEnabled = resp.enabled;
      setStatus(resp.enabled
        ? ('Sample data on — ' + resp.count + ' demo students')
        : 'Sample data hidden', 'good', 3000);
      dashboard.loadedFor = null;   // force the dashboard to refetch in the new state
      renderShell_();               // rebuilds header (toggle state) + current view
    })
    .withFailureHandler((e) => {
      applyHash_();
      onFail_('toggling sample data')(e);
    })
    .consoleSetSampleData(next);
}

// ---------- shared helpers ----------

function setStatus(text, kind, autoClearMs) {
  let pill = document.getElementById('console-status-pill');
  if (!pill) {
    pill = document.createElement('div');
    pill.id = 'console-status-pill';
    pill.className = 'console-status';
    document.body.appendChild(pill);
  }
  pill.textContent = text || '';
  pill.className = 'console-status' + (kind ? ' console-status--' + kind : '') + (text ? '' : ' console-status--hide');
  if (autoClearMs) {
    setTimeout(() => {
      if (pill.textContent === text) {
        pill.className = 'console-status console-status--hide';
      }
    }, autoClearMs);
  }
}

function onFail_(stage) {
  return (e) => setStatus(stage + ': ' + (e && e.message || e), 'bad', 4000);
}

function esc_(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function openMergeModal_() {
  const sel = state.dashboardSelection || {};
  const studentEmails = Object.keys(sel).filter((k) => sel[k] === 'student');
  if (studentEmails.length < 2 || studentEmails.length > 4) return;

  const byEmail = {};
  (dashboard.data.students || []).forEach((s) => { byEmail[s.email] = s; });
  const members = studentEmails.map((e) => byEmail[e]).filter(Boolean);
  if (members.length === 0) return;
  const sharedClass = members[0].class;

  // Compute Group N placeholder by counting existing groups in this class.
  const existingGroupsInClass = (dashboard.data.groups || []).filter((g) => g.className === sharedClass);
  const placeholder = 'Group ' + (existingGroupsInClass.length + 1);

  const overlay = document.createElement('div');
  overlay.className = 'console-modal-overlay db-merge-overlay';
  const modal = document.createElement('div');
  modal.className = 'console-modal db-merge-modal';

  const h = document.createElement('h2');
  h.textContent = 'Merge into group';
  modal.appendChild(h);

  const subtitle = document.createElement('p');
  subtitle.className = 'db-merge-subtitle';
  subtitle.textContent = sharedClass + ' — ' + members.length + ' student' + (members.length === 1 ? '' : 's');
  modal.appendChild(subtitle);

  const list = document.createElement('ul');
  list.className = 'db-merge-list';
  members.forEach((m) => {
    const li = document.createElement('li');
    li.textContent = formatLastFirst_(m.name) + ' (' + m.email + ')';
    list.appendChild(li);
  });
  modal.appendChild(list);

  const labelEl = document.createElement('label');
  labelEl.className = 'db-merge-label';
  labelEl.textContent = 'Group name';
  modal.appendChild(labelEl);
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'db-merge-input';
  input.placeholder = placeholder;
  input.maxLength = 60;
  modal.appendChild(input);

  const note = document.createElement('p');
  note.className = 'db-merge-note';
  note.textContent = 'Each selected student\'s existing sources and highlights move into the new group Sheet. Reversible: disbanding the group — or removing a member — rebuilds their solo Sheet with their own work, including anything they added while grouped.';
  modal.appendChild(note);

  const actions = document.createElement('div');
  actions.className = 'console-modal__actions';
  const cancel = document.createElement('button');
  cancel.className = 'console-modal__cancel';
  cancel.textContent = 'Cancel';
  cancel.addEventListener('click', () => overlay.remove());
  actions.appendChild(cancel);
  const submit = document.createElement('button');
  submit.className = 'console-modal__submit';
  submit.textContent = 'Merge';
  submit.addEventListener('click', () => {
    submit.disabled = true;
    submit.textContent = 'Merging…';
    const name = (input.value || '').trim() || placeholder;
    google.script.run
      .withSuccessHandler((resp) => {
        setStatus('Merged ' + members.length + ' students into "' + name + '".', 'good', 4000);
        overlay.remove();
        state.dashboardSelection = {};
        fetchDashboard_(state.projectId, true);
      })
      .withFailureHandler((e) => {
        submit.disabled = false;
        submit.textContent = 'Merge';
        setStatus('Merge failed: ' + (e && e.message || e), 'bad', 5000);
      })
      .consoleGroupCreate(state.projectId, name, studentEmails);
  });
  actions.appendChild(submit);
  modal.appendChild(actions);

  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  input.focus();
}

function openMoveDropdown_(anchor) {
  const sel = state.dashboardSelection || {};
  const studentEmails = Object.keys(sel).filter((k) => sel[k] === 'student');
  if (studentEmails.length !== 1) return;
  const email = studentEmails[0];

  const byEmail = {};
  (dashboard.data.students || []).forEach((s) => { byEmail[s.email] = s; });
  const student = byEmail[email];
  if (!student) return;

  // Candidate groups: same class, not the student's current group, with room
  // (≤4 members). Works for both a grouped student (move) and a solo one
  // (add — their groupId is null, so every same-class group is a candidate).
  const candidates = (dashboard.data.groups || []).filter((g) =>
    g.className === student.class && g.groupId !== student.groupId && g.memberCount < 4);

  // Close any open dropdown first.
  document.querySelectorAll('.db-move-pop').forEach((el) => el.remove());
  if (candidates.length === 0) {
    const verb = student.groupId ? 'move into' : 'add them to';
    setStatus('No ' + student.class + ' groups with room to ' + verb + '.', 'neutral', 3000);
    return;
  }

  const pop = document.createElement('div');
  pop.className = 'db-move-pop';
  const rect = anchor.getBoundingClientRect();
  pop.style.position = 'fixed';
  pop.style.top = (rect.bottom + 4) + 'px';
  pop.style.left = rect.left + 'px';

  candidates.forEach((g) => {
    const item = document.createElement('button');
    item.className = 'db-move-pop__item';
    item.textContent = g.name + '  (' + g.memberCount + ' member' + (g.memberCount === 1 ? '' : 's') + ')';
    item.addEventListener('click', () => {
      pop.remove();
      if (student.groupId) doMove_(email, student.groupId, g.groupId, g.name);
      else                 doAddToGroup_(email, g.groupId, g.name);
    });
    pop.appendChild(item);
  });
  document.body.appendChild(pop);
  const closer = (e) => {
    if (pop.contains(e.target) || e.target === anchor) return;
    pop.remove();
    document.removeEventListener('click', closer);
  };
  setTimeout(() => document.addEventListener('click', closer), 0);
}

function doMove_(email, fromGroupId, toGroupId, toName) {
  if (!fromGroupId) {
    setStatus('Solo students cannot be moved — merge them into a group instead.', 'bad', 4000);
    return;
  }
  google.script.run
    .withSuccessHandler(() => {
      setStatus('Moved ' + email + ' into "' + toName + '".', 'good', 4000);
      state.dashboardSelection = {};
      fetchDashboard_(state.projectId, true);
    })
    .withFailureHandler((e) => setStatus('Move failed: ' + (e && e.message || e), 'bad', 5000))
    .consoleGroupMoveStudent(state.projectId, email, fromGroupId, toGroupId);
}

function doAddToGroup_(email, toGroupId, toName) {
  google.script.run
    .withSuccessHandler(() => {
      setStatus('Added ' + email + ' to "' + toName + '".', 'good', 4000);
      state.dashboardSelection = {};
      fetchDashboard_(state.projectId, true);
    })
    .withFailureHandler((e) => setStatus('Add failed: ' + (e && e.message || e), 'bad', 5000))
    .consoleAddToGroup(state.projectId, toGroupId, email);
}

function confirmRemoveFromGroup_() {
  if (!dashboard.data) return;
  const sel = state.dashboardSelection || {};
  const studentKeys = Object.keys(sel).filter((k) => sel[k] === 'student');
  if (studentKeys.length !== 1) return;
  const email = studentKeys[0];
  const student = (dashboard.data.students || []).find((s) => s.email === email);
  if (!student || !student.groupId) return;
  const group = (dashboard.data.groups || []).find((g) => g.groupId === student.groupId);
  const groupName = group ? group.name : 'the group';
  const willDisband = !!(group && group.memberCount <= 2);

  const overlay = document.createElement('div');
  overlay.className = 'console-modal-overlay';
  const modal = document.createElement('div');
  modal.className = 'console-modal';
  modal.innerHTML =
    '<h2>Remove ' + esc_(formatLastFirst_(student.name)) + ' from "' + esc_(groupName) + '"?</h2>' +
    '<p>They return to a solo Sheet with their own work — everything they authored, including what they did while grouped — rebuilt into it.</p>' +
    (willDisband
      ? '<p><strong>Only one member would remain, so the group disbands</strong> — that member also returns to a solo Sheet.</p>'
      : '');
  const actions = document.createElement('div');
  actions.className = 'console-modal__actions';
  const cancel = document.createElement('button');
  cancel.className = 'console-modal__cancel';
  cancel.textContent = 'Cancel';
  cancel.addEventListener('click', () => overlay.remove());
  actions.appendChild(cancel);
  const submit = document.createElement('button');
  submit.className = 'console-modal__submit';
  submit.textContent = 'Remove';
  submit.addEventListener('click', () => {
    submit.disabled = true;
    submit.textContent = 'Removing…';
    google.script.run
      .withSuccessHandler((resp) => {
        setStatus((resp && resp.autoDisbanded)
          ? 'Removed ' + email + ' — group disbanded.'
          : 'Removed ' + email + ' from "' + groupName + '".', 'good', 4000);
        overlay.remove();
        state.dashboardSelection = {};
        fetchDashboard_(state.projectId, true);
      })
      .withFailureHandler((e) => {
        submit.disabled = false;
        submit.textContent = 'Remove';
        setStatus('Remove failed: ' + (e && e.message || e), 'bad', 5000);
      })
      .consoleGroupRemoveStudent(state.projectId, student.groupId, email);
  });
  actions.appendChild(submit);
  modal.appendChild(actions);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

function confirmDisband_() {
  const sel = state.dashboardSelection || {};
  const groupIds = Object.keys(sel).filter((k) => sel[k] === 'group');
  if (groupIds.length !== 1) return;
  const groupId = groupIds[0];
  const group = (dashboard.data.groups || []).find((g) => g.groupId === groupId);
  if (!group) return;

  const overlay = document.createElement('div');
  overlay.className = 'console-modal-overlay';
  const modal = document.createElement('div');
  modal.className = 'console-modal';
  modal.innerHTML =
    '<h2>Disband "' + esc_(group.name) + '"?</h2>' +
    '<p>The ' + group.memberCount + ' member' + (group.memberCount === 1 ? '' : 's') +
    ' reappear as solos. Each member\'s solo Sheet is rebuilt with their own work — everything they authored, including what they did while grouped.</p>';
  const actions = document.createElement('div');
  actions.className = 'console-modal__actions';
  const cancel = document.createElement('button');
  cancel.className = 'console-modal__cancel';
  cancel.textContent = 'Cancel';
  cancel.addEventListener('click', () => overlay.remove());
  actions.appendChild(cancel);
  const submit = document.createElement('button');
  submit.className = 'console-modal__danger';
  submit.textContent = 'Disband';
  submit.addEventListener('click', () => {
    submit.disabled = true;
    submit.textContent = 'Disbanding…';
    google.script.run
      .withSuccessHandler(() => {
        setStatus('Disbanded "' + group.name + '".', 'good', 4000);
        overlay.remove();
        state.dashboardSelection = {};
        fetchDashboard_(state.projectId, true);
      })
      .withFailureHandler((e) => {
        submit.disabled = false;
        submit.textContent = 'Disband';
        setStatus('Disband failed: ' + (e && e.message || e), 'bad', 5000);
      })
      .consoleGroupDisband(state.projectId, groupId);
  });
  actions.appendChild(submit);
  modal.appendChild(actions);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}
</script>
