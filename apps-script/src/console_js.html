<script>
// ============================================================
// OPS Research Tool — Teacher Console
//
// Bootstrap → consoleGetContext → render auth-gated shell or
// "Not authorized" panel. Real screens land in Tasks 9+.
// ============================================================

const state = {
  ctx: null,
  view: null,
  projectId: null,
  studentEmail: null,
  groupId: null,
  className: null,        // dashboard class-period filter (null = all of the caller's classes)
  // Dashboard mode flags
  manageGroups: false,
  collapsedGroups: {},    // {groupId: true} — collapsed in this session
  dashboardSelection: {}, // {emailOrGroupId: 'student' | 'group'} — Manage Mode selection
};

const root = document.getElementById('console-root');

bootstrap();

// Single close path for the project-card kebab menu. Clears the open-menu
// state AND re-renders, so the menu is actually removed from the DOM rather
// than just flagged closed. Used both by the document-level click-away below
// and by every menu action (opening a modal, archiving, …) so a popover can
// never linger behind whatever it launched.
function closeProjectMenu_() {
  if (myProjects.openMenuId === null) return;
  myProjects.openMenuId = null;
  if (state.view === 'MY_PROJECTS') renderShell_();
}
document.addEventListener('click', closeProjectMenu_);

// ------------------------------------------------------------
// View cache (localStorage, best-effort). Every google.script.run call is a
// 1–3s round-trip, and each screen used to start from a blank skeleton on
// every visit/reload. Screens now paint the last-known data for the same key
// INSTANTLY and refresh in the background ("stale-while-revalidate"); the
// as-of / "Updating…" affordances show that a refresh is in flight. Keyed by
// actor so a shared machine never shows another teacher's data. Anything
// here is display-only — the server remains authoritative.
// ------------------------------------------------------------
const VIEW_CACHE_NS = 'opsConsole:v1:';
const VIEW_CACHE_MAX_AGE_MS = 12 * 60 * 60 * 1000;
// Window-focus refreshes used to bypass the server cache on EVERY refocus
// (each tab switch = a full dashboard recompute). Throttle them; the server's
// own 45s cache still keeps the data fresh.
const FOCUS_REFRESH_MIN_MS = 30 * 1000;

function viewCacheRawGet_(key) {
  try {
    const raw = localStorage.getItem(VIEW_CACHE_NS + key);
    if (!raw) return null;
    const v = JSON.parse(raw);
    if (!v || typeof v.at !== 'number' || Date.now() - v.at > VIEW_CACHE_MAX_AGE_MS) return null;
    return v.data;
  } catch (e) { return null; }
}
function viewCacheRawPut_(key, data) {
  try { localStorage.setItem(VIEW_CACHE_NS + key, JSON.stringify({ at: Date.now(), data })); } catch (e) { /* quota / sandbox */ }
}
function viewCacheGet_(key) {
  const actor = state.ctx && state.ctx.actor;
  return actor ? viewCacheRawGet_(actor + ':' + key) : null;
}
function viewCachePut_(key, data) {
  const actor = state.ctx && state.ctx.actor;
  if (actor) viewCacheRawPut_(actor + ':' + key, data);
}

function bootstrap() {
  state.view = 'BOOT';
  // Cached session → render the shell + last project list immediately, then
  // reconcile with the server. Cold → the usual boot spinner.
  const cached = viewCacheRawGet_('boot');
  if (cached && cached.ctx && cached.ctx.staff) {
    state.ctx = cached.ctx;
    state.bootFromCache = true;
    if (Array.isArray(cached.projects) && myProjects.filter === 'active') {
      myProjects.projects = cached.projects;
      myProjects.everLoaded = true;
      myProjects.paintedFromCache = true;
    }
    startRouting_();
  } else {
    renderBoot_();
  }
  // ONE round-trip for context + projects (was two chained calls).
  google.script.run
    .withSuccessHandler(onBootstrap_)
    .withFailureHandler((e) => {
      if (state.bootFromCache) {
        state.bootFromCache = false;
        setStatus('Could not refresh the session — showing the last loaded data.', 'bad', 5000);
        return;
      }
      onFail_('loading session')(e);
    })
    .consoleBootstrap('active');
}

function startRouting_() {
  // Set up hash routing once. parseHash_ → state mutation → render.
  if (!state.routingStarted) {
    state.routingStarted = true;
    window.addEventListener('hashchange', onHashChange_);
  }
  applyHash_();   // initial route from whatever the URL is
}

function onBootstrap_(resp) {
  const ctx = resp && resp.ctx;
  const wasCached = !!state.bootFromCache;
  state.bootFromCache = false;
  if (!ctx || !ctx.staff) {
    try { localStorage.removeItem(VIEW_CACHE_NS + 'boot'); } catch (e) { /* ignore */ }
    onContext_(ctx);
    return;
  }
  viewCacheRawPut_('boot', { ctx, projects: Array.isArray(resp.projects) ? resp.projects : null });
  const ctxChanged = JSON.stringify(state.ctx) !== JSON.stringify(ctx);
  state.ctx = ctx;
  let projectsChanged = false;
  if (Array.isArray(resp.projects) && myProjects.filter === 'active') {
    projectsChanged = JSON.stringify(myProjects.projects) !== JSON.stringify(resp.projects);
    myProjects.projects = resp.projects;
    myProjects.everLoaded = true;
    myProjects.paintedFromCache = false;
  }
  if (!wasCached) { startRouting_(); return; }
  // Already on screen from the cache — only repaint if something changed.
  if (ctxChanged || (projectsChanged && state.view === 'MY_PROJECTS')) renderShell_();
}

function onContext_(ctx) {
  state.ctx = ctx;
  if (!ctx || !ctx.staff) {
    state.view = 'UNAUTHED';
    renderUnauthed_();
    return;
  }
  startRouting_();
}

function onHashChange_() {
  applyHash_();
}

function applyHash_() {
  const r = parseHash_(window.location.hash);
  state.view = r.view;
  state.projectId = r.projectId;
  state.studentEmail = r.studentEmail;
  state.groupId = r.groupId || null;
  state.className = r.className || null;
  renderShell_();
}

/**
 * Parse the URL hash into a route descriptor.
 *
 *   ''  or '#/projects'                                 → MY_PROJECTS
 *   '#/projects/<id>'                                   → DASHBOARD (all classes)
 *   '#/projects/<id>/class/<encodedClass>'              → DASHBOARD (one class period)
 *   '#/projects/<id>/students/<encodedEmail>'           → STUDENT
 *   anything else                                       → MY_PROJECTS (default)
 */
function parseHash_(hash) {
  const h = String(hash || '').replace(/^#\/?/, '');
  if (!h || h === 'projects') return { view: 'MY_PROJECTS' };
  const parts = h.split('/');

  // Admin routes.
  if (parts[0] === 'admin') {
    if (parts[1] === 'classes')       return { view: 'ADMIN_CLASSES' };
    if (parts[1] === 'roster')        return { view: 'ADMIN_ROSTER' };
    if (parts[1] === 'staff')         return { view: 'ADMIN_STAFF' };
    if (parts[1] === 'archive-year')  return { view: 'ADMIN_LIFECYCLE' };
    return { view: 'ADMIN_CLASSES' };  // default admin landing
  }

  // Existing teacher routes.
  if (parts[0] !== 'projects') return { view: 'MY_PROJECTS' };
  if (parts.length === 2)
    return { view: 'DASHBOARD', projectId: decodeURIComponent(parts[1]) };
  if (parts.length === 4 && parts[2] === 'class')
    return { view: 'DASHBOARD', projectId: decodeURIComponent(parts[1]), className: decodeURIComponent(parts[3]) };
  if (parts.length === 4 && parts[2] === 'students')
    return {
      view: 'STUDENT',
      projectId: decodeURIComponent(parts[1]),
      studentEmail: decodeURIComponent(parts[3]),
    };
  if (parts.length === 4 && parts[2] === 'groups')
    return {
      view: 'GROUP',
      projectId: decodeURIComponent(parts[1]),
      groupId: decodeURIComponent(parts[3]),
    };
  // Class-scoped drill-downs preserve the period for back-navigation:
  //   /projects/<id>/class/<class>/students/<email>
  //   /projects/<id>/class/<class>/groups/<groupId>
  if (parts.length === 6 && parts[2] === 'class' && parts[4] === 'students')
    return {
      view: 'STUDENT',
      projectId: decodeURIComponent(parts[1]),
      className: decodeURIComponent(parts[3]),
      studentEmail: decodeURIComponent(parts[5]),
    };
  if (parts.length === 6 && parts[2] === 'class' && parts[4] === 'groups')
    return {
      view: 'GROUP',
      projectId: decodeURIComponent(parts[1]),
      className: decodeURIComponent(parts[3]),
      groupId: decodeURIComponent(parts[5]),
    };
  return { view: 'MY_PROJECTS' };
}

function navigate_(path) {
  // path is a hash without the leading '#' (e.g., '/projects/<id>')
  window.location.hash = path;
}

/**
 * Build a dashboard-or-drill-down path that PRESERVES the active class period,
 * so a student/group "back" returns to the same scope and a refresh stays put.
 *   projectPath_()                 → /projects/<id>[/class/<class>]
 *   projectPath_('students', email)→ /projects/<id>[/class/<class>]/students/<email>
 *   projectPath_('groups', gid)    → /projects/<id>[/class/<class>]/groups/<gid>
 */
function projectPath_(kind, id) {
  let p = '/projects/' + encodeURIComponent(state.projectId);
  if (state.className) p += '/class/' + encodeURIComponent(state.className);
  if (kind) p += '/' + kind + '/' + encodeURIComponent(id);
  return p;
}

function renderBoot_() {
  root.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'console-boot';
  const sp = document.createElement('div');
  sp.className = 'console-spinner';
  el.appendChild(sp);
  const label = document.createElement('div');
  label.textContent = 'Loading…';
  el.appendChild(label);
  root.appendChild(el);
}

function renderUnauthed_() {
  root.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'console-unauthed';
  const h1 = document.createElement('h1');
  h1.textContent = 'Not authorized';
  wrap.appendChild(h1);
  const p1 = document.createElement('p');
  p1.textContent = 'This tool is staff-only. Sign in with your district account, or contact your district admin if you believe this is a mistake.';
  wrap.appendChild(p1);
  if (state.ctx && state.ctx.actor) {
    const p2 = document.createElement('p');
    p2.innerHTML = 'Signed in as <code></code>.';
    p2.querySelector('code').textContent = state.ctx.actor;
    wrap.appendChild(p2);
  }
  root.appendChild(wrap);
}

function renderShell_() {
  root.innerHTML = '';
  root.appendChild(buildHeader_());
  const main = document.createElement('main');
  main.className = 'console-main';
  main.id = 'console-main';
  root.appendChild(main);
  renderView_(main);
}

function renderView_(main) {
  switch (state.view) {
    case 'MY_PROJECTS':    return renderMyProjects_(main);
    case 'DASHBOARD':      return renderDashboard_(main);
    case 'STUDENT':        return renderStudentDetail_(main);
    case 'GROUP':          return renderGroupDetail_(main);
    case 'ADMIN_CLASSES':  return renderAdminClasses_(main);
    case 'ADMIN_ROSTER':   return renderAdminRoster_(main);
    case 'ADMIN_STAFF':    return renderAdminStaff_(main);
    case 'ADMIN_LIFECYCLE':return renderAdminLifecycle_(main);
    default:
      main.innerHTML = '<div class="console-empty">Unknown view.</div>';
  }
}

// MY_PROJECTS view-local state. Reset each time we enter the view.
const myProjects = {
  filter: 'active',   // 'active' | 'archived'
  projects: null,     // loaded by fetchMyProjects_
  openMenuId: null,   // sourceId whose kebab menu is open (null = none)
};

function renderMyProjects_(main) {
  // Toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'mp-toolbar';
  const title = document.createElement('h1');
  title.className = 'mp-title';
  title.textContent = 'My Projects';
  toolbar.appendChild(title);

  const right = document.createElement('div');
  right.style.display = 'flex';
  right.style.gap = '12px';
  right.style.alignItems = 'center';

  const toggle = document.createElement('div');
  toggle.className = 'mp-toggle';
  ['active', 'archived'].forEach((f) => {
    const b = document.createElement('button');
    b.textContent = f.charAt(0).toUpperCase() + f.slice(1);
    if (myProjects.filter === f) b.classList.add('mp-toggle--active');
    b.addEventListener('click', () => {
      if (myProjects.filter === f) return;
      myProjects.filter = f;
      myProjects.projects = null;
      renderShell_();
      fetchMyProjects_();
    });
    toggle.appendChild(b);
  });
  right.appendChild(toggle);

  const newBtn = document.createElement('button');
  newBtn.className = 'mp-new-btn';
  newBtn.textContent = '+ New project';
  newBtn.addEventListener('click', openCreateProjectModal_);   // implemented in Task 11
  right.appendChild(newBtn);

  toolbar.appendChild(right);
  main.appendChild(toolbar);

  // Body — either skeletons (while loading) or the project list.
  const body = document.createElement('div');
  body.className = 'mp-list';
  body.id = 'mp-body';
  main.appendChild(body);

  if (myProjects.projects === null) {
    // First entry this session: paint the last-known list at once and refresh
    // behind it. Later resets (filter toggle, create/archive) deliberately
    // skip the cache so a just-changed list never flashes its old state.
    const cached = myProjects.everLoaded ? null : viewCacheGet_('projects:' + myProjects.filter);
    if (cached) {
      myProjects.projects = cached;
      myProjects.everLoaded = true;
      myProjects.paintedFromCache = true;
      renderMpCards_(body);
    } else {
      renderMpSkeletons_(body);
    }
    fetchMyProjects_();
  } else {
    renderMpCards_(body);
  }
}

function renderMpSkeletons_(body) {
  body.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const sk = document.createElement('div');
    sk.className = 'mp-skeleton';
    const l1 = document.createElement('div');
    l1.className = 'mp-skeleton__line mp-skeleton__line--mid';
    sk.appendChild(l1);
    const l2 = document.createElement('div');
    l2.className = 'mp-skeleton__line mp-skeleton__line--long';
    sk.appendChild(l2);
    body.appendChild(sk);
  }
}

function fetchMyProjects_() {
  google.script.run
    .withSuccessHandler((resp) => {
      if (!resp || !resp.ok) {
        setStatus('Could not load projects.', 'bad', 4000);
        return;
      }
      const fresh = resp.projects || [];
      const unchanged = myProjects.paintedFromCache &&
        JSON.stringify(myProjects.projects) === JSON.stringify(fresh);
      myProjects.projects = fresh;
      myProjects.everLoaded = true;
      myProjects.paintedFromCache = false;
      viewCachePut_('projects:' + myProjects.filter, fresh);
      if (!unchanged) renderShell_();
    })
    .withFailureHandler(onFail_('loading projects'))
    .consoleGetMyProjects(myProjects.filter);
}

function renderMpCards_(body) {
  body.innerHTML = '';
  if (myProjects.projects.length === 0) {
    const e = document.createElement('div');
    e.className = 'console-empty';
    e.textContent = myProjects.filter === 'archived'
      ? 'No archived projects.'
      : 'You\'re not on any active projects. Click + New project to create one.';
    body.appendChild(e);
    return;
  }
  myProjects.projects.forEach((p) => body.appendChild(buildProjectCard_(p)));
}

function buildProjectCard_(p) {
  const card = document.createElement('div');
  card.className = 'mp-card';

  const name = document.createElement('div');
  name.className = 'mp-card__name';
  name.textContent = p.name;
  card.appendChild(name);

  const meta = document.createElement('div');
  meta.className = 'mp-card__meta';
  const parts = [
    p.schoolYear,
    p.bundleName,
    classLabelJoin_(p.memberClasses),
    p.studentCount + ' student' + (p.studentCount === 1 ? '' : 's'),
  ].filter(Boolean);
  meta.textContent = parts.join(' · ');
  card.appendChild(meta);

  const actions = document.createElement('div');
  actions.className = 'mp-card__actions';
  const open = document.createElement('button');
  open.className = 'mp-card__open';
  open.textContent = 'Open';
  open.addEventListener('click', () => navigate_('/projects/' + encodeURIComponent(p.projectId)));
  actions.appendChild(open);

  const kebab = document.createElement('button');
  kebab.className = 'mp-card__kebab';
  kebab.textContent = '⋯';
  kebab.title = 'More actions';
  kebab.addEventListener('click', (e) => {
    e.stopPropagation();
    myProjects.openMenuId = myProjects.openMenuId === p.projectId ? null : p.projectId;
    renderShell_();
  });
  actions.appendChild(kebab);
  card.appendChild(actions);

  if (myProjects.openMenuId === p.projectId) {
    card.appendChild(buildKebabMenu_(p));
  }

  return card;
}

function buildKebabMenu_(p) {
  const menu = document.createElement('div');
  menu.className = 'mp-kebab-menu';
  // Position below the kebab button visually.
  menu.style.position = 'absolute';
  menu.style.top = '52px';
  menu.style.right = '20px';

  if (p.status === 'active') {
    const editClasses = document.createElement('button');
    editClasses.textContent = 'Edit classes…';
    editClasses.addEventListener('click', (e) => { e.stopPropagation(); openEditClassesModal_(p); });
    menu.appendChild(editClasses);

    const archBtn = document.createElement('button');
    archBtn.className = 'mp-kebab-menu__danger';
    archBtn.textContent = 'Archive…';
    archBtn.addEventListener('click', (e) => { e.stopPropagation(); confirmArchive_(p); });
    menu.appendChild(archBtn);
  } else {
    const unArchBtn = document.createElement('button');
    unArchBtn.textContent = 'Unarchive';
    unArchBtn.addEventListener('click', (e) => { e.stopPropagation(); doUnarchive_(p); });
    menu.appendChild(unArchBtn);
  }
  return menu;
}

// Create modal implemented in Task 11. Archive/unarchive in Task 12.
function openCreateProjectModal_() {
  const fields = {
    name: '',
    schoolYear: defaultSchoolYear_(),
    bundleId: '',
    memberClasses: [],
    requirements: { minSources: '', minHighlightsPerSource: '', minDistinctCategories: '', requireAnnotation: true },
  };

  // Need the bundle list + the class list. Bundles come from one fetch;
  // for admins the class list comes from a Roster fetch (consoleListAllClasses);
  // for teachers it's ctx.teacherClasses (already loaded with the session).
  setStatus('Loading bundles…', null, 1000);
  google.script.run
    .withSuccessHandler((bundlesResp) => {
      const bundles = bundlesResp && bundlesResp.bundles ? bundlesResp.bundles : [];
      const palette = (bundlesResp && bundlesResp.palette) ? bundlesResp.palette : [];
      if (bundles.length === 0) {
        setStatus('No bundles available.', 'bad', 3000);
        return;
      }
      fields.bundleId = bundles[0].bundleId;

      if (state.ctx.role === 'admin') {
        google.script.run
          .withSuccessHandler((clsResp) => {
            const classes = (clsResp && clsResp.classes) ? clsResp.classes : [];
            renderCreateModal_(fields, bundles, classes, palette);
          })
          .withFailureHandler(onFail_('loading classes'))
          .consoleListAllClasses();
      } else {
        renderCreateModal_(fields, bundles, state.ctx.teacherClasses || [], palette);
      }
    })
    .withFailureHandler(onFail_('loading bundles'))
    .listBundlesForConsole();
}

/**
 * Class display helpers. Class KEYS are composed strings ("US History P3 —
 * Ivers") kept stable as the join value; ctx.classLabels maps each key to its
 * clean "Name · Period" label + teacher last name. classLabelsFor_ appends the
 * teacher only when two keys in the SAME visible list share a label (or when
 * forceTeacher, for admin/cross-teacher views). Unknown keys label as
 * themselves, so legacy classes render unchanged.
 */
function classLabel_(key) {
  const m = state.ctx && state.ctx.classLabels;
  const e = m && m[key];
  return (e && e.label) || key;
}

function classLabelsFor_(keys, forceTeacher) {
  const m = (state.ctx && state.ctx.classLabels) || {};
  const counts = {};
  (keys || []).forEach((k) => { const l = classLabel_(k); counts[l] = (counts[l] || 0) + 1; });
  const out = {};
  (keys || []).forEach((k) => {
    let l = classLabel_(k);
    const e = m[k];
    if ((forceTeacher || counts[l] > 1) && e && e.teacherName) l += ' — ' + e.teacherName;
    out[k] = l;
  });
  return out;
}

/** Joined, disambiguated label list for card metas / dashboard titles. */
function classLabelJoin_(keys) {
  const labels = classLabelsFor_(keys);
  return (keys || []).map((k) => labels[k]).join(', ');
}

/** Derive distinct classes from currently-loaded project memberClasses lists.
 *  Best-effort: if myProjects.projects isn't loaded, returns []. */
function collectKnownClasses_() {
  const set = {};
  (myProjects.projects || []).forEach((p) => {
    (p.memberClasses || []).forEach((c) => { if (c) set[c] = true; });
  });
  return Object.keys(set).sort();
}

function defaultSchoolYear_() {
  const now = new Date();
  const y = now.getFullYear();
  // School year typically starts in August. If we're before August, current
  // school year is (prev)-(curr); else current-(next).
  return now.getMonth() >= 7 ? (y + '-' + String(y + 1).slice(2)) : ((y - 1) + '-' + String(y).slice(2));
}

function renderCreateModal_(fields, bundles, classOptions, palette) {
  closeModal_();   // in case one is open
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'modal-backdrop';
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal_(); });

  const modal = document.createElement('div');
  modal.className = 'modal';

  const header = document.createElement('div');
  header.className = 'modal__header';
  header.textContent = 'New project';
  modal.appendChild(header);

  const body = document.createElement('div');
  body.className = 'modal__body';

  // Name
  body.appendChild(makeField_('Name', (() => {
    const i = document.createElement('input');
    i.type = 'text'; i.maxLength = 80; i.placeholder = 'e.g., NHD 2026';
    i.addEventListener('input', () => { fields.name = i.value; updateCreateBtn_(); });
    return i;
  })()));

  // School year
  body.appendChild(makeField_('School year', (() => {
    const s = document.createElement('select');
    const opts = generateSchoolYearOptions_();
    opts.forEach((y) => {
      const o = document.createElement('option');
      o.value = y; o.textContent = y;
      if (y === fields.schoolYear) o.selected = true;
      s.appendChild(o);
    });
    s.addEventListener('change', () => { fields.schoolYear = s.value; });
    return s;
  })()));

  // Bundle — real bundles + a "Create new set…" sentinel that reveals a
  // 5-row authoring sub-form. `bundles` is mutated in place when a set is
  // created so the picker reflects it without a full reload.
  const CREATE_SENTINEL = '__create_new_set__';
  const bundleField = makeField_('Bundle', (() => {
    const s = document.createElement('select');
    s.id = 'create-bundle-select';
    const fill = () => {
      s.innerHTML = '';
      bundles.forEach((b) => {
        const o = document.createElement('option');
        o.value = b.bundleId; o.textContent = b.name;
        if (b.bundleId === fields.bundleId) o.selected = true;
        s.appendChild(o);
      });
      const sep = document.createElement('option');
      sep.value = CREATE_SENTINEL; sep.textContent = '➕ Create new set…';
      s.appendChild(sep);
    };
    fill();
    s.addEventListener('change', () => {
      if (s.value === CREATE_SENTINEL) {
        s.value = fields.bundleId;            // don't leave the sentinel selected
        toggleCreateSetForm_(true);
      } else {
        fields.bundleId = s.value;
        toggleCreateSetForm_(false);
      }
    });
    s._fill = fill;
    return s;
  })());
  body.appendChild(bundleField);

  const setForm = buildCreateSetForm_(fields, bundles, palette || [], () => {
    const sel = document.getElementById('create-bundle-select');
    if (sel && sel._fill) sel._fill();
    updateCreateBtn_();
  });
  body.appendChild(setForm);

  function toggleCreateSetForm_(show) { setForm.style.display = show ? 'block' : 'none'; }

  // Optional requirements — same fieldset the edit-requirements modal uses, so
  // create + edit never drift. Blank inputs ride along to the server as '' and
  // validateRequirementsInput_ treats blank as unset.
  body.appendChild(buildRequirementsFields_(fields.requirements));

  // Classes
  body.appendChild((() => {
    const wrap = document.createElement('div');
    wrap.className = 'modal__field';
    const lab = document.createElement('label');
    lab.textContent = 'Member classes';
    wrap.appendChild(lab);

    const isAdmin = state.ctx.role === 'admin';

    // Existing Roster classes as a scrollable checkbox list (only when there
    // are any — otherwise we skip the empty bordered box entirely).
    if (classOptions.length > 0) {
      const box = document.createElement('div');
      box.className = 'modal__classes';
      // Admins see cross-teacher lists → always show the teacher; a teacher's
      // own list only disambiguates if two of their labels collide.
      const rowLabels = classLabelsFor_(classOptions, isAdmin);
      classOptions.forEach((c) => {
        box.appendChild(makeClassCheckboxRow_({
          label: rowLabels[c], value: c, checked: fields.memberClasses.indexOf(c) >= 0,
          onToggle: (on) => {
            fields.memberClasses = fields.memberClasses.filter((x) => x !== c);
            if (on) fields.memberClasses.push(c);
            updateCreateBtn_();
          },
        }));
      });
      wrap.appendChild(box);
    }

    // Classes are real entities now (managed in Admin → Classes). A project
    // picks from them via checkboxes — no free-text, so no typos that create a
    // phantom member-class matching no real class.
    if (classOptions.length === 0) {
      const note = document.createElement('div');
      note.className = 'modal__error';
      note.textContent = isAdmin
        ? 'No classes yet. Create one in Admin → Classes, then start a project here.'
        : 'You are not listed as the Teacher for any classes.';
      wrap.appendChild(note);
    }

    return wrap;
  })());

  const errMsg = document.createElement('div');
  errMsg.className = 'modal__error';
  errMsg.id = 'create-error';
  body.appendChild(errMsg);

  modal.appendChild(body);

  const footer = document.createElement('div');
  footer.className = 'modal__footer';
  const cancel = document.createElement('button');
  cancel.className = 'modal__btn';
  cancel.textContent = 'Cancel';
  cancel.addEventListener('click', closeModal_);
  footer.appendChild(cancel);

  const create = document.createElement('button');
  create.className = 'modal__btn modal__btn--primary';
  create.id = 'create-btn';
  create.textContent = 'Create project';
  create.disabled = true;
  create.addEventListener('click', () => submitCreate_(fields, create));
  footer.appendChild(create);

  modal.appendChild(footer);
  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);

  function updateCreateBtn_() {
    const ok = fields.name.trim().length > 0 && fields.memberClasses.length > 0 && fields.bundleId;
    create.disabled = !ok;
  }
}

/**
 * Builds the optional-requirements fieldset bound to a `req` object
 * ({minSources, minHighlightsPerSource, minDistinctCategories, requireAnnotation}).
 * Shared by the create modal and the edit modal. Blank number input = unset.
 */
function buildRequirementsFields_(req) {
  const wrap = document.createElement('div');
  wrap.className = 'req-fieldset';
  const head = document.createElement('div');
  head.className = 'req-fieldset__head';
  head.textContent = 'Requirements (optional)';
  wrap.appendChild(head);

  const numField = (label, key, max) => {
    const f = makeField_(label, (() => {
      const i = document.createElement('input');
      i.type = 'number'; i.min = '1'; if (max) i.max = String(max);
      i.placeholder = 'no minimum';
      i.value = req[key] === '' || req[key] == null ? '' : String(req[key]);
      i.addEventListener('input', () => { req[key] = i.value; });
      return i;
    })());
    wrap.appendChild(f);
  };
  numField('Min sources', 'minSources');
  numField('Min highlights per source', 'minHighlightsPerSource');
  numField('Min distinct categories per source', 'minDistinctCategories', 5);

  const tgl = makeField_('Annotations required', (() => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'req-toggle' + (req.requireAnnotation ? ' req-toggle--on' : '');
    btn.textContent = req.requireAnnotation ? 'Required' : 'Optional';
    btn.addEventListener('click', () => {
      req.requireAnnotation = !req.requireAnnotation;
      btn.className = 'req-toggle' + (req.requireAnnotation ? ' req-toggle--on' : '');
      btn.textContent = req.requireAnnotation ? 'Required' : 'Optional';
    });
    return btn;
  })());
  wrap.appendChild(tgl);
  return wrap;
}

// 5-row "create a new set" authoring form. Each row: a label-name input + an
// 8-swatch palette picker (one selected). On Save, calls consoleCreateBundle,
// pushes the result into `bundles`, selects it in the picker, and hides the form.
// `onCreated` is called after a successful save so the caller can refresh the
// bundle select and re-evaluate the Create-project button state.
function buildCreateSetForm_(fields, bundles, palette, onCreated) {
  const wrap = document.createElement('div');
  wrap.className = 'modal__field';
  wrap.style.display = 'none';
  wrap.style.borderTop = '1px dashed #c9cdd6';
  wrap.style.paddingTop = '10px';

  const lab = document.createElement('label');
  lab.textContent = 'New set';
  wrap.appendChild(lab);

  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.maxLength = 60;
  nameInput.placeholder = 'Set name (e.g., Capstone categories)';
  nameInput.style.marginBottom = '8px';
  wrap.appendChild(nameInput);

  // Default colors for each row: first 5 from palette, or the real preset
  // palette if it didn't load (server's createBundle_ rejects any off-palette
  // color, so the fallback MUST be valid palette hexes).
  const fallback = ['#F4B400','#DB4437','#0F9D58','#4285F4','#AB47BC','#FF7043','#26A69A','#8D6E63'];
  // Resolve ONCE so the row defaults and the swatch buttons draw from the same
  // source — otherwise an empty/partial palette could default a row to a color
  // its swatch row never renders (no swatch shows as selected).
  const effectivePalette = (palette && palette.length) ? palette : fallback;
  const rowColors = effectivePalette.slice(0, 5);

  const rowInputs = [];
  for (let i = 0; i < 5; i++) {
    const row = document.createElement('div');
    row.style.display = 'flex';
    row.style.alignItems = 'center';
    row.style.gap = '6px';
    row.style.marginBottom = '6px';

    const catInput = document.createElement('input');
    catInput.type = 'text';
    catInput.maxLength = 40;
    catInput.placeholder = 'Category ' + (i + 1) + ' name';
    catInput.style.flex = '1';
    rowInputs.push(catInput);
    row.appendChild(catInput);

    // Swatch buttons — same resolved palette the row default came from.
    effectivePalette.forEach((hex) => {
      const sw = document.createElement('button');
      sw.type = 'button';
      sw.style.cssText = 'width:20px;height:20px;border-radius:50%;padding:0;border:2px solid transparent;background:' + hex + ';flex-shrink:0;cursor:pointer;';
      if (hex === rowColors[i]) sw.style.borderColor = '#202124';
      sw.addEventListener('click', () => {
        rowColors[i] = hex;
        Array.from(row.querySelectorAll('button')).forEach((b) => { b.style.borderColor = 'transparent'; });
        sw.style.borderColor = '#202124';
      });
      row.appendChild(sw);
    });

    wrap.appendChild(row);
  }

  const saveBtn = document.createElement('button');
  saveBtn.type = 'button';
  saveBtn.className = 'modal__btn modal__btn--primary';
  saveBtn.textContent = 'Save set';
  saveBtn.style.marginTop = '4px';
  saveBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    const labels = rowInputs.map((x) => x.value.trim());
    if (!name) { setStatus('Set name required.', 'bad', 2500); return; }
    if (labels.some((l) => !l)) { setStatus('All 5 category names required.', 'bad', 2500); return; }
    saveBtn.disabled = true;
    google.script.run
      .withSuccessHandler((resp) => {
        saveBtn.disabled = false;
        if (!resp || !resp.ok) { setStatus('Could not create set.', 'bad', 3000); return; }
        bundles.push(resp.bundle);
        fields.bundleId = resp.bundle.bundleId;   // must precede onCreated() — fill() selects by fields.bundleId
        wrap.style.display = 'none';
        setStatus('Set "' + resp.bundle.name + '" created.', 'good', 2500);
        onCreated();
      })
      .withFailureHandler((e) => {
        saveBtn.disabled = false;
        setStatus((e && e.message) || 'Could not create set.', 'bad', 3500);
      })
      .consoleCreateBundle({ name: name, style: 'mla', labels: labels, colors: rowColors });
  });
  wrap.appendChild(saveBtn);
  return wrap;
}

// Shared full-width class-picker row used by both the Create-project and
// Edit-classes modals. opts: { label, value, checked, locked, isNew, onToggle }.
function makeClassCheckboxRow_(opts) {
  const lbl = document.createElement('label');
  lbl.className = 'modal__class-checkbox'
    + (opts.locked ? ' modal__class-checkbox--locked' : '')
    + (opts.isNew ? ' modal__class-checkbox--new' : '');
  const inp = document.createElement('input');
  inp.type = 'checkbox';
  inp.value = opts.value;
  inp.checked = !!opts.checked;
  if (opts.locked) { inp.disabled = true; lbl.title = 'You don’t teach this class'; }
  inp.addEventListener('change', () => opts.onToggle(inp.checked));
  lbl.appendChild(inp);
  lbl.appendChild(document.createTextNode(opts.label));
  return lbl;
}

function generateSchoolYearOptions_() {
  const cur = defaultSchoolYear_();
  const startYear = parseInt(cur.split('-')[0], 10);
  return [
    (startYear - 1) + '-' + String(startYear).slice(2),
    cur,
    (startYear + 1) + '-' + String(startYear + 2).slice(2),
  ];
}

/**
 * Edit the project's memberClasses (add/remove classes → adds/removes
 * students whose Class is in the list). Teacher: can only check/uncheck
 * classes they teach (per-row disabled state). Admin: all classes editable.
 */
function openEditClassesModal_(p) {
  closeProjectMenu_();
  closeModal_();

  const isAdmin = state.ctx.role === 'admin';
  const teacherClasses = state.ctx.teacherClasses || [];
  const current = (p.memberClasses || []).slice();
  const selected = {};
  current.forEach((c) => { selected[c] = true; });

  // --- Show the modal shell immediately with a skeleton, so there's no blank
  //     "stalled" gap while the available classes load. ---
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'modal-backdrop';
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal_(); });

  const modal = document.createElement('div');
  modal.className = 'modal';

  const header = document.createElement('div');
  header.className = 'modal__header';
  header.textContent = 'Edit classes for ' + p.name;
  modal.appendChild(header);

  const body = document.createElement('div');
  body.className = 'modal__body';

  const note = document.createElement('div');
  note.style.fontSize = '13px';
  note.style.color = '#5f6368';
  note.style.paddingBottom = '12px';
  note.textContent = isAdmin
    ? 'Adding a class adds every student in that class to the project. Removing a class drops them.'
    : 'You can add or remove classes you teach. Other teachers’ classes are locked.';
  body.appendChild(note);

  const box = document.createElement('div');
  box.className = 'modal__classes';
  box.appendChild(buildSkeletonLines_(5, ['db-skel-bar--wide', 'db-skel-bar--wide', 'db-skel-bar--narrow']));
  body.appendChild(box);

  const errMsg = document.createElement('div');
  errMsg.className = 'modal__error';
  errMsg.id = 'edit-classes-error';
  body.appendChild(errMsg);

  modal.appendChild(body);

  const footer = document.createElement('div');
  footer.className = 'modal__footer';
  const cancel = document.createElement('button');
  cancel.className = 'modal__btn';
  cancel.textContent = 'Cancel';
  cancel.addEventListener('click', closeModal_);
  footer.appendChild(cancel);
  const save = document.createElement('button');
  save.className = 'modal__btn modal__btn--primary';
  save.textContent = 'Save';
  save.disabled = true;   // enabled once the picker is populated
  footer.appendChild(save);
  modal.appendChild(footer);

  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);

  function updateSaveBtn() { save.disabled = Object.keys(selected).length === 0; }

  save.addEventListener('click', () => {
    const chosen = Object.keys(selected);
    if (chosen.length === 0) { errMsg.textContent = 'At least one class required.'; return; }
    save.disabled = true; save.textContent = 'Saving…';
    errMsg.textContent = '';
    google.script.run
      .withSuccessHandler((resp) => {
        if (resp && resp.ok) {
          closeModal_();
          setStatus('Classes updated.', 'good', 2500);
          myProjects.projects = null;
          renderShell_();
          fetchMyProjects_();
        } else {
          save.disabled = false; save.textContent = 'Save';
          errMsg.textContent = 'Update failed.';
        }
      })
      .withFailureHandler((e) => {
        save.disabled = false; save.textContent = 'Save';
        errMsg.textContent = String(e && e.message || e);
      })
      .consoleUpdateProjectClasses(p.projectId, chosen);
  });

  // --- Populate the picker (checkboxes only — no free text, so no typos) once
  //     the available classes are known. Classes are real entities now; new ones
  //     are created in Admin → Classes, then appear here. ---
  function populate(allClasses) {
    const sorted = (allClasses || []).slice().sort();
    box.innerHTML = '';
    if (sorted.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'modal__error';
      empty.textContent = isAdmin
        ? 'No classes yet. Create one in Admin → Classes, then add it here.'
        : 'No classes available to you.';
      box.appendChild(empty);
      updateSaveBtn();
      return;
    }
    const rowLabels = classLabelsFor_(sorted, isAdmin);
    sorted.forEach((cls) => {
      const lockedForTeacher = !isAdmin && teacherClasses.indexOf(cls) < 0;
      box.appendChild(makeClassCheckboxRow_({
        label: rowLabels[cls], value: cls, checked: !!selected[cls], locked: lockedForTeacher,
        onToggle: (on) => { if (on) selected[cls] = true; else delete selected[cls]; updateSaveBtn(); },
      }));
    });
    updateSaveBtn();
  }

  // Union of available classes ∪ the project's current member-classes, so a
  // class already on the project (even a legacy one no longer in the Classes
  // tab) gets a checkbox and can be removed.
  if (isAdmin) {
    google.script.run
      .withSuccessHandler((resp) => {
        const set = {};
        ((resp && resp.classes) || []).forEach((c) => { set[c] = true; });
        current.forEach((c) => { set[c] = true; });
        populate(Object.keys(set));
      })
      .withFailureHandler((e) => { box.innerHTML = ''; errMsg.textContent = 'Could not load classes: ' + String(e && e.message || e); })
      .consoleListAllClasses();
  } else {
    const set = {};
    teacherClasses.forEach((c) => { set[c] = true; });
    current.forEach((c) => { set[c] = true; });
    populate(Object.keys(set));
  }
}

// DASHBOARD view-local state. Reset when projectId changes.
const dashboard = {
  loadedFor: null,         // projectId of currently-loaded data
  data: null,              // { project, students, asOf }
  sortKey: 'activity',     // 'name' | 'activity' | 'completion' | 'highlights' | 'sources'
  sortDir: 'desc',         // 'asc' | 'desc'
  asOfTickHandle: null,
  lastRowCount: {},        // projectId → last rendered row count (sizes the load skeleton)
};

function renderDashboard_(main) {
  // Reset cache if we navigated to a different project OR class period.
  const dashKey = state.projectId + '|' + (state.className || '');
  if (dashboard.loadedFor !== dashKey) {
    dashboard.loadedFor = null;
    dashboard.data = null;
    state.manageGroups = false;
    state.collapsedGroups = {};
    state.dashboardSelection = {};
  }

  // Toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'db-toolbar';
  const back = document.createElement('button');
  back.className = 'db-back';
  back.textContent = '← My Projects';
  back.addEventListener('click', () => navigate_('/projects'));
  toolbar.appendChild(back);

  const title = document.createElement('div');
  title.className = 'db-title';
  title.id = 'db-title';
  title.textContent = 'Loading…';
  toolbar.appendChild(title);

  const refresh = document.createElement('button');
  refresh.className = 'db-refresh';
  refresh.id = 'db-refresh';
  refresh.textContent = '↻ Refresh';
  refresh.addEventListener('click', () => fetchDashboard_(state.projectId, true));
  toolbar.appendChild(refresh);

  const editReqBtn = document.createElement('button');
  editReqBtn.className = 'db-refresh';   // same toolbar-button style as Refresh
  editReqBtn.id = 'db-edit-req';
  editReqBtn.textContent = 'Edit requirements';
  editReqBtn.addEventListener('click', () => openEditRequirementsModal_());
  toolbar.appendChild(editReqBtn);

  const manageBtn = document.createElement('button');
  manageBtn.className = 'db-manage' + (state.manageGroups ? ' db-manage--on' : '');
  manageBtn.id = 'db-manage';
  manageBtn.textContent = state.manageGroups ? '✓ Manage groups' : 'Manage groups';
  manageBtn.addEventListener('click', () => {
    state.manageGroups = !state.manageGroups;
    state.dashboardSelection = {};
    paintDashboard_();
    // Reset the toolbar so the toggle's visual reflects the new state.
    const replacement = document.getElementById('db-manage');
    if (replacement) {
      replacement.classList.toggle('db-manage--on', state.manageGroups);
      replacement.textContent = state.manageGroups ? '✓ Manage groups' : 'Manage groups';
    }
  });
  toolbar.appendChild(manageBtn);

  const asof = document.createElement('div');
  asof.className = 'db-asof';
  asof.id = 'db-asof';
  asof.textContent = '';
  toolbar.appendChild(asof);

  main.appendChild(toolbar);

  // Flex wrapper holding class tabs (left) and category legend (right)
  const subRow = document.createElement('div');
  subRow.className = 'db-sub-row';

  const classTabs = document.createElement('div');
  classTabs.className = 'db-classtabs';
  classTabs.id = 'db-classtabs';
  subRow.appendChild(classTabs);

  const legend = document.createElement('div');
  legend.className = 'db-legend';
  legend.id = 'db-legend';
  subRow.appendChild(legend);

  main.appendChild(subRow);

  const body = document.createElement('div');
  body.className = 'db-body';
  body.id = 'db-body';
  main.appendChild(body);

  if (dashboard.data) {
    paintDashboard_();
  } else {
    const cached = viewCacheGet_('dash:' + dashKey);
    if (cached) {
      // Paint the last-known table immediately (its as-of stamp shows its age)
      // and refresh behind it — the toolbar button reads "Updating…" meanwhile.
      dashboard.loadedFor = dashKey;
      dashboard.data = cached;
      dashboard.fromCache = true;
      paintDashboard_();
      fetchDashboard_(state.projectId, true, false);
    } else {
      // Skeleton table for instant structure while the (fast, parallel) fetch
      // runs — better perceived speed than a centered spinner. Sized from the
      // last-known row count for this project, else a sensible default.
      body.innerHTML = '';
      body.appendChild(buildDashboardSkeleton_(dashboard.lastRowCount[state.projectId] || 8));
      fetchDashboard_(state.projectId, false);
    }
  }

  // Refresh on tab focus, but only while we are on the dashboard view — and
  // only if the data is older than FOCUS_REFRESH_MIN_MS, using the server's
  // short cache (a full recompute on every tab switch was a big part of the
  // "always loading" feel).
  if (!window.__opsConsoleFocusBound) {
    window.__opsConsoleFocusBound = true;
    window.addEventListener('focus', () => {
      if (state.view === 'DASHBOARD' && state.projectId) {
        if (Date.now() - (dashboard.fetchedAt || 0) > FOCUS_REFRESH_MIN_MS) fetchDashboard_(state.projectId, true, false);
      }
      if (state.view === 'STUDENT' && state.projectId && state.studentEmail) {
        if (typeof fetchStudentDetail_ === 'function' &&
            Date.now() - (studentDetail.fetchedAt || 0) > FOCUS_REFRESH_MIN_MS) {
          fetchStudentDetail_(state.projectId, state.studentEmail);
        }
      }
    });
  }

  // Live "last refreshed" ticker
  startAsOfTicker_();
}

/**
 * @param {boolean} isRefresh    Show the in-flight state on the Refresh button
 *                               (existing data stays painted).
 * @param {boolean} [bypassCache] Skip the server's short-TTL cache. Defaults to
 *                               `isRefresh` (the manual button); background
 *                               revalidations pass false.
 */
function fetchDashboard_(projectId, isRefresh, bypassCache) {
  const bypass = bypassCache === undefined ? !!isRefresh : !!bypassCache;
  if (isRefresh) {
    const btn = document.getElementById('db-refresh');
    if (btn) { btn.disabled = true; btn.textContent = bypass ? '↻ Refreshing…' : '↻ Updating…'; }
  }
  const key = projectId + '|' + (state.className || '');
  google.script.run
    .withSuccessHandler((resp) => {
      const btn = document.getElementById('db-refresh');
      if (btn) { btn.disabled = false; btn.textContent = '↻ Refresh'; }
      if (!resp || !resp.ok) {
        setStatus('Could not load dashboard.', 'bad', 4000);
        return;
      }
      viewCachePut_('dash:' + key, resp);
      // The user may have navigated on while this was in flight.
      if (state.view !== 'DASHBOARD' || (state.projectId + '|' + (state.className || '')) !== key) return;
      dashboard.loadedFor = key;
      dashboard.data = resp;
      dashboard.fetchedAt = Date.now();
      dashboard.fromCache = false;
      paintDashboard_();
    })
    .withFailureHandler((e) => {
      const btn = document.getElementById('db-refresh');
      if (btn) { btn.disabled = false; btn.textContent = '↻ Refresh'; }
      onFail_('loading dashboard')(e);
    })
    // Scope to the selected class period (null = all). The manual Refresh
    // bypasses the server's short-TTL cache; normal loads use it.
    .consoleGetProjectDashboard(projectId, state.className || null, bypass);
}

function maybeRenderUnarchiveBanner_(main, data) {
  if (!data.recentUnarchive) return;
  const dismissedKey = 'dismissedUnarchive:' + data.recentUnarchive.eventId;
  if (localStorage.getItem(dismissedKey)) return;

  const banner = document.createElement('div');
  banner.className = 'unarchive-banner';

  const icon = document.createElement('span');
  icon.className = 'unarchive-banner__icon';
  icon.textContent = 'ⓘ';
  banner.appendChild(icon);

  const text = document.createElement('div');
  text.className = 'unarchive-banner__text';
  const when = new Date(data.recentUnarchive.at);
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dateStr = monthNames[when.getMonth()] + ' ' + when.getDate() + ', ' + when.getFullYear();
  text.innerHTML =
    '<strong>This project was unarchived</strong> by ' +
    esc_(data.recentUnarchive.actor) + ' on ' + dateStr + '.<br>' +
    '<span class="unarchive-banner__sub">Students who had it set as active will need to re-select it.</span>';
  banner.appendChild(text);

  const close = document.createElement('button');
  close.className = 'unarchive-banner__close';
  close.textContent = '×';
  close.title = 'Dismiss';
  close.addEventListener('click', () => {
    localStorage.setItem(dismissedKey, '1');
    if (banner.parentNode) banner.parentNode.removeChild(banner);
  });
  banner.appendChild(close);

  main.appendChild(banner);
}

function paintDashboard_() {
  if (!dashboard.data) return;
  const proj = dashboard.data.project;
  const title = document.getElementById('db-title');
  if (title) {
    const classes = classLabelJoin_(proj.scopedClasses) || '(no classes)';
    const totalStudents = dashboard.data.students.length;
    const groupCount = (dashboard.data.groups || []).length;
    let label = proj.name + ' · ' + classes + ' · ' + totalStudents + ' student' + (totalStudents === 1 ? '' : 's');
    if (groupCount > 0) label += ' · ' + groupCount + ' group' + (groupCount === 1 ? '' : 's');
    title.textContent = label;
  }

  // Class-period toggle — only when the caller teaches 2+ classes in this
  // project. The active class is encoded in the URL, so a refresh comes back to it.
  const tabsHost = document.getElementById('db-classtabs');
  if (tabsHost) {
    tabsHost.innerHTML = '';
    const avail = proj.availableClasses || [];
    if (avail.length >= 2) {
      const active = proj.activeClass || null;   // null = All classes
      const mkTab = (label, cls) => {
        const b = document.createElement('button');
        b.className = 'db-classtab' + (((cls || null) === active) ? ' db-classtab--on' : '');
        b.textContent = label;
        b.addEventListener('click', () => {
          if ((cls || null) === active) return;
          navigate_('/projects/' + encodeURIComponent(state.projectId) + (cls ? '/class/' + encodeURIComponent(cls) : ''));
        });
        return b;
      };
      tabsHost.appendChild(mkTab('All classes', null));
      const tabLabels = classLabelsFor_(avail);
      avail.forEach((c) => tabsHost.appendChild(mkTab(tabLabels[c], c)));
    }
  }

  const body = document.getElementById('db-body');
  if (!body) return;
  body.innerHTML = '';

  maybeRenderUnarchiveBanner_(body, dashboard.data);
  paintDashboardLegend_(proj);

  if (dashboard.data.students.length === 0 && (dashboard.data.groups || []).length === 0) {
    const e = document.createElement('div');
    e.className = 'db-empty';
    e.textContent = 'No students enrolled in your classes for this project.';
    body.appendChild(e);
  } else {
    if (state.manageGroups) {
      body.appendChild(buildManageGroupsBar_());
    }
    body.appendChild(buildDashboardTable_());
  }

  // Remember the rendered row count so a later re-entry (cache cleared) shows a
  // right-sized load skeleton instead of a generic one.
  if (dashboard.loadedFor) {
    const rowCount = (dashboard.data.students || []).length + (dashboard.data.groups || []).length;
    if (rowCount > 0) dashboard.lastRowCount[dashboard.loadedFor] = rowCount;
  }

  updateAsOf_();
}

function paintDashboardLegend_(proj) {
  const host = document.getElementById('db-legend');
  if (!host) return;
  host.innerHTML = '';

  const bundle = proj && proj.bundle;
  if (!bundle) return;

  const isCustom = !!bundle.custom;

  // Title/Prefix
  const title = document.createElement('span');
  title.className = 'db-legend__title';
  title.textContent = isCustom ? 'Custom categories (student-defined):' : 'Categories:';
  host.appendChild(title);

  // Legend Items
  const itemsContainer = document.createElement('div');
  itemsContainer.className = 'db-legend__items';

  // Bundles always contain up to 5 categories
  for (let i = 1; i <= 5; i++) {
    const label = bundle['label' + i];
    const color = bundle['color' + i];
    if (!label) continue;

    const item = document.createElement('div');
    item.className = 'db-legend__item';

    const dot = document.createElement('span');
    dot.className = 'db-legend__dot';
    dot.style.backgroundColor = color || '#dadce0';
    item.appendChild(dot);

    const txt = document.createElement('span');
    txt.className = 'db-legend__label';
    txt.textContent = label;
    item.appendChild(txt);

    itemsContainer.appendChild(item);
  }

  if (isCustom) {
    host.classList.add('db-legend--disabled');
    host.title = 'Students define their own categories for this project.';
  } else {
    host.classList.remove('db-legend--disabled');
    host.removeAttribute('title');
  }

  host.appendChild(itemsContainer);
}

/**
 * Skeleton table shown the instant the dashboard view opens, before data
 * returns. Mirrors the real table's columns so the swap is visually stable.
 */
function buildDashboardSkeleton_(rowCount) {
  const n = Math.min(Math.max(rowCount || 8, 4), 40);
  const table = document.createElement('table');
  table.className = 'db-table db-table--skeleton';

  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  ['Student', 'Category mix', 'Completion', 'Requirements', 'Activity'].forEach((h) => {
    const th = document.createElement('th');
    th.textContent = h;
    th.style.cursor = 'default';
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  // Vary bar widths per column so the placeholder reads as a real table.
  const widths = ['db-skel-bar--wide', '', '', 'db-skel-bar--narrow', 'db-skel-bar--narrow'];
  for (let i = 0; i < n; i++) {
    const tr = document.createElement('tr');
    for (let c = 0; c < widths.length; c++) {
      const td = document.createElement('td');
      const bar = document.createElement('div');
      bar.className = 'db-skel-bar ' + widths[c];
      td.appendChild(bar);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  return table;
}

/**
 * Shared shimmer skeletons (reuse the dashboard's .db-skel-bar). Used by the
 * admin tables, drill-downs, and modals so every console page animates while it
 * loads instead of showing a static "Loading…".
 */
function buildSkeletonLines_(count, widths) {
  const wrap = document.createElement('div');
  wrap.className = 'skel-lines';
  const w = widths || ['db-skel-bar--wide', '', 'db-skel-bar--narrow'];

    const bar = document.createElement('div');
    bar.className = 'db-skel-bar ' + (w[i % w.length] || '');

/** Shimmer skeleton table matching the .admin-table shape (last col = kebab, blank). */
function buildAdminTableSkeleton_(headers, rowCount, colWidths) {
  const n = Math.min(Math.max(rowCount || 6, 3), 30);
  const table = document.createElement('table');
  table.className = 'admin-table admin-table--skeleton';
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  headers.forEach((h) => { const th = document.createElement('th'); th.textContent = h; trh.appendChild(th); });
  thead.appendChild(trh);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  for (let i = 0; i < n; i++) {
    const tr = document.createElement('tr');
    headers.forEach((h, c) => {
      const td = document.createElement('td');
      if (c < headers.length - 1) {   // skip the trailing kebab column
        const bar = document.createElement('div');
        bar.className = 'db-skel-bar ' + ((colWidths && colWidths[c]) || '');
        td.appendChild(bar);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  return table;
}

function startAsOfTicker_() {
  if (dashboard.asOfTickHandle) clearInterval(dashboard.asOfTickHandle);
  dashboard.asOfTickHandle = setInterval(updateAsOf_, 10000);
}

function updateAsOf_() {
  if (!dashboard.data) return;
  const el = document.getElementById('db-asof');
  if (!el) return;
  el.textContent = 'Refreshed ' + relativeTime_(dashboard.data.asOf);
}

function relativeTime_(iso) {
  if (!iso) return 'never';
  const d = new Date(iso);
  const diff = Math.max(0, (Date.now() - d.getTime()) / 1000);
  if (diff < 60)    return Math.floor(diff) + 's ago';
  if (diff < 3600)  return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function buildDashboardTable_() {
  const table = document.createElement('table');
  table.className = 'db-table';

  const headers = [
    { key: 'name',         label: 'Student' },
    { key: 'highlights',   label: 'Category mix' },
    { key: 'completion',   label: 'Completion' },
    { key: 'gaps',         label: 'Requirements' },
    { key: 'activity',     label: 'Activity' },
  ];

  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  if (state.manageGroups) {
    const thChk = document.createElement('th');
    thChk.className = 'db-th-checkbox';
    trh.appendChild(thChk);
  }
  headers.forEach((h) => {
    const th = document.createElement('th');
    const sortable = (h.key !== 'gaps');
    th.textContent = h.label;
    if (sortable) {
      const arrow = document.createElement('span');
      arrow.className = 'db-th-arrow';
      arrow.textContent = dashboard.sortKey === h.key ? (dashboard.sortDir === 'asc' ? '▲' : '▼') : '';
      th.appendChild(arrow);
      th.addEventListener('click', () => {
        if (dashboard.sortKey === h.key) {
          dashboard.sortDir = dashboard.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          dashboard.sortKey = h.key;
          dashboard.sortDir = (h.key === 'name') ? 'asc' : 'desc';
        }
        paintDashboard_();
      });
    } else {
      th.style.cursor = 'default';
    }
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  const rows = sortedDashboardRows_();
  rows.forEach((entry) => {
    if (entry.kind === 'group') {
      tbody.appendChild(buildGroupHeaderRow_(entry.group, entry.members));
      if (!state.collapsedGroups[entry.group.groupId]) {
        entry.members.forEach((m) => tbody.appendChild(buildStudentRow_(m, entry.group)));
      }
    } else {
      tbody.appendChild(buildStudentRow_(entry.student, null));
    }
  });
  table.appendChild(tbody);

  return table;
}

/**
 * Partition the dashboard data into solo students + group blocks, then sort:
 *   - group blocks are sorted by group name (asc) under the current sort key
 *     for their header row's value; members inside are sorted by the same key.
 *   - solo students are sorted normally.
 *   - The combined list interleaves group blocks and solos by the header row's
 *     sort value, so they share a single sorted axis.
 *
 * Returns [{kind: 'group', group, members[]} | {kind: 'student', student}, ...]
 */
function sortedDashboardRows_() {
  const students = dashboard.data.students || [];
  const groups = dashboard.data.groups || [];
  // Build (groupId → group obj) and (groupId → members[]).
  const memberByGroup = {};
  const solo = [];
  students.forEach((s) => {
    if (s.groupId) {
      if (!memberByGroup[s.groupId]) memberByGroup[s.groupId] = [];
      memberByGroup[s.groupId].push(s);
    } else {
      solo.push(s);
    }
  });

  const cmpDir = dashboard.sortDir === 'asc' ? 1 : -1;
  const cmp = (a, b) => {
    switch (dashboard.sortKey) {
      case 'name': {
        const an = (a.name || a.groupName || '').toString();
        const bn = (b.name || b.groupName || '').toString();
        return cmpDir * an.localeCompare(bn);
      }
      case 'completion':  return cmpDir * (a._sortCompletion - b._sortCompletion);
      case 'highlights':  return cmpDir * (a._sortHl - b._sortHl);
      case 'sources':     return cmpDir * (a._sortSrc - b._sortSrc);
      case 'activity':
      default:            return cmpDir * String(a._sortAct || '').localeCompare(String(b._sortAct || ''));
    }
  };

  // Annotate each entry with cmp keys.
  const annotateStudent = (s) => ({
    _sortKind: 'student',
    name: formatLastFirst_(s.name),
    _sortCompletion: s.completion ? s.completion.percent : 0,
    _sortHl: s.highlightCount || 0,
    _sortSrc: s.sourceCount || 0,
    _sortAct: s.lastActivity || '',
    student: s,
  });
  const annotateGroup = (g, members) => ({
    _sortKind: 'group',
    groupName: g.name,
    name: g.name,
    _sortCompletion: g.completion ? g.completion.percent : 0,
    _sortHl: g.highlightCount || 0,
    _sortSrc: g.sourceCount || 0,
    _sortAct: g.lastActivity || '',
    group: g,
    members,
  });

  const annotated = [].concat(
    solo.map(annotateStudent),
    groups.map((g) => {
      const m = (memberByGroup[g.groupId] || []).slice().map(annotateStudent);
      m.sort(cmp);
      return annotateGroup(g, m.map((x) => x.student));
    })
  );
  annotated.sort(cmp);

  return annotated.map((e) =>
    e._sortKind === 'group'
      ? { kind: 'group', group: e.group, members: e.members }
      : { kind: 'student', student: e.student }
  );
}

function buildGroupHeaderRow_(group, members) {
  const tr = document.createElement('tr');
  tr.className = 'db-group-header';
  const collapsed = !!state.collapsedGroups[group.groupId];

  if (state.manageGroups) {
    const tdChk = document.createElement('td');
    tdChk.className = 'db-td-checkbox';
    const chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.checked = state.dashboardSelection[group.groupId] === 'group';
    chk.addEventListener('click', (e) => {
      e.stopPropagation();
      if (chk.checked) state.dashboardSelection[group.groupId] = 'group';
      else delete state.dashboardSelection[group.groupId];
      if (typeof updateManageBar_ === 'function') updateManageBar_();
    });
    tdChk.appendChild(chk);
    tr.appendChild(tdChk);
  }

  // Name cell: chevron + [grp] + name + member count
  const tdName = document.createElement('td');
  const wrap = document.createElement('div');
  wrap.className = 'db-row__name db-row__name--group';
  const chev = document.createElement('span');
  chev.className = 'db-group-chev';
  chev.textContent = collapsed ? '▶' : '▼';
  chev.addEventListener('click', (e) => {
    e.stopPropagation();
    if (collapsed) delete state.collapsedGroups[group.groupId];
    else state.collapsedGroups[group.groupId] = true;
    paintDashboard_();
  });
  wrap.appendChild(chev);
  const label = document.createElement('span');
  label.className = 'db-group-label';
  label.textContent = '[grp] ' + group.name + '  · ' + group.memberCount + ' member' + (group.memberCount === 1 ? '' : 's');
  wrap.appendChild(label);
  tdName.appendChild(wrap);
  const cls = document.createElement('div');
  cls.className = 'db-row__name-class';
  cls.textContent = group.className;
  tdName.appendChild(cls);
  tr.appendChild(tdName);

  // Aggregate columns mirror the student row's
  const reqs = (dashboard.data && dashboard.data.project && dashboard.data.project.requirements) || null;
  const tdMix = document.createElement('td');
  tdMix.appendChild(buildMixBar_(group.categoryMix));
  tr.appendChild(tdMix);
  const tdComp = document.createElement('td');
  tdComp.appendChild(buildCompletionCell_(group.completion));
  tr.appendChild(tdComp);
  const tdGaps = document.createElement('td');
  tdGaps.appendChild(buildRequirementsCell_(group.gaps, group, reqs));
  tr.appendChild(tdGaps);
  const tdAct = document.createElement('td');
  tdAct.className = 'db-activity' + (group.lastActivity ? '' : ' db-activity--never');
  tdAct.textContent = group.lastActivity ? relativeTime_(group.lastActivity) : '—';
  tr.appendChild(tdAct);

  // Body click → group drill-down (only when not in Manage mode).
  tr.addEventListener('click', (e) => {
    // Click on the chevron is handled by chev's listener (stopPropagation above).
    if (state.manageGroups) return;
    navigate_(projectPath_('groups', group.groupId));
  });

  return tr;
}

/**
 * Sources-count cell. With a minSources requirement it reads "<count> / <min>"
 * colored met/unmet; without one it falls back to the plain count so an
 * unset-requirements project looks unchanged. `requirements` = the project's
 * requirements object (may be null/empty).
 */
/**
 * One uniform Requirements-cell chip. status ∈ 'good' | 'warn' | 'bad' |
 * 'neutral'. Every indicator (sources, depth, gaps, all-clear) renders through
 * this so the cell reads consistently.
 */
function reqChip_(text, status, title) {
  const chip = document.createElement('span');
  chip.className = 'db-req db-req--' + status;
  chip.textContent = text;
  if (title) chip.title = title;
  return chip;
}

function updateManageBar_() {
  const summary = document.getElementById('db-manage-summary');
  const mergeBtn = document.getElementById('db-manage-merge');
  const moveBtn = document.getElementById('db-manage-move');
  const disbandBtn = document.getElementById('db-manage-disband');
  if (!summary) return;

  const sel = state.dashboardSelection || {};
  const keys = Object.keys(sel);
  const studentKeys = keys.filter((k) => sel[k] === 'student');
  const groupKeys = keys.filter((k) => sel[k] === 'group');

  summary.textContent = 'Manage groups mode — click rows to select.  ' + keys.length + ' selected.';

  // Merge: 2-4 solo students of the same class.
  const soloStudentsOfSameClass = (() => {
    if (studentKeys.length < 2 || studentKeys.length > 4) return false;
    if (groupKeys.length !== 0) return false;
    const data = dashboard.data;
    if (!data) return false;
    const byEmail = {};
    data.students.forEach((s) => { byEmail[s.email] = s; });
    const rows = studentKeys.map((k) => byEmail[k]).filter(Boolean);
    if (rows.length !== studentKeys.length) return false;
    if (rows.some((r) => r.groupId)) return false;       // must be solo
    const classes = {};
    rows.forEach((r) => { classes[r.class] = true; });
    return Object.keys(classes).length === 1;
  })();
  mergeBtn.textContent = '+ Merge into group (' + studentKeys.length + ')';
  mergeBtn.disabled = !soloStudentsOfSameClass;

  // Move / Add: exactly one student selected (no groups). A grouped student
  // moves to another group; a solo student is added to one — same button,
  // relabeled to match the selection.
  const removeBtn = document.getElementById('db-manage-remove');
  const selectedStudent = (studentKeys.length === 1 && groupKeys.length === 0 && dashboard.data)
    ? (dashboard.data.students || []).find((s) => s.email === studentKeys[0])
    : null;
  if (moveBtn) {
    moveBtn.disabled = !selectedStudent;
    moveBtn.textContent = (selectedStudent && selectedStudent.groupId) ? 'Move to ▾' : 'Add to group ▾';
  }

  // Remove from group: exactly one grouped student selected.
  if (removeBtn) removeBtn.disabled = !(selectedStudent && selectedStudent.groupId);

  // Disband: exactly one group selected.
  disbandBtn.disabled = !(groupKeys.length === 1 && studentKeys.length === 0);
}

function buildMixBar_(mix) {
  const wrap = document.createElement('div');
  wrap.className = 'db-mix';
  const total = mix.reduce((acc, m) => acc + m.count, 0);
  if (total === 0) return wrap;   // empty bar — hatched background only
  mix.forEach((m) => {
    if (m.count === 0) return;
    const seg = document.createElement('div');
    seg.className = 'db-mix__seg';
    seg.style.backgroundColor = m.color;
    seg.style.flex = m.count + ' 0 auto';
    seg.title = m.label + ': ' + m.count;
    wrap.appendChild(seg);
  });
  return wrap;
}

function buildCompletionCell_(comp) {
  const wrap = document.createElement('div');
  wrap.className = 'db-completion-wrap';
  const bar = document.createElement('div');
  bar.className = 'db-completion-bar';
  const fill = document.createElement('div');
  const klass = comp.percent >= 80 ? 'db-completion-fill--good'
             : comp.percent >= 40 ? 'db-completion-fill--warn'
             : 'db-completion-fill--bad';
  fill.className = 'db-completion-fill ' + klass;
  fill.style.width = comp.percent + '%';
  bar.appendChild(fill);
  wrap.appendChild(bar);
  const pct = document.createElement('div');
  pct.className = 'db-completion-pct';
  pct.textContent = comp.percent + '%';
  wrap.appendChild(pct);
  return wrap;
}

/**
 * Status-signals cell for a dashboard row: cite/tag/note gap pills plus (when
 * the project sets requirements) the evidence-depth badge. The Note pill is
 * suppressed when the project marks annotations optional (requireAnnotation
 * === false); Cite and Tag are always shown. `row` carries evidenceDepth;
 * `requirements` is the project's requirements object (may be null/empty).
 */
/**
 * The Requirements cell. Top row = teacher-set targets (sources, evidence
 * depth), shown only when the project sets them. Bottom row = completion gaps
 * (cite/tag/note), non-zero only. A student with no sources shows a neutral
 * "—"; one who has met everything shows a single green "✓ complete". Works for
 * both student and group rows (both carry sourcesProgress + evidenceDepth).
 */
function buildRequirementsCell_(gaps, row, requirements) {
  const wrap = document.createElement('div');
  wrap.className = 'db-reqcell';
  const reqs = requirements || {};
  gaps = gaps || {};
  const total = (row && row.sourceCount) || 0;

  // Fixed order — Sources · Depth · Cite · Tag · Note. Every chip that applies
  // to the project ALWAYS renders (color encodes status: green met / amber
  // partial / red behind / gray nothing-yet), so the chips line up in the same
  // slots when scanning down the column. Completed ones stay in place, green.

  // Sources target (only when the project sets one).
  if (reqs.minSources && row && row.sourcesProgress) {
    wrap.appendChild(reqChip_(
      'Sources ' + total + '/' + reqs.minSources,
      row.sourcesProgress.meets ? 'good' : 'bad',
      total + ' of ' + reqs.minSources + ' sources'));
  }

  // Evidence-depth target (only when the project sets one).
  if (row && row.evidenceDepth && row.evidenceDepth.targetSet) {
    const d = row.evidenceDepth;
    const status = d.total === 0 ? 'neutral'
                 : (d.sourcesMeeting === d.total ? 'good'
                 : (d.sourcesMeeting > 0 ? 'warn' : 'bad'));
    wrap.appendChild(reqChip_(
      'Depth ' + d.sourcesMeeting + '/' + d.total,
      status,
      d.sourcesMeeting + ' of ' + d.total + ' sources meet the evidence target'));
  }

  // Per-source completion dimensions — always shown as done/total. Note drops
  // out only when the project marks annotations optional.
  const dims = [
    { key: 'citation',       label: 'Cite', verb: 'cited' },
    { key: 'classification', label: 'Tag',  verb: 'tagged' },
    { key: 'annotation',     label: 'Note', verb: 'annotated' },
  ];
  const annotationRequired = reqs.requireAnnotation !== false;
  dims.forEach((dim) => {
    if (dim.key === 'annotation' && !annotationRequired) return;
    const missing = gaps[dim.key] || 0;
    const done = Math.max(0, total - missing);
    const status = total === 0 ? 'neutral'
                 : (missing === 0 ? 'good'
                 : (missing <= 3 ? 'warn' : 'bad'));
    wrap.appendChild(reqChip_(
      dim.label + ' ' + done + '/' + total,
      status,
      done + ' of ' + total + ' sources ' + dim.verb));
  });

  return wrap;
}

/** Format roster Name ("Alex Smith") as "Smith, Alex". Falls back to as-is. */
function formatLastFirst_(name) {
  const s = String(name || '').trim();
  if (!s) return '';
  const sp = s.lastIndexOf(' ');
  if (sp < 0) return s;
  return s.slice(sp + 1) + ', ' + s.slice(0, sp);
}
