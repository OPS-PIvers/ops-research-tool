<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <?!= includeFile_('sidebar_css') ?>
  </head>
  <body class="sb-body">
    <header class="sb-header">
      <div class="sb-header__row">
        <h1 class="sb-title">OPS Research Tool</h1>
      </div>
      <div id="sb-actor" class="sb-actor"></div>
    </header>

    <section class="sb-project-picker">
      <label for="sb-project">Project</label>
      <select id="sb-project" disabled>
        <option>Loading…</option>
      </select>
    </section>

    <section class="sb-viewmode">
      <div class="sb-viewmode__pills" role="tablist">
        <button id="sb-vm-evidence" type="button" class="sb-viewmode__pill sb-viewmode__pill--active" role="tab">By evidence</button>
        <button id="sb-vm-source" type="button" class="sb-viewmode__pill" role="tab">By source</button>
      </div>
    </section>

    <section id="sb-filter" class="sb-filter" hidden>
      <div class="sb-sortfilter" id="sb-sortfilter">
        <button id="sb-sortfilter-trigger" type="button" aria-haspopup="menu" aria-expanded="false">
          <span>Sort &amp; Filter</span>
          <span id="sb-sortfilter-badge" class="sb-sortfilter__badge" hidden></span>
          <span class="sb-sortfilter__caret" aria-hidden="true">▾</span>
        </button>
        <div id="sb-sortfilter-pop" class="sb-sortfilter-pop" role="menu" aria-label="Sort and filter" hidden>
          <div class="sb-pop-section">
            <div class="sb-pop-section__title">Sort by</div>
            <div id="sb-sort-opts"></div>
          </div>
          <div class="sb-pop-section">
            <div class="sb-pop-section__title">Categories</div>
            <div id="sb-filter-cats"></div>
          </div>
          <div class="sb-pop-section">
            <div class="sb-pop-section__title">Type</div>
            <div class="sb-filter__row sb-filter__row--ps">
              <label class="sb-ps-chip"><input type="checkbox" id="sb-flt-primary" checked /> Primary</label>
              <label class="sb-ps-chip"><input type="checkbox" id="sb-flt-secondary" checked /> Secondary</label>
              <label class="sb-ps-chip"><input type="checkbox" id="sb-flt-unset" checked /> Unset</label>
            </div>
          </div>
          <div class="sb-pop-actions">
            <button id="sb-filter-clear" type="button">Clear all</button>
          </div>
        </div>
      </div>
    </section>

    <main id="sb-main" class="sb-main">
      <div class="sb-empty">Pick a project to begin.</div>
    </main>

    <footer class="sb-footer">
      <button id="sb-open-editor" type="button" class="sb-footer-btn sb-footer-btn--secondary" disabled>Open Editor</button>
      <div class="sb-insert-menu" id="sb-insert-menu">
        <button id="sb-insert-trigger" type="button" aria-haspopup="menu" aria-expanded="false" disabled>Insert References <span class="sb-insert__caret" aria-hidden="true">▾</span></button>
        <div id="sb-insert-pop" class="sb-insert-pop" role="menu" aria-label="Insert references" hidden>
          <button id="sb-insert-annotated" type="button" class="sb-insert-pop__item" role="menuitem">
            <span class="sb-insert-pop__title">Annotated Bibliography</span>
            <span class="sb-insert-pop__sub">Citations + your annotations</span>
          </button>
          <button id="sb-insert-works" type="button" class="sb-insert-pop__item" role="menuitem">
            <span class="sb-insert-pop__title">Works Cited</span>
            <span class="sb-insert-pop__sub">Citations only</span>
          </button>
        </div>
      </div>
      <div id="sb-status" class="sb-status"></div>
    </footer>

    <?!= includeFile_('sidebar_js') ?>
  </body>
</html>
