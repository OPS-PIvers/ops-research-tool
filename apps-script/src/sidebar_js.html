<script>
// All server calls go through google.script.run. State lives in `state`;
// every interaction mutates state then re-renders. Render is full-redraw
// per change — sidebar is small and re-renders are cheap.


const state = {
  ctx: null,           // sidebarGetContext response
  projectId: null,
  sources: [],
  highlights: [],
  filterCat: null,     // null = all categories
  filterPS: { primary: true, secondary: true, unset: true },
  viewMode: 'evidence',     // 'evidence' | 'source'
  expandedSourceIds: {},    // sourceId → true (highlights visible in source mode)
  sourceFilters: {},        // sourceId → category label (per-source filter, source mode only)
  modalOpenForSourceId: null,   // sourceId of the currently-open modal (drives polling)
  lastDataJson: null,           // JSON of last sidebarGetProjectData response (polling diff)
  pollHandle: null,             // setInterval handle for the modal-open polling loop
  pollUnchangedTicks: 0,        // bounded fallback stop counter
};

const els = {
  actor: document.getElementById('sb-actor'),
  project: document.getElementById('sb-project'),
  vmEvidence: document.getElementById('sb-vm-evidence'),
  vmSource: document.getElementById('sb-vm-source'),
  filter: document.getElementById('sb-filter'),
  filterCats: document.getElementById('sb-filter-cats'),
  fltPrim: document.getElementById('sb-flt-primary'),
  fltSec: document.getElementById('sb-flt-secondary'),
  fltUnset: document.getElementById('sb-flt-unset'),
  main: document.getElementById('sb-main'),
  insertTrigger: document.getElementById('sb-insert-trigger'),
  insertMenu: document.getElementById('sb-insert-menu'),
  insertPop: document.getElementById('sb-insert-pop'),
  insertAnnotated: document.getElementById('sb-insert-annotated'),
  insertWorks: document.getElementById('sb-insert-works'),
  openEditor: document.getElementById('sb-open-editor'),
  status: document.getElementById('sb-status'),
};

bootstrap();

function bootstrap() {
  setStatus('Loading…');
  renderSidebarLoading_();
  google.script.run
    .withSuccessHandler(onContext)
    .withFailureHandler(onFail('loading context'))
    .sidebarGetContext();

  els.project.addEventListener('change', () => {
    state.projectId = els.project.value;
    google.script.run.sidebarSetActiveProject(state.projectId);
    loadProjectData();
  });
  els.fltPrim.addEventListener('change', () => { state.filterPS.primary = els.fltPrim.checked; render(); });
  els.fltSec.addEventListener('change', () => { state.filterPS.secondary = els.fltSec.checked; render(); });
  els.fltUnset.addEventListener('change', () => { state.filterPS.unset = els.fltUnset.checked; render(); });
  els.vmEvidence.addEventListener('click', () => setViewMode_('evidence'));
  els.vmSource.addEventListener('click', () => setViewMode_('source'));
  els.insertTrigger.addEventListener('click', toggleInsertMenu_);
  els.insertAnnotated.addEventListener('click', () => { closeInsertMenu_(); insertBibliography(true); });
  els.insertWorks.addEventListener('click', () => { closeInsertMenu_(); insertBibliography(false); });
  els.openEditor.addEventListener('click', openEditorFromFooter_);

  // Dismiss the insert popover on outside click or Escape.
  document.addEventListener('click', (e) => {
    if (!els.insertPop.hidden && !els.insertMenu.contains(e.target)) closeInsertMenu_();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !els.insertPop.hidden) closeInsertMenu_();
  });
}

function toggleInsertMenu_() {
  if (els.insertPop.hidden) openInsertMenu_();
  else closeInsertMenu_();
}
function openInsertMenu_() {
  els.insertPop.hidden = false;
  els.insertTrigger.setAttribute('aria-expanded', 'true');
}
function closeInsertMenu_() {
  els.insertPop.hidden = true;
  els.insertTrigger.setAttribute('aria-expanded', 'false');
}

/**
 * Footer "Open Editor" entry point. Opens the modal on the first visible
 * source (after the current sidebar filters). Inside the modal, the
 * student uses the source dropdown to navigate between sources.
 */
function openEditorFromFooter_() {
  const first = pickFirstVisibleSource_();
  if (!first) {
    setStatus('No sources to open.', 'warn', 2500);
    return;
  }
  openSourceEditor_(first.sourceId, null);
}

function pickFirstVisibleSource_() {
  const list = (state.sources || []).filter(sourcePassesPSFilter).filter((s) => {
    if (!state.filterCat) return true;
    return filteredHighlightsForSource(s.sourceId).length > 0;
  });
  return list[0] || (state.sources && state.sources[0]) || null;
}

function setViewMode_(mode) {
  if (state.viewMode === mode) return;
  state.viewMode = mode;
  els.vmEvidence.classList.toggle('sb-viewmode__pill--active', mode === 'evidence');
  els.vmSource.classList.toggle('sb-viewmode__pill--active', mode === 'source');
  render();
}


function onContext(ctx) {
  state.ctx = ctx;
  if (!ctx || !ctx.ok) { setStatus('Could not load. ' + (ctx && ctx.error || ''), 'bad'); return; }
  const rosterName = ctx.roster
    ? ((String(ctx.roster.Last || '') + ', ' + String(ctx.roster.First || '')).replace(/^, |, $/g, '') || ctx.roster.Name || '')
    : '';
  els.actor.textContent = (rosterName ? rosterName + ' · ' : '') + (ctx.actor || '');
  populateProjectPicker(ctx.projects, ctx.activeProjectId);
  if (ctx.activeProjectId) {
    state.projectId = ctx.activeProjectId;
    loadProjectData();
  } else {
    setStatus('No projects available.', 'warn');
  }
}

function populateProjectPicker(projects, activeId) {
  els.project.innerHTML = '';
  if (!projects || projects.length === 0) {
    const opt = document.createElement('option');
    opt.textContent = '(no projects)';
    els.project.appendChild(opt);
    els.project.disabled = true;
    return;
  }
  projects.forEach((p) => {
    const opt = document.createElement('option');
    opt.value = p.projectId;
    opt.textContent = p.name + (p.schoolYear ? ' (' + p.schoolYear + ')' : '');
    if (p.projectId === activeId) opt.selected = true;
    els.project.appendChild(opt);
  });
  els.project.disabled = false;
}

function loadProjectData() {
  if (!state.projectId) return;
  setStatus('Loading project data…');
  renderSidebarLoading_();
  google.script.run
    .withSuccessHandler(onProjectData)
    .withFailureHandler(onFail('loading data'))
    .sidebarGetProjectData(state.projectId);
}

function onProjectData(resp) {
  if (!resp || !resp.ok) { setStatus('Could not load project data.', 'bad'); return; }
  state.sources = resp.sources || [];
  state.highlights = resp.highlights || [];
  els.insertTrigger.disabled = state.sources.length === 0;
  els.openEditor.disabled = state.sources.length === 0;
  setStatus('');
  renderFilter();
  render();
}

// ---------- filter ----------

function activeBundle() {
  return state.ctx && state.ctx.activeBundle ? state.ctx.activeBundle : null;
}

function renderFilter() {
  const bundle = activeBundle();
  if (!bundle) { els.filter.hidden = true; return; }
  els.filter.hidden = false;
  els.filterCats.innerHTML = '';

  // Vertical facet list: All + every bundle category, each row = swatch ·
  // label · count. No horizontal overflow (the old single-row dot strip ran
  // off the edge), and the labels are always visible so no legend is needed.
  els.filterCats.appendChild(makeFacet_(null, 'All', null, countHighlights(null)));
  for (let i = 1; i <= 5; i++) {
    const label = bundle['label' + i];
    if (!label) continue;
    els.filterCats.appendChild(makeFacet_(label, label, bundle['color' + i], countHighlights(label)));
  }
}

function makeFacet_(value, label, color, count) {
  const active = state.filterCat === value;
  const empty = value !== null && count === 0;
  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'sb-facet'
    + (active ? ' sb-facet--active' : '')
    + (empty ? ' sb-facet--dimmed' : '');
  if (empty) row.disabled = true;

  const dot = document.createElement('span');
  dot.className = 'sb-facet__dot' + (color ? '' : ' sb-facet__dot--all');
  if (color) dot.style.backgroundColor = color;
  row.appendChild(dot);

  const lab = document.createElement('span');
  lab.className = 'sb-facet__label';
  lab.textContent = label;
  row.appendChild(lab);

  const c = document.createElement('span');
  c.className = 'sb-facet__count';
  c.textContent = count;
  row.appendChild(c);

  row.addEventListener('click', () => {
    state.filterCat = state.filterCat === value ? null : value;
    renderFilter();
    render();
  });
  return row;
}

function countHighlights(category) {
  if (!category) return state.highlights.length;
  return state.highlights.filter((h) => h.primaryCategory === category || h.secondaryCategory === category).length;
}

function filteredHighlightsForSource(sourceId) {
  const perSource = state.viewMode === 'source' ? state.sourceFilters[sourceId] : null;
  return state.highlights
    .filter((h) => h.sourceId === sourceId)
    .filter((h) => state.filterCat ? (h.primaryCategory === state.filterCat || h.secondaryCategory === state.filterCat) : true)
    .filter((h) => perSource ? (h.primaryCategory === perSource || h.secondaryCategory === perSource) : true);
}

function categoryBreakdownForSource(sourceId) {
  // Returns ordered [{label, color, count}] for categories that have at least one highlight in this source.
  const bundle = activeBundle();
  if (!bundle) return [];
  const counts = {};
  state.highlights.forEach((h) => {
    if (h.sourceId !== sourceId) return;
    if (h.primaryCategory) counts[h.primaryCategory] = (counts[h.primaryCategory] || 0) + 1;
  });
  const out = [];
  for (let i = 1; i <= 5; i++) {
    const label = bundle['label' + i];
    if (!label) continue;
    if (counts[label]) out.push({ label, color: bundle['color' + i], count: counts[label] });
  }
  return out;
}

function sourcePassesPSFilter(source) {
  const ps = source.primarySecondary || 'unset';
  if (ps === 'primary' && !state.filterPS.primary) return false;
  if (ps === 'secondary' && !state.filterPS.secondary) return false;
  if (ps === 'unset' && !state.filterPS.unset) return false;
  return true;
}

// ---------- main render ----------

/**
 * Shown by `bootstrap` while the very first `sidebarGetContext` is in flight,
 * and by `loadProjectData` while project data is being fetched after a
 * project picker change. Replaced by `render()` on success.
 */
function renderSidebarLoading_() {
  els.main.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const card = document.createElement('div');
    card.className = 'sb-skeleton';
    const long = document.createElement('div');
    long.className = 'sb-skeleton__line sb-skeleton__line--long';
    const mid = document.createElement('div');
    mid.className = 'sb-skeleton__line sb-skeleton__line--mid';
    const short = document.createElement('div');
    short.className = 'sb-skeleton__line sb-skeleton__line--short';
    card.appendChild(long);
    card.appendChild(mid);
    card.appendChild(short);
    els.main.appendChild(card);
  }
}

function render() {
  els.main.innerHTML = '';
  if (!state.projectId) {
    const e = document.createElement('div'); e.className = 'sb-empty';
    e.textContent = 'Pick a project to begin.';
    els.main.appendChild(e);
    return;
  }
  const visibleSources = state.sources.filter(sourcePassesPSFilter).filter((s) => {
    // If the category filter is on, only show sources that have at least one matching highlight.
    if (!state.filterCat) return true;
    return filteredHighlightsForSource(s.sourceId).length > 0;
  });
  if (visibleSources.length === 0) {
    const e = document.createElement('div'); e.className = 'sb-empty';
    e.textContent = state.sources.length === 0
      ? 'No sources saved for this project yet. Highlight something on the web to start.'
      : 'No sources match the current filter.';
    els.main.appendChild(e);
    return;
  }
  visibleSources.forEach((s) => els.main.appendChild(renderSource(s)));
}

function renderSource(source) {
  const card = document.createElement('div');
  card.className = 'sb-source';
  card.setAttribute('data-source-id', source.sourceId);

  const sourceMode = state.viewMode === 'source';
  const sourceExpanded = !sourceMode || !!state.expandedSourceIds[source.sourceId];

  const head = document.createElement('div');
  head.className = 'sb-source__head' + (sourceMode ? ' sb-source__head--clickable' : '');
  const titleWrap = document.createElement('div');
  titleWrap.className = 'sb-source__titlewrap';
  if (sourceMode) {
    const caret = document.createElement('span');
    caret.className = 'sb-source__caret';
    caret.textContent = sourceExpanded ? '▾' : '▸';
    titleWrap.appendChild(caret);
  }
  const titleTextWrap = document.createElement('div');
  const title = document.createElement('div');
  title.className = 'sb-source__title';
  title.textContent = (source.citationFieldsParsed && source.citationFieldsParsed.title) || source.scrapedTitle || '(untitled)';
  const url = document.createElement('div');
  url.className = 'sb-source__url';
  url.textContent = source.normalizedUrl || source.rawUrl || '';
  titleTextWrap.appendChild(title);
  titleTextWrap.appendChild(url);
  titleWrap.appendChild(titleTextWrap);
  head.appendChild(titleWrap);
  const chip = document.createElement('span');
  const ps = source.primarySecondary || 'unset';
  chip.className = 'sb-source__chip sb-source__chip--' + ps;
  chip.textContent = ps === 'unset' ? 'unset' : ps;
  head.appendChild(chip);
  if (sourceMode) {
    head.addEventListener('click', (e) => {
      // Don't capture clicks on inner buttons (chip is read-only here).
      if (e.target.closest('button')) return;
      state.expandedSourceIds[source.sourceId] = !sourceExpanded;
      render();
    });
  }
  card.appendChild(head);

  // Tag summary strip — visible in source mode, always (collapsed shows it as
  // the only hint of contents; expanded keeps it as a quick reference).
  if (sourceMode) {
    const breakdown = categoryBreakdownForSource(source.sourceId);
    if (breakdown.length > 0) {
      const strip = document.createElement('div');
      strip.className = 'sb-source__breakdown';
      breakdown.forEach((b) => {
        const dot = document.createElement('span');
        dot.className = 'sb-source__breakdown-dot';
        dot.style.backgroundColor = b.color;
        dot.title = b.label + ' · ' + b.count;
        strip.appendChild(dot);
        const lab = document.createElement('span');
        lab.className = 'sb-source__breakdown-count';
        lab.textContent = b.count;
        strip.appendChild(lab);
      });
      card.appendChild(strip);
    }
  }

  // Action row: highlight count + Edit citation + Copy citation.
  const meta = document.createElement('div');
  meta.className = 'sb-source__meta';
  const countSpan = document.createElement('span');
  countSpan.textContent = filteredHighlightsForSource(source.sourceId).length + ' highlight(s)';
  meta.appendChild(countSpan);
  const spacer = document.createElement('span');
  spacer.style.flex = '1';
  meta.appendChild(spacer);
  const inlineBtn = document.createElement('button');
  inlineBtn.type = 'button';
  inlineBtn.className = 'sb-source__action';
  inlineBtn.textContent = 'Copy citation';
  inlineBtn.title = 'Copy the MLA in-text citation to your clipboard, then paste it into your doc';
  inlineBtn.addEventListener('click', (e) => { e.stopPropagation(); copyInlineForSource(source, inlineBtn); });
  meta.appendChild(inlineBtn);
  card.appendChild(meta);

  if (sourceExpanded) {
    // Per-source filter chips in source mode only.
    if (sourceMode) {
      card.appendChild(renderSourceFilterRow(source));
    }
    const hl = document.createElement('div');
    hl.className = 'sb-highlights';
    filteredHighlightsForSource(source.sourceId).forEach((h) => hl.appendChild(renderHighlight(source, h)));
    card.appendChild(hl);
  }

  return card;
}

function renderSourceFilterRow(source) {
  const bundle = activeBundle();
  const row = document.createElement('div');
  row.className = 'sb-source__filter';
  if (!bundle) return row;
  const breakdown = categoryBreakdownForSource(source.sourceId);
  if (breakdown.length === 0) return row;
  const current = state.sourceFilters[source.sourceId] || null;
  const allChip = makeSourceFilterChip_(source, null, 'All', '#dadce0', state.highlights.filter((h) => h.sourceId === source.sourceId).length, current === null);
  row.appendChild(allChip);
  breakdown.forEach((b) => {
    row.appendChild(makeSourceFilterChip_(source, b.label, b.label, b.color, b.count, current === b.label));
  });
  return row;
}

function makeSourceFilterChip_(source, value, label, color, count, active) {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'sb-filter-chip sb-filter-chip--mini' + (active ? ' sb-filter-chip--active' : '');
  const dot = document.createElement('span');
  dot.className = 'sb-filter-chip__dot';
  dot.style.backgroundColor = color;
  chip.appendChild(dot);
  chip.appendChild(document.createTextNode(label));
  const c = document.createElement('span');
  c.className = 'sb-filter-chip__count';
  c.textContent = count;
  chip.appendChild(c);
  chip.addEventListener('click', (e) => {
    e.stopPropagation();
    state.sourceFilters[source.sourceId] = state.sourceFilters[source.sourceId] === value ? null : value;
    render();
  });
  return chip;
}

// Click-to-copy the in-text citation. The text is precomputed server-side
// (source.inlineCitation from sidebarGetProjectData), so this is instant — no
// round-trip. The student pastes it where they want and adds a page number.
function copyInlineForSource(source, btn) {
  const text = (source && source.inlineCitation) || '';
  if (!text) {
    setStatus('No author or title yet — edit the citation first.', 'bad', 4000);
    return;
  }
  if (copyToClipboard_(text)) {
    setStatus('Copied ' + text + ' — paste it into your doc.', 'good', 3000);
    if (btn) {
      const prev = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = prev; }, 1200);
    }
  } else {
    setStatus('Could not copy automatically. Citation: ' + text, 'bad', 6000);
  }
}

/**
 * Copy text to the clipboard from inside the GAS sidebar iframe. navigator.
 * clipboard is usually blocked by the iframe sandbox, so use the hidden-
 * textarea + execCommand('copy') approach, which works on a user gesture.
 */
function copyToClipboard_(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

// ---------- highlight render ----------

function renderHighlight(source, h) {
  const row = document.createElement('div');
  row.className = 'sb-highlight';
  row.setAttribute('data-highlight-id', h.highlightId);
  const color = colorForLabel_(h.primaryCategory) || '#dadce0';
  const bar = document.createElement('div');
  bar.className = 'sb-highlight__bar';
  bar.style.backgroundColor = color;
  row.appendChild(bar);

  // Category line as swatch · label pills. When a category filter is active,
  // the tag that caused this card to match (primary OR secondary) is
  // emphasized, so a card that matched on its secondary tag no longer looks
  // like it doesn't belong.
  const cat = document.createElement('div');
  cat.className = 'sb-highlight__cat';
  cat.appendChild(hlTag_(h.primaryCategory || '(no category)', colorForLabel_(h.primaryCategory),
    !!(state.filterCat && h.primaryCategory === state.filterCat), false));
  if (h.secondaryCategory) {
    cat.appendChild(hlTag_(h.secondaryCategory, colorForLabel_(h.secondaryCategory),
      !!(state.filterCat && h.secondaryCategory === state.filterCat), true));
  }
  row.appendChild(cat);

  const t = document.createElement('div');
  t.className = 'sb-highlight__text';
  t.textContent = truncate_(h.highlightedText || '', 240);
  row.appendChild(t);

  if (h.note) {
    const n = document.createElement('div');
    n.className = 'sb-highlight__note';
    n.textContent = h.note;
    row.appendChild(n);
  }

  return row;
}


function colorForLabel_(label) {
  const bundle = activeBundle();
  if (!bundle || !label) return null;
  for (let i = 1; i <= 5; i++) {
    if (bundle['label' + i] === label) return bundle['color' + i];
  }
  return null;
}

/**
 * One category tag on a highlight card: swatch dot + label. `secondary` styles
 * it as the lighter "+ tag" form; `match` fills it with a tint of its own
 * category color + bold, marking it as the reason this card matched the active
 * filter.
 */
function hlTag_(label, color, match, secondary) {
  const tag = document.createElement('span');
  tag.className = 'sb-hl-tag'
    + (secondary ? ' sb-hl-tag--secondary' : '')
    + (match ? ' sb-hl-tag--match' : '');
  const dot = document.createElement('span');
  dot.className = 'sb-hl-tag__dot';
  dot.style.backgroundColor = color || '#dadce0';
  tag.appendChild(dot);
  tag.appendChild(document.createTextNode(label));
  if (match) tag.style.backgroundColor = tint_(color, 0.18);
  return tag;
}

/** "#rrggbb" → "rgba(r,g,b,a)". Returns transparent for anything unparseable. */
function tint_(hex, alpha) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return 'transparent';
  const n = parseInt(m[1], 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
}

function truncate_(s, n) {
  return s.length > n ? s.slice(0, n) + '…' : s;
}

// ---------- save / failure plumbing ----------

const OPEN_EDITOR_BTN_LABEL = 'Open Editor';

/**
 * Open the per-source editor modal. Stores the sourceId in state so the
 * sidebar's polling loop knows to refresh while the modal is open.
 */
function openSourceEditor_(sourceId, focusHighlightId) {
  state.modalOpenForSourceId = sourceId;
  state.lastDataJson = JSON.stringify({ sources: state.sources, highlights: state.highlights });
  startEditorPolling_();
  // Spinner on the footer "Open Editor" button while the dialog opens.
  els.openEditor.disabled = true;
  els.openEditor.innerHTML =
    '<span class="sb-loading__spinner sb-loading__spinner--sm sb-loading__spinner--on-muted"></span>' +
    'Opening…';
  const restoreOpenBtn = () => {
    els.openEditor.disabled = state.sources.length === 0;
    els.openEditor.textContent = OPEN_EDITOR_BTN_LABEL;
  };
  google.script.run
    .withSuccessHandler(() => { restoreOpenBtn(); setStatus(''); })
    .withFailureHandler((e) => {
      state.modalOpenForSourceId = null;
      stopEditorPolling_();
      restoreOpenBtn();
      onFail('opening editor')(e);
    })
    .sidebarOpenSourceEditor(state.projectId, sourceId, focusHighlightId || '');
}

const POLL_INTERVAL_MS = 3000;
const POLL_MAX_UNCHANGED_TICKS = 200;   // ~10 minutes — bounded fallback stop

/**
 * While a modal is open, refetch project data every 3s and diff against
 * the previous response. On change, update local state and re-render.
 *
 * Stop conditions:
 *   (a) the sourceId the modal opened on disappears from the response
 *       (the modal deleted the source);
 *   (b) we hit POLL_MAX_UNCHANGED_TICKS unchanged ticks in a row (the
 *       user closed the modal without edits and we shouldn't poll
 *       forever).
 */
function startEditorPolling_() {
  if (state.pollHandle) return;
  state.pollUnchangedTicks = 0;
  state.pollHandle = setInterval(pollTick_, POLL_INTERVAL_MS);
}

function stopEditorPolling_() {
  if (!state.pollHandle) return;
  clearInterval(state.pollHandle);
  state.pollHandle = null;
  state.modalOpenForSourceId = null;
  state.pollUnchangedTicks = 0;
}

function pollTick_() {
  if (!state.modalOpenForSourceId || !state.projectId) {
    stopEditorPolling_();
    return;
  }
  google.script.run
    .withSuccessHandler(onPollResponse_)
    .withFailureHandler(() => { /* swallow transient errors; retry next tick */ })
    .sidebarGetProjectData(state.projectId);
}

function onPollResponse_(resp) {
  if (!resp || !resp.ok) return;
  const json = JSON.stringify({ sources: resp.sources, highlights: resp.highlights });
  if (json === state.lastDataJson) {
    state.pollUnchangedTicks++;
    if (state.pollUnchangedTicks >= POLL_MAX_UNCHANGED_TICKS) stopEditorPolling_();
    return;
  }
  state.pollUnchangedTicks = 0;
  state.lastDataJson = json;
  state.sources = resp.sources || [];
  state.highlights = resp.highlights || [];
  els.insertTrigger.disabled = state.sources.length === 0;
  els.openEditor.disabled = state.sources.length === 0;
  renderFilter();
  render();

  // Heuristic: if the source the modal opened on is gone, the modal closed
  // via a source delete. Stop polling.
  const stillExists = state.sources.some((s) => s.sourceId === state.modalOpenForSourceId);
  if (!stillExists) stopEditorPolling_();
}


const INSERT_TRIGGER_LABEL_HTML = 'Insert References <span class="sb-insert__caret" aria-hidden="true">▾</span>';

/**
 * Which of the current sources will NOT make it into the bibliography, and why.
 * Mirrors partitionBibliographySources_ on the server (52_bibliography.js) — the
 * server is the source of truth for what actually gets inserted; this is the
 * client-side preview so we can warn the student first. Keep the two in sync.
 *
 *   - unclassified  → omitted from BOTH variants (build plan §2).
 *   - no-annotation → omitted from the ANNOTATED variant only (a blank
 *                     annotation makes an annotated entry incomplete). Works
 *                     Cited has no annotations, so it never trips this.
 */
function bibliographyOmissions_(annotated) {
  const omitted = [];
  (state.sources || []).forEach((s) => {
    const ps = s.primarySecondary;
    if (ps !== 'primary' && ps !== 'secondary') {
      omitted.push({ source: s, reason: 'unclassified' });
      return;
    }
    if (annotated && !(s.annotation && String(s.annotation).trim())) {
      omitted.push({ source: s, reason: 'no-annotation' });
    }
  });
  return omitted;
}

function sourceTitle_(s) {
  return (s.citationFieldsParsed && s.citationFieldsParsed.title) || s.scrapedTitle || '(untitled)';
}

/**
 * Blocking warning shown before an insert that would drop sources. Lists each
 * omitted source with the reason so the student can go fix it (Cancel) or
 * insert without it (OK). Returns true to proceed.
 */
function confirmOmissions_(omitted, annotated) {
  const reasonText = {
    'unclassified': 'not marked Primary or Secondary',
    'no-annotation': 'no annotation written',
  };
  const lines = omitted.map((o) => '  • ' + truncate_(sourceTitle_(o.source), 60) + ' — ' + reasonText[o.reason]);
  const n = omitted.length;
  const what = annotated ? 'annotated bibliography' : 'works cited list';
  const msg =
    n + ' source' + (n === 1 ? '' : 's') + ' will be LEFT OUT of your ' + what + ':\n\n' +
    lines.join('\n') +
    '\n\nFix ' + (n === 1 ? 'it' : 'them') + ' in the editor first, or click OK to insert without ' +
    (n === 1 ? 'it' : 'them') + '.';
  return window.confirm(msg);
}

// annotated=true → Annotated Bibliography button; false → Works Cited button.
// Both replace whatever bibliography is already in the doc (server-side, via
// the named-range tag), so re-clicking either updates the one block.
function insertBibliography(annotated) {
  const omitted = bibliographyOmissions_(annotated);
  if (omitted.length > 0 && !confirmOmissions_(omitted, annotated)) return;
  const omittedCount = omitted.length;
  els.insertTrigger.disabled = true;
  els.insertTrigger.innerHTML =
    '<span class="sb-loading__spinner sb-loading__spinner--sm sb-loading__spinner--on-accent"></span>Inserting…';
  setStatus('');
  const restore = () => {
    els.insertTrigger.disabled = state.sources.length === 0;
    els.openEditor.disabled = state.sources.length === 0;
    els.insertTrigger.innerHTML = INSERT_TRIGGER_LABEL_HTML;
  };
  google.script.run
    .withSuccessHandler((res) => {
      restore();
      if (res && res.ok) {
        const n = res.inserted.primary + res.inserted.secondary;
        const what = res.annotated ? 'annotated bibliography' : 'works cited';
        let msg = 'Inserted ' + what + ' (' + n + ' source' + (n === 1 ? '' : 's') + ')';
        if (omittedCount > 0) msg += ' · ' + omittedCount + ' left out';
        setStatus(msg + '.', 'good', 4000);
      } else {
        setStatus('Insert failed.', 'bad');
      }
    })
    .withFailureHandler((e) => {
      restore();
      setStatus(String(e && e.message || e), 'bad');
    })
    .sidebarInsertBibliography(state.projectId, annotated);
}

function setStatus(text, kind, autoClearMs) {
  els.status.textContent = text || '';
  els.status.className = 'sb-status' + (kind ? ' sb-status--' + kind : '');
  if (autoClearMs) {
    setTimeout(() => {
      if (els.status.textContent === text) {
        els.status.textContent = '';
        els.status.className = 'sb-status';
      }
    }, autoClearMs);
  }
}

function onFail(stage) {
  return (e) => setStatus(stage + ': ' + (e && e.message || e), 'bad');
}
</script>
