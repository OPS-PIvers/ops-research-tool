<script>
// All server calls go through google.script.run. State lives in `state`;
// every interaction mutates state then re-renders. Render is full-redraw
// per change — sidebar is small and re-renders are cheap.

const SRC_TYPES = ['website', 'article', 'book', 'primary'];
const PS_OPTS = ['primary', 'secondary', 'unset'];

const state = {
  ctx: null,           // sidebarGetContext response
  projectId: null,
  sources: [],
  highlights: [],
  filterCat: null,     // null = all categories
  filterPS: { primary: true, secondary: true, unset: true },
  viewMode: 'evidence',     // 'evidence' | 'source'
  expandedSourceIds: {},    // sourceId → true (highlights visible in source mode)
  sourceFilters: {},        // sourceId → category label (per-source filter, source mode only)
  expandedSourceId: null,   // sourceId whose citation form is open (singular)
  editingHighlightId: null,
  confirmingDeleteId: null, // highlightId whose Delete button is in its second-click "Confirm" state
  modalOpenForSourceId: null,   // sourceId of the currently-open modal (drives polling)
  lastDataJson: null,           // JSON of last sidebarGetProjectData response (polling diff)
  pollHandle: null,             // setInterval handle for the modal-open polling loop
  pollUnchangedTicks: 0,        // bounded fallback stop counter
};

const els = {
  actor: document.getElementById('sb-actor'),
  popout: document.getElementById('sb-popout'),
  project: document.getElementById('sb-project'),
  vmEvidence: document.getElementById('sb-vm-evidence'),
  vmSource: document.getElementById('sb-vm-source'),
  filter: document.getElementById('sb-filter'),
  filterCats: document.getElementById('sb-filter-cats'),
  fltPrim: document.getElementById('sb-flt-primary'),
  fltSec: document.getElementById('sb-flt-secondary'),
  fltUnset: document.getElementById('sb-flt-unset'),
  main: document.getElementById('sb-main'),
  insert: document.getElementById('sb-insert'),
  status: document.getElementById('sb-status'),
};

bootstrap();

function bootstrap() {
  setStatus('Loading…');
  google.script.run
    .withSuccessHandler(onContext)
    .withFailureHandler(onFail('loading context'))
    .sidebarGetContext();

  els.project.addEventListener('change', () => {
    state.projectId = els.project.value;
    google.script.run.sidebarSetActiveProject(state.projectId);
    loadProjectData();
  });
  els.fltPrim.addEventListener('change', () => { state.filterPS.primary = els.fltPrim.checked; render(); });
  els.fltSec.addEventListener('change', () => { state.filterPS.secondary = els.fltSec.checked; render(); });
  els.fltUnset.addEventListener('change', () => { state.filterPS.unset = els.fltUnset.checked; render(); });
  els.vmEvidence.addEventListener('click', () => setViewMode_('evidence'));
  els.vmSource.addEventListener('click', () => setViewMode_('source'));
  if (els.popout) els.popout.addEventListener('click', popOutToDialog);
  els.insert.addEventListener('click', insertBibliography);
}

function setViewMode_(mode) {
  if (state.viewMode === mode) return;
  state.viewMode = mode;
  els.vmEvidence.classList.toggle('sb-viewmode__pill--active', mode === 'evidence');
  els.vmSource.classList.toggle('sb-viewmode__pill--active', mode === 'source');
  render();
}

function popOutToDialog() {
  // TEMPORARY: rewired to open the new per-source editor against the first source
  // (and its first highlight, if any) for smoke-testing. Reverted in Task 13.
  if (!state.sources || state.sources.length === 0) {
    setStatus('No sources to open.', 'warn');
    return;
  }
  const firstSource = state.sources[0];
  const firstHl = state.highlights.find((h) => h.sourceId === firstSource.sourceId);
  google.script.run
    .withFailureHandler(onFail('opening editor'))
    .sidebarOpenSourceEditor(state.projectId, firstSource.sourceId, firstHl ? firstHl.highlightId : '');
}

function onContext(ctx) {
  state.ctx = ctx;
  if (!ctx || !ctx.ok) { setStatus('Could not load. ' + (ctx && ctx.error || ''), 'bad'); return; }
  els.actor.textContent = (ctx.roster && ctx.roster.Name ? ctx.roster.Name + ' · ' : '') + (ctx.actor || '');
  populateProjectPicker(ctx.projects, ctx.activeProjectId);
  if (ctx.activeProjectId) {
    state.projectId = ctx.activeProjectId;
    loadProjectData();
  } else {
    setStatus('No projects available.', 'warn');
  }
}

function populateProjectPicker(projects, activeId) {
  els.project.innerHTML = '';
  if (!projects || projects.length === 0) {
    const opt = document.createElement('option');
    opt.textContent = '(no projects)';
    els.project.appendChild(opt);
    els.project.disabled = true;
    return;
  }
  projects.forEach((p) => {
    const opt = document.createElement('option');
    opt.value = p.projectId;
    opt.textContent = p.name + (p.schoolYear ? ' (' + p.schoolYear + ')' : '');
    if (p.projectId === activeId) opt.selected = true;
    els.project.appendChild(opt);
  });
  els.project.disabled = false;
}

function loadProjectData() {
  if (!state.projectId) return;
  setStatus('Loading project data…');
  google.script.run
    .withSuccessHandler(onProjectData)
    .withFailureHandler(onFail('loading data'))
    .sidebarGetProjectData(state.projectId);
}

function onProjectData(resp) {
  if (!resp || !resp.ok) { setStatus('Could not load project data.', 'bad'); return; }
  state.sources = resp.sources || [];
  state.highlights = resp.highlights || [];
  state.confirmingDeleteId = null;
  els.insert.disabled = state.sources.length === 0;
  setStatus('');
  renderFilter();
  render();
}

// ---------- filter ----------

function activeBundle() {
  return state.ctx && state.ctx.activeBundle ? state.ctx.activeBundle : null;
}

function renderFilter() {
  const bundle = activeBundle();
  if (!bundle) { els.filter.hidden = true; return; }
  els.filter.hidden = false;
  els.filterCats.innerHTML = '';

  // "All" chip — no dot, just label + count. Sits at the start of the strip.
  const all = document.createElement('button');
  all.type = 'button';
  all.className = 'sb-filter-chip sb-filter-chip--all';
  if (state.filterCat === null) all.classList.add('sb-filter-chip--active');
  all.title = 'Show all categories';
  all.appendChild(document.createTextNode('All'));
  const allCount = document.createElement('span');
  allCount.className = 'sb-filter-chip__count';
  allCount.textContent = countHighlights(null);
  all.appendChild(allCount);
  all.addEventListener('click', () => {
    state.filterCat = null;
    renderFilter();
    render();
  });
  els.filterCats.appendChild(all);

  // Per-category chips — colored dot + count only. Label is in the hover
  // tooltip + (when this chip is the active filter) in the legend row
  // below the strip.
  for (let i = 1; i <= 5; i++) {
    const label = bundle['label' + i];
    const color = bundle['color' + i];
    if (!label) continue;
    els.filterCats.appendChild(makeFilterDotChip(label, color, countHighlights(label)));
  }

  // Active-filter legend: only visible when something other than "All" is
  // selected. Shows the human label and a quick clear (×).
  let legend = document.getElementById('sb-filter-legend');
  if (state.filterCat) {
    if (!legend) {
      legend = document.createElement('div');
      legend.id = 'sb-filter-legend';
      legend.className = 'sb-filter__legend';
      els.filter.insertBefore(legend, els.filterCats.nextSibling);
    }
    legend.innerHTML = '';
    const dot = document.createElement('span');
    dot.className = 'sb-filter__legend-dot';
    dot.style.backgroundColor = colorForLabel_(state.filterCat) || '#dadce0';
    legend.appendChild(dot);
    legend.appendChild(document.createTextNode(state.filterCat));
    const clear = document.createElement('button');
    clear.type = 'button';
    clear.className = 'sb-filter__legend-clear';
    clear.title = 'Clear filter';
    clear.textContent = '×';
    clear.addEventListener('click', () => {
      state.filterCat = null;
      renderFilter();
      render();
    });
    legend.appendChild(clear);
  } else if (legend) {
    legend.remove();
  }
}

function makeFilterDotChip(value, color, count) {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'sb-filter-chip sb-filter-chip--dot';
  if (state.filterCat === value) chip.classList.add('sb-filter-chip--active');
  chip.title = value; // hover tooltip carries the label
  const dot = document.createElement('span');
  dot.className = 'sb-filter-chip__dot';
  dot.style.backgroundColor = color;
  chip.appendChild(dot);
  const c = document.createElement('span');
  c.className = 'sb-filter-chip__count';
  c.textContent = count;
  chip.appendChild(c);
  chip.addEventListener('click', () => {
    state.filterCat = state.filterCat === value ? null : value;
    renderFilter();
    render();
  });
  return chip;
}

function countHighlights(category) {
  if (!category) return state.highlights.length;
  return state.highlights.filter((h) => h.primaryCategory === category || h.secondaryCategory === category).length;
}

function filteredHighlightsForSource(sourceId) {
  const perSource = state.viewMode === 'source' ? state.sourceFilters[sourceId] : null;
  return state.highlights
    .filter((h) => h.sourceId === sourceId)
    .filter((h) => state.filterCat ? (h.primaryCategory === state.filterCat || h.secondaryCategory === state.filterCat) : true)
    .filter((h) => perSource ? (h.primaryCategory === perSource || h.secondaryCategory === perSource) : true);
}

function categoryBreakdownForSource(sourceId) {
  // Returns ordered [{label, color, count}] for categories that have at least one highlight in this source.
  const bundle = activeBundle();
  if (!bundle) return [];
  const counts = {};
  state.highlights.forEach((h) => {
    if (h.sourceId !== sourceId) return;
    if (h.primaryCategory) counts[h.primaryCategory] = (counts[h.primaryCategory] || 0) + 1;
  });
  const out = [];
  for (let i = 1; i <= 5; i++) {
    const label = bundle['label' + i];
    if (!label) continue;
    if (counts[label]) out.push({ label, color: bundle['color' + i], count: counts[label] });
  }
  return out;
}

function sourcePassesPSFilter(source) {
  const ps = source.primarySecondary || 'unset';
  if (ps === 'primary' && !state.filterPS.primary) return false;
  if (ps === 'secondary' && !state.filterPS.secondary) return false;
  if (ps === 'unset' && !state.filterPS.unset) return false;
  return true;
}

// ---------- main render ----------

function render() {
  els.main.innerHTML = '';
  if (!state.projectId) {
    const e = document.createElement('div'); e.className = 'sb-empty';
    e.textContent = 'Pick a project to begin.';
    els.main.appendChild(e);
    return;
  }
  const visibleSources = state.sources.filter(sourcePassesPSFilter).filter((s) => {
    // If the category filter is on, only show sources that have at least one matching highlight.
    if (!state.filterCat) return true;
    return filteredHighlightsForSource(s.sourceId).length > 0;
  });
  if (visibleSources.length === 0) {
    const e = document.createElement('div'); e.className = 'sb-empty';
    e.textContent = state.sources.length === 0
      ? 'No sources saved for this project yet. Highlight something on the web to start.'
      : 'No sources match the current filter.';
    els.main.appendChild(e);
    return;
  }
  visibleSources.forEach((s) => els.main.appendChild(renderSource(s)));
}

function renderSource(source) {
  const card = document.createElement('div');
  card.className = 'sb-source';
  card.setAttribute('data-source-id', source.sourceId);

  const sourceMode = state.viewMode === 'source';
  const sourceExpanded = !sourceMode || !!state.expandedSourceIds[source.sourceId];

  const head = document.createElement('div');
  head.className = 'sb-source__head' + (sourceMode ? ' sb-source__head--clickable' : '');
  const titleWrap = document.createElement('div');
  titleWrap.className = 'sb-source__titlewrap';
  if (sourceMode) {
    const caret = document.createElement('span');
    caret.className = 'sb-source__caret';
    caret.textContent = sourceExpanded ? '▾' : '▸';
    titleWrap.appendChild(caret);
  }
  const titleTextWrap = document.createElement('div');
  const title = document.createElement('div');
  title.className = 'sb-source__title';
  title.textContent = (source.citationFieldsParsed && source.citationFieldsParsed.title) || source.scrapedTitle || '(untitled)';
  const url = document.createElement('div');
  url.className = 'sb-source__url';
  url.textContent = source.normalizedUrl || source.rawUrl || '';
  titleTextWrap.appendChild(title);
  titleTextWrap.appendChild(url);
  titleWrap.appendChild(titleTextWrap);
  head.appendChild(titleWrap);
  const chip = document.createElement('span');
  const ps = source.primarySecondary || 'unset';
  chip.className = 'sb-source__chip sb-source__chip--' + ps;
  chip.textContent = ps === 'unset' ? 'unset' : ps;
  head.appendChild(chip);
  if (sourceMode) {
    head.addEventListener('click', (e) => {
      // Don't capture clicks on inner buttons (chip is read-only here).
      if (e.target.closest('button')) return;
      state.expandedSourceIds[source.sourceId] = !sourceExpanded;
      render();
    });
  }
  card.appendChild(head);

  // Tag summary strip — visible in source mode, always (collapsed shows it as
  // the only hint of contents; expanded keeps it as a quick reference).
  if (sourceMode) {
    const breakdown = categoryBreakdownForSource(source.sourceId);
    if (breakdown.length > 0) {
      const strip = document.createElement('div');
      strip.className = 'sb-source__breakdown';
      breakdown.forEach((b) => {
        const dot = document.createElement('span');
        dot.className = 'sb-source__breakdown-dot';
        dot.style.backgroundColor = b.color;
        dot.title = b.label + ' · ' + b.count;
        strip.appendChild(dot);
        const lab = document.createElement('span');
        lab.className = 'sb-source__breakdown-count';
        lab.textContent = b.count;
        strip.appendChild(lab);
      });
      card.appendChild(strip);
    }
  }

  // Action row: highlight count + Edit citation + Insert in-text.
  const meta = document.createElement('div');
  meta.className = 'sb-source__meta';
  const countSpan = document.createElement('span');
  countSpan.textContent = filteredHighlightsForSource(source.sourceId).length + ' highlight(s)';
  meta.appendChild(countSpan);
  const spacer = document.createElement('span');
  spacer.style.flex = '1';
  meta.appendChild(spacer);
  const inlineBtn = document.createElement('button');
  inlineBtn.type = 'button';
  inlineBtn.className = 'sb-source__action';
  inlineBtn.textContent = 'Insert in-text';
  inlineBtn.title = 'Insert MLA in-text citation at the cursor';
  inlineBtn.addEventListener('click', (e) => { e.stopPropagation(); insertInlineForSource(source); });
  meta.appendChild(inlineBtn);
  const openBtn = document.createElement('button');
  openBtn.type = 'button';
  openBtn.className = 'sb-source__action';
  openBtn.textContent = 'Open in editor';
  openBtn.title = 'Open this source in the editor';
  openBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    openSourceEditor_(source.sourceId, null);
  });
  meta.appendChild(openBtn);
  const expand = document.createElement('button');
  expand.type = 'button';
  expand.className = 'sb-source__action sb-source__expand';
  expand.textContent = state.expandedSourceId === source.sourceId ? 'Hide citation' : 'Edit citation';
  expand.addEventListener('click', (e) => {
    e.stopPropagation();
    state.expandedSourceId = state.expandedSourceId === source.sourceId ? null : source.sourceId;
    // Auto-expand the source in source mode when opening the citation form.
    if (state.expandedSourceId === source.sourceId && sourceMode) {
      state.expandedSourceIds[source.sourceId] = true;
    }
    render();
  });
  meta.appendChild(expand);
  card.appendChild(meta);

  if (state.expandedSourceId === source.sourceId) {
    card.appendChild(renderSourceForm(source));
  }

  if (sourceExpanded) {
    // Per-source filter chips in source mode only.
    if (sourceMode) {
      card.appendChild(renderSourceFilterRow(source));
    }
    const hl = document.createElement('div');
    hl.className = 'sb-highlights';
    filteredHighlightsForSource(source.sourceId).forEach((h) => hl.appendChild(renderHighlight(source, h)));
    card.appendChild(hl);
  }

  return card;
}

function renderSourceFilterRow(source) {
  const bundle = activeBundle();
  const row = document.createElement('div');
  row.className = 'sb-source__filter';
  if (!bundle) return row;
  const breakdown = categoryBreakdownForSource(source.sourceId);
  if (breakdown.length === 0) return row;
  const current = state.sourceFilters[source.sourceId] || null;
  const allChip = makeSourceFilterChip_(source, null, 'All', '#dadce0', state.highlights.filter((h) => h.sourceId === source.sourceId).length, current === null);
  row.appendChild(allChip);
  breakdown.forEach((b) => {
    row.appendChild(makeSourceFilterChip_(source, b.label, b.label, b.color, b.count, current === b.label));
  });
  return row;
}

function makeSourceFilterChip_(source, value, label, color, count, active) {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'sb-filter-chip sb-filter-chip--mini' + (active ? ' sb-filter-chip--active' : '');
  const dot = document.createElement('span');
  dot.className = 'sb-filter-chip__dot';
  dot.style.backgroundColor = color;
  chip.appendChild(dot);
  chip.appendChild(document.createTextNode(label));
  const c = document.createElement('span');
  c.className = 'sb-filter-chip__count';
  c.textContent = count;
  chip.appendChild(c);
  chip.addEventListener('click', (e) => {
    e.stopPropagation();
    state.sourceFilters[source.sourceId] = state.sourceFilters[source.sourceId] === value ? null : value;
    render();
  });
  return chip;
}

function insertInlineForSource(source) {
  setStatus('Inserting in-text citation…');
  google.script.run
    .withSuccessHandler((res) => {
      if (res && res.ok) setStatus('Inserted ' + (res.text || 'citation') + '.', 'good', 2500);
      else setStatus('Insert failed.', 'bad');
    })
    .withFailureHandler((e) => setStatus(String(e && e.message || e), 'bad'))
    .sidebarInsertInlineCitation(state.projectId, source.sourceId, '');
}

function renderSourceForm(source) {
  const fields = Object.assign({}, source.citationFieldsParsed || {});
  // Ensure sourceType defaults from row, then 'website'.
  fields.sourceType = fields.sourceType || source.sourceType || 'website';
  // Fallbacks from scrape, only if not yet set.
  if (!fields.title) fields.title = source.scrapedTitle || '';
  if (!fields.siteName) fields.siteName = source.scrapedSite || '';
  if (!fields.publishedDate) fields.publishedDate = source.scrapedDate || '';
  if (!fields.author) fields.author = source.scrapedAuthor || '';
  if (!fields.url) fields.url = source.rawUrl || '';
  fields.accessDate = source.accessDate || fields.accessDate || '';

  const form = document.createElement('div');
  form.className = 'sb-source__form';

  // Source type selector
  form.appendChild(formField_('Source type', selectInput_(SRC_TYPES, fields.sourceType, (v) => {
    fields.sourceType = v;
    saveSourcePatch_(source, { sourceType: v, citationFields: fields });
    state.expandedSourceId = source.sourceId; // keep expanded
    render();
  })));

  // Per-type field set
  const fieldDefs = sourceFieldsFor_(fields.sourceType);
  fieldDefs.forEach((def) => {
    const onChange = (v) => {
      fields[def.key] = v;
      // Debounce-on-blur pattern: write on each commit (we listen for change/blur, not input).
      saveSourcePatch_(source, { citationFields: fields });
      // Re-render the preview without redoing layout.
      updatePreview_(form, fields);
    };
    form.appendChild(formField_(def.label, textInput_(fields[def.key] || '', onChange, def.kind)));
  });

  // Primary/secondary
  const psRow = document.createElement('div');
  psRow.className = 'sb-source__form-row';
  PS_OPTS.forEach((opt) => {
    const lab = document.createElement('label');
    const inp = document.createElement('input');
    inp.type = 'radio'; inp.name = 'ps-' + source.sourceId; inp.value = opt;
    if ((source.primarySecondary || 'unset') === opt) inp.checked = true;
    inp.addEventListener('change', () => {
      saveSourcePatch_(source, { primarySecondary: opt });
      source.primarySecondary = opt;
      render();
    });
    lab.appendChild(inp);
    lab.appendChild(document.createTextNode(' ' + opt));
    psRow.appendChild(lab);
  });
  form.appendChild(formField_('Classification', psRow));

  // Annotation
  const annWrap = document.createElement('div');
  annWrap.className = 'sb-source__annotation';
  const annLabel = document.createElement('label'); annLabel.textContent = 'Annotation';
  const annTa = document.createElement('textarea');
  annTa.value = source.annotation || '';
  annTa.placeholder = '2–3 sentence annotation…';
  let timer;
  annTa.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      saveSourcePatch_(source, { annotation: annTa.value });
      source.annotation = annTa.value;
    }, 600);
  });
  annWrap.appendChild(annLabel);
  annWrap.appendChild(annTa);
  form.appendChild(annWrap);

  // Live preview
  const preview = document.createElement('div');
  preview.className = 'sb-source__preview';
  preview.id = 'preview-' + source.sourceId;
  preview.innerHTML = formatPreview_(fields);
  form.appendChild(preview);

  return form;
}

function sourceFieldsFor_(sourceType) {
  switch (sourceType) {
    case 'website':
      return [
        { key: 'title', label: 'Title', kind: 'text' },
        { key: 'siteName', label: 'Site name', kind: 'text' },
        { key: 'author', label: 'Author', kind: 'text' },
        { key: 'publishedDate', label: 'Published date', kind: 'text' },
        { key: 'url', label: 'URL', kind: 'text' },
      ];
    case 'article':
      return [
        { key: 'title', label: 'Article title', kind: 'text' },
        { key: 'publication', label: 'Publication name', kind: 'text' },
        { key: 'author', label: 'Author', kind: 'text' },
        { key: 'publishedDate', label: 'Published date', kind: 'text' },
        { key: 'volume', label: 'Volume (opt.)', kind: 'text' },
        { key: 'issue', label: 'Issue (opt.)', kind: 'text' },
        { key: 'pages', label: 'Pages (opt.)', kind: 'text' },
        { key: 'url', label: 'URL', kind: 'text' },
      ];
    case 'book':
      return [
        { key: 'title', label: 'Book title', kind: 'text' },
        { key: 'author', label: 'Author', kind: 'text' },
        { key: 'publisher', label: 'Publisher', kind: 'text' },
        { key: 'publishedDate', label: 'Year', kind: 'text' },
      ];
    case 'primary':
      return [
        { key: 'title', label: 'Title', kind: 'text' },
        { key: 'author', label: 'Author / creator', kind: 'text' },
        { key: 'publishedDate', label: 'Date', kind: 'text' },
        { key: 'archive', label: 'Archive / repository', kind: 'text' },
        { key: 'url', label: 'URL', kind: 'text' },
      ];
    default:
      return [];
  }
}

function formField_(labelText, control) {
  const wrap = document.createElement('div');
  const lab = document.createElement('label');
  lab.textContent = labelText;
  wrap.appendChild(lab);
  wrap.appendChild(control);
  return wrap;
}

function textInput_(value, onCommit, kind) {
  const i = document.createElement('input');
  i.type = kind === 'date' ? 'date' : 'text';
  i.value = value || '';
  i.addEventListener('change', () => onCommit(i.value));
  i.addEventListener('blur', () => onCommit(i.value));
  return i;
}

function selectInput_(options, value, onChange) {
  const s = document.createElement('select');
  options.forEach((o) => {
    const opt = document.createElement('option');
    opt.value = o; opt.textContent = o;
    if (o === value) opt.selected = true;
    s.appendChild(opt);
  });
  s.addEventListener('change', () => onChange(s.value));
  return s;
}

function formatPreview_(fields) {
  // Local mirror of the server formatCitation just for live preview. Not
  // authoritative — the actual Insert Bibliography uses the server's logic.
  // For simplicity we just send to server and update on response.
  // Actually we'll just show a placeholder until the server returns.
  return '<em>Live preview will render after a moment…</em>';
}

function updatePreview_(form, fields) {
  const previewEl = form.querySelector('.sb-source__preview');
  if (!previewEl) return;
  google.script.run
    .withSuccessHandler((res) => {
      if (!res || !res.text) { previewEl.textContent = ''; return; }
      previewEl.innerHTML = renderPreviewHtml_(res);
    })
    .withFailureHandler(() => { /* ignore */ })
    .sidebarPreviewCitation(fields, (state.ctx && state.ctx.activeBundle && state.ctx.activeBundle.style) || 'mla');
}

function renderPreviewHtml_(formatted) {
  const text = formatted.text || '';
  const italics = formatted.italics || [];
  let html = '';
  let cursor = 0;
  italics.forEach(([s, e]) => {
    if (s > cursor) html += esc_(text.slice(cursor, s));
    html += '<em>' + esc_(text.slice(s, e)) + '</em>';
    cursor = e;
  });
  if (cursor < text.length) html += esc_(text.slice(cursor));
  return html;
}

function esc_(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---------- highlight render + edit/delete ----------

function renderHighlight(source, h) {
  const row = document.createElement('div');
  row.className = 'sb-highlight';
  row.setAttribute('data-highlight-id', h.highlightId);
  const color = colorForLabel_(h.primaryCategory) || '#dadce0';
  const bar = document.createElement('div');
  bar.className = 'sb-highlight__bar';
  bar.style.backgroundColor = color;
  row.appendChild(bar);

  const cat = document.createElement('div');
  cat.className = 'sb-highlight__cat';
  cat.appendChild(document.createTextNode(h.primaryCategory || '(no category)'));
  if (h.secondaryCategory) {
    const sec = document.createElement('span');
    sec.className = 'sb-highlight__secondary';
    sec.textContent = '+ ' + h.secondaryCategory;
    cat.appendChild(sec);
  }
  row.appendChild(cat);

  const t = document.createElement('div');
  t.className = 'sb-highlight__text';
  t.textContent = truncate_(h.highlightedText || '', 240);
  row.appendChild(t);

  if (h.note) {
    const n = document.createElement('div');
    n.className = 'sb-highlight__note';
    n.textContent = h.note;
    row.appendChild(n);
  }

  const actions = document.createElement('div');
  actions.className = 'sb-highlight__actions';
  const editBtn = document.createElement('button');
  editBtn.type = 'button';
  editBtn.className = 'sb-highlight__btn sb-highlight__btn--edit';
  editBtn.textContent = state.editingHighlightId === h.highlightId ? 'Done' : 'Edit';
  editBtn.addEventListener('click', () => {
    state.editingHighlightId = state.editingHighlightId === h.highlightId ? null : h.highlightId;
    render();
  });
  actions.appendChild(editBtn);

  const openInEditor = document.createElement('button');
  openInEditor.type = 'button';
  openInEditor.className = 'sb-highlight__btn sb-highlight__btn--edit';
  openInEditor.textContent = 'Open in editor';
  openInEditor.addEventListener('click', () => openSourceEditor_(source.sourceId, h.highlightId));
  actions.appendChild(openInEditor);

  // Two-step inline delete. First click on Delete turns the action row
  // into [Cancel][Confirm delete]; second click optimistically removes
  // the row locally and fires the server delete in the background.
  if (state.confirmingDeleteId === h.highlightId) {
    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'sb-highlight__btn sb-highlight__btn--cancel';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', () => {
      state.confirmingDeleteId = null;
      render();
    });
    actions.appendChild(cancelBtn);

    const confirmBtn = document.createElement('button');
    confirmBtn.type = 'button';
    confirmBtn.className = 'sb-highlight__btn sb-highlight__btn--confirm';
    confirmBtn.textContent = 'Confirm delete';
    confirmBtn.addEventListener('click', () => optimisticallyDeleteHighlight_(source, h));
    actions.appendChild(confirmBtn);
  } else {
    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'sb-highlight__btn sb-highlight__btn--delete';
    delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', () => {
      state.confirmingDeleteId = h.highlightId;
      render();
    });
    actions.appendChild(delBtn);
  }
  row.appendChild(actions);

  if (state.editingHighlightId === h.highlightId) {
    row.appendChild(renderHighlightEditor(h));
  }

  return row;
}

function renderHighlightEditor(h) {
  const bundle = activeBundle();
  if (!bundle) return document.createElement('div');
  const editor = document.createElement('div');
  editor.style.marginTop = '8px';
  editor.style.paddingTop = '8px';
  editor.style.borderTop = '1px dashed var(--c-line)';

  // Primary category swatches
  const primRow = document.createElement('div');
  primRow.style.cssText = 'display:flex; gap:4px; align-items:center; margin-bottom:6px;';
  const primLabel = document.createElement('span');
  primLabel.style.cssText = 'font-size:10px; color:var(--c-muted); min-width:70px; text-transform:uppercase;';
  primLabel.textContent = 'Category';
  primRow.appendChild(primLabel);
  for (let i = 1; i <= 5; i++) {
    const label = bundle['label' + i];
    const color = bundle['color' + i];
    if (!label) continue;
    primRow.appendChild(swatch_(label, color, h.primaryCategory === label, () => {
      saveHighlightPatch_(h, { primaryCategory: label });
      h.primaryCategory = label;
      render();
    }));
  }
  editor.appendChild(primRow);

  // Secondary
  const secRow = document.createElement('div');
  secRow.style.cssText = 'display:flex; gap:4px; align-items:center; margin-bottom:6px; flex-wrap:wrap;';
  const secLabel = document.createElement('span');
  secLabel.style.cssText = 'font-size:10px; color:var(--c-muted); min-width:70px; text-transform:uppercase;';
  secLabel.textContent = 'Secondary';
  secRow.appendChild(secLabel);
  for (let i = 1; i <= 5; i++) {
    const label = bundle['label' + i];
    const color = bundle['color' + i];
    if (!label) continue;
    secRow.appendChild(swatch_(label, color, h.secondaryCategory === label, () => {
      const next = h.secondaryCategory === label ? '' : label;
      saveHighlightPatch_(h, { secondaryCategory: next });
      h.secondaryCategory = next;
      render();
    }));
  }
  const noneBtn = document.createElement('button');
  noneBtn.type = 'button';
  noneBtn.style.cssText = 'width:22px; height:22px; border-radius:50%; border:2px dashed var(--c-muted); background:#fff; font-size:10px; color:var(--c-muted);';
  noneBtn.textContent = '∅';
  noneBtn.title = 'No secondary';
  noneBtn.addEventListener('click', () => {
    saveHighlightPatch_(h, { secondaryCategory: '' });
    h.secondaryCategory = '';
    render();
  });
  secRow.appendChild(noneBtn);
  editor.appendChild(secRow);

  // Note
  const noteWrap = document.createElement('div');
  const noteLabel = document.createElement('div');
  noteLabel.style.cssText = 'font-size:10px; color:var(--c-muted); text-transform:uppercase;';
  noteLabel.textContent = 'Note';
  const ta = document.createElement('textarea');
  ta.style.cssText = 'width:100%; border:1px solid var(--c-line); border-radius:4px; padding:4px 6px; font-size:12px; resize:vertical; min-height:40px;';
  ta.value = h.note || '';
  let timer;
  ta.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      saveHighlightPatch_(h, { note: ta.value });
      h.note = ta.value;
    }, 600);
  });
  noteWrap.appendChild(noteLabel);
  noteWrap.appendChild(ta);
  editor.appendChild(noteWrap);
  return editor;
}

function swatch_(label, color, active, onClick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.title = label;
  b.style.cssText = 'width:22px; height:22px; border-radius:50%; border:2px solid ' + (active ? '#202124' : 'transparent') + '; padding:0; background:' + color + '; cursor:pointer; background-clip:padding-box;';
  b.addEventListener('click', onClick);
  return b;
}

function colorForLabel_(label) {
  const bundle = activeBundle();
  if (!bundle || !label) return null;
  for (let i = 1; i <= 5; i++) {
    if (bundle['label' + i] === label) return bundle['color' + i];
  }
  return null;
}

function truncate_(s, n) {
  return s.length > n ? s.slice(0, n) + '…' : s;
}

// ---------- save / failure plumbing ----------

/**
 * Open the per-source editor modal. Stores the sourceId in state so the
 * sidebar's polling loop (Task 12) knows to refresh while the modal is open.
 */
function openSourceEditor_(sourceId, focusHighlightId) {
  state.modalOpenForSourceId = sourceId;
  state.lastDataJson = JSON.stringify({ sources: state.sources, highlights: state.highlights });
  startEditorPolling_();   // defined in Task 12
  google.script.run
    .withFailureHandler((e) => {
      state.modalOpenForSourceId = null;
      stopEditorPolling_();   // defined in Task 12
      onFail('opening editor')(e);
    })
    .sidebarOpenSourceEditor(state.projectId, sourceId, focusHighlightId || '');
}

const POLL_INTERVAL_MS = 3000;
const POLL_MAX_UNCHANGED_TICKS = 200;   // ~10 minutes — bounded fallback stop

/**
 * While a modal is open, refetch project data every 3s and diff against
 * the previous response. On change, update local state and re-render.
 *
 * Stop conditions:
 *   (a) the sourceId the modal opened on disappears from the response
 *       (the modal deleted the source);
 *   (b) we hit POLL_MAX_UNCHANGED_TICKS unchanged ticks in a row (the
 *       user closed the modal without edits and we shouldn't poll
 *       forever).
 */
function startEditorPolling_() {
  if (state.pollHandle) return;
  state.pollUnchangedTicks = 0;
  state.pollHandle = setInterval(pollTick_, POLL_INTERVAL_MS);
}

function stopEditorPolling_() {
  if (!state.pollHandle) return;
  clearInterval(state.pollHandle);
  state.pollHandle = null;
  state.modalOpenForSourceId = null;
  state.pollUnchangedTicks = 0;
}

function pollTick_() {
  if (!state.modalOpenForSourceId || !state.projectId) {
    stopEditorPolling_();
    return;
  }
  google.script.run
    .withSuccessHandler(onPollResponse_)
    .withFailureHandler(() => { /* swallow transient errors; retry next tick */ })
    .sidebarGetProjectData(state.projectId);
}

function onPollResponse_(resp) {
  if (!resp || !resp.ok) return;
  const json = JSON.stringify({ sources: resp.sources, highlights: resp.highlights });
  if (json === state.lastDataJson) {
    state.pollUnchangedTicks++;
    if (state.pollUnchangedTicks >= POLL_MAX_UNCHANGED_TICKS) stopEditorPolling_();
    return;
  }
  state.pollUnchangedTicks = 0;
  state.lastDataJson = json;
  state.sources = resp.sources || [];
  state.highlights = resp.highlights || [];
  state.confirmingDeleteId = null;
  els.insert.disabled = state.sources.length === 0;
  renderFilter();
  render();

  // Heuristic: if the source the modal opened on is gone, the modal closed
  // via a source delete. Stop polling.
  const stillExists = state.sources.some((s) => s.sourceId === state.modalOpenForSourceId);
  if (!stillExists) stopEditorPolling_();
}

function saveSourcePatch_(source, patch) {
  const merged = Object.assign({}, patch, { sourceId: source.sourceId, projectId: state.projectId });
  google.script.run
    .withSuccessHandler(() => setStatus('Saved.', 'good', 1500))
    .withFailureHandler(onFail('saving source'))
    .sidebarUpdateSource(merged);
}

function saveHighlightPatch_(highlight, patch) {
  const merged = Object.assign({}, patch, { highlightId: highlight.highlightId, projectId: state.projectId });
  google.script.run
    .withSuccessHandler(() => setStatus('Saved.', 'good', 1500))
    .withFailureHandler(onFail('saving highlight'))
    .sidebarUpdateHighlight(merged);
}

/**
 * Remove the highlight from local state immediately, re-render, then fire
 * the server delete. On failure, restore state and surface the error.
 *
 * Server-side: if this was the last highlight pointing at the source, the
 * source row gets cascade-deleted too — mirror that locally so the UI
 * matches what a fresh load would show.
 */
function optimisticallyDeleteHighlight_(source, highlight) {
  const cascade = state.highlights.filter(
    (x) => x.sourceId === highlight.sourceId && x.highlightId !== highlight.highlightId
  ).length === 0;

  // Snapshot what we're about to remove, in case the server rejects.
  const snapshotHighlight = highlight;
  const snapshotSource = cascade ? state.sources.find((s) => s.sourceId === highlight.sourceId) : null;
  const snapshotHighlightIdx = state.highlights.findIndex((h) => h.highlightId === highlight.highlightId);
  const snapshotSourceIdx = snapshotSource ? state.sources.findIndex((s) => s.sourceId === snapshotSource.sourceId) : -1;

  // Apply optimistically.
  state.highlights = state.highlights.filter((h) => h.highlightId !== highlight.highlightId);
  if (snapshotSource) {
    state.sources = state.sources.filter((s) => s.sourceId !== snapshotSource.sourceId);
  }
  state.confirmingDeleteId = null;
  if (state.editingHighlightId === highlight.highlightId) state.editingHighlightId = null;
  els.insert.disabled = state.sources.length === 0;
  renderFilter();
  render();
  setStatus('Deleted.', 'good', 1500);

  google.script.run
    .withSuccessHandler(() => { /* UI already reflects the deletion */ })
    .withFailureHandler((e) => {
      // Roll back. Put items back at their original indices so the order
      // doesn't shuffle just because a delete failed.
      const insertAt = (arr, idx, item) => {
        if (idx < 0 || idx > arr.length) arr.push(item);
        else arr.splice(idx, 0, item);
      };
      insertAt(state.highlights, snapshotHighlightIdx, snapshotHighlight);
      if (snapshotSource) insertAt(state.sources, snapshotSourceIdx, snapshotSource);
      els.insert.disabled = state.sources.length === 0;
      renderFilter();
      render();
      setStatus('Delete failed: ' + (e && e.message || e), 'bad');
    })
    .sidebarDeleteHighlight(highlight.highlightId, state.projectId, cascade);
}

function insertBibliography() {
  els.insert.disabled = true;
  setStatus('Inserting…');
  google.script.run
    .withSuccessHandler((res) => {
      els.insert.disabled = false;
      if (res && res.ok) {
        setStatus('Inserted ' + (res.inserted.primary + res.inserted.secondary) + ' source(s).', 'good', 3000);
      } else {
        setStatus('Insert failed.', 'bad');
      }
    })
    .withFailureHandler((e) => {
      els.insert.disabled = false;
      setStatus(String(e && e.message || e), 'bad');
    })
    .sidebarInsertBibliography(state.projectId);
}

function setStatus(text, kind, autoClearMs) {
  els.status.textContent = text || '';
  els.status.className = 'sb-status' + (kind ? ' sb-status--' + kind : '');
  if (autoClearMs) {
    setTimeout(() => {
      if (els.status.textContent === text) {
        els.status.textContent = '';
        els.status.className = 'sb-status';
      }
    }, autoClearMs);
  }
}

function onFail(stage) {
  return (e) => setStatus(stage + ': ' + (e && e.message || e), 'bad');
}
</script>
