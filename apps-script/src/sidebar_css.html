<style>
:root {
  --c-text: #202124;
  --c-muted: #5f6368;
  --c-line: #dadce0;
  --c-bg: #ffffff;
  --c-soft: #f8f9fa;
  --c-accent: #1a73e8;
  --c-good: #0f9d58;
  --c-warn: #b06000;
  --c-bad: #d93025;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
  color: var(--c-text);
  background: var(--c-bg);
}
button { font: inherit; cursor: pointer; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
select, input, textarea { font: inherit; }

.sb-header {
  padding: 10px 12px;
  border-bottom: 1px solid var(--c-line);
}
.sb-header__row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.sb-title { margin: 0; font-size: 14px; font-weight: 600; }
.sb-actor { font-size: 11px; color: var(--c-muted); margin-top: 2px; }

.sb-viewmode {
  padding: 6px 10px 4px;
  border-bottom: 1px solid var(--c-line);
}
.sb-viewmode__pills {
  display: inline-flex; background: #f1f3f4; border-radius: 999px; padding: 2px;
}
.sb-viewmode__pill {
  background: transparent; border: none; padding: 4px 12px;
  font-size: 11px; color: var(--c-muted); border-radius: 999px;
}
.sb-viewmode__pill--active {
  background: #fff; color: var(--c-accent); font-weight: 500;
  box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}

.sb-project-picker {
  padding: 8px 12px;
  border-bottom: 1px solid var(--c-line);
  display: flex; flex-direction: column; gap: 4px;
}
.sb-project-picker label {
  font-size: 10px; color: var(--c-muted);
  text-transform: uppercase; letter-spacing: 0.04em;
}
.sb-project-picker select {
  padding: 6px 8px; border: 1px solid var(--c-line); border-radius: 4px;
}

.sb-filter {
  padding: 4px 10px 6px;
  border-bottom: 1px solid var(--c-line);
}
.sb-filter__row {
  display: flex; gap: 4px;
  margin: 4px 0 0;
}
/* Category strip: single horizontal row. If the bundle config ever has
   labels long enough to push the dot chips off-screen at 300px, the
   strip becomes scrollable rather than wrapping into 4-5 rows. */
.sb-filter__row--cats {
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;            /* Firefox */
  -ms-overflow-style: none;         /* Edge legacy */
}
.sb-filter__row--cats::-webkit-scrollbar { display: none; }
.sb-filter__row--ps {
  font-size: 11px; color: var(--c-muted); align-items: center; flex-wrap: wrap;
}
.sb-filter-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: #f1f3f4; border: 1px solid transparent;
  border-radius: 999px; padding: 3px 8px 3px 6px;
  font-size: 11px; color: var(--c-muted); white-space: nowrap;
  flex-shrink: 0;
}
.sb-filter-chip--active {
  background: #fff; border-color: var(--c-accent); color: var(--c-accent); font-weight: 500;
}
.sb-filter-chip--all { padding: 3px 8px; }
.sb-filter-chip--dot { padding: 3px 7px 3px 5px; }
.sb-filter-chip__dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.sb-filter-chip__count {
  background: rgba(0,0,0,0.05); border-radius: 999px; padding: 0 6px; font-size: 10px;
}

/* Inline legend row that only renders when a category filter is active.
   Shows the selected label + a one-click clear, so the filter strip can
   stay all-dots-no-labels without leaving students guessing which
   category they're currently filtered to. */
.sb-filter__legend {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 4px;
  font-size: 11px; color: var(--c-text);
  background: #fff; border: 1px solid var(--c-line);
  border-radius: 999px; padding: 2px 4px 2px 8px;
}
.sb-filter__legend-dot {
  width: 8px; height: 8px; border-radius: 50%; display: inline-block;
}
.sb-filter__legend-clear {
  background: none; border: none; color: var(--c-muted);
  font-size: 14px; line-height: 1; padding: 0 4px; cursor: pointer;
}
.sb-filter__legend-clear:hover { color: var(--c-bad); }

.sb-ps-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; }

.sb-main {
  padding: 8px 0 0;
  overflow-y: auto;
  height: calc(100vh - 230px);
}
.sb-empty {
  padding: 24px 14px; text-align: center;
  color: var(--c-muted); font-size: 12px; line-height: 1.5;
}

/* ---- Loading state shared by sidebar + modal ---- */
.sb-loading {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 32px 14px; color: var(--c-muted); font-size: 12px;
}
.sb-loading__spinner {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--c-line);
  border-top-color: var(--c-accent);
  animation: sb-spin 0.7s linear infinite;
}
.sb-loading__label { font-size: 12px; }
.sb-loading__spinner--sm {
  width: 14px; height: 14px; border-width: 2px;
  display: inline-block; vertical-align: middle; margin-right: 6px;
}
.sb-loading__spinner--on-accent {
  border-color: rgba(255, 255, 255, 0.35);
  border-top-color: #fff;
}
.sb-loading__spinner--on-muted {
  border-color: var(--c-line);
  border-top-color: var(--c-accent);
}
@keyframes sb-spin { to { transform: rotate(360deg); } }

/* Skeleton card placeholder shown while sidebar is fetching sources. */
.sb-skeleton {
  margin: 0 10px 10px;
  padding: 10px 12px;
  background: var(--c-soft);
  border: 1px solid var(--c-line);
  border-radius: 6px;
  animation: sb-pulse 1.4s ease-in-out infinite;
}
.sb-skeleton__line {
  height: 10px; background: var(--c-line); border-radius: 4px;
  margin-bottom: 6px;
}
.sb-skeleton__line--short { width: 40%; }
.sb-skeleton__line--mid   { width: 70%; }
.sb-skeleton__line--long  { width: 95%; }
@keyframes sb-pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

.sb-source {
  margin: 0 10px 10px;
  padding: 10px 12px;
  background: var(--c-soft);
  border: 1px solid var(--c-line);
  border-radius: 6px;
}
.sb-source__head {
  display: flex; justify-content: space-between; gap: 6px; align-items: flex-start;
}
.sb-source__head--clickable { cursor: pointer; user-select: none; }
.sb-source__head--clickable:hover .sb-source__title { color: var(--c-accent); }
.sb-source__titlewrap { display: flex; align-items: flex-start; gap: 6px; min-width: 0; flex: 1; }
.sb-source__caret { color: var(--c-muted); font-size: 11px; margin-top: 2px; flex-shrink: 0; }
.sb-source__title {
  font-weight: 500; font-size: 13px;
  word-break: break-word;
}
.sb-source__url {
  font-size: 11px; color: var(--c-muted);
  word-break: break-all;
  margin-top: 2px;
}
.sb-source__chip {
  font-size: 10px; padding: 2px 6px;
  border-radius: 999px; white-space: nowrap;
}
.sb-source__chip--primary   { background: #e6f4ea; color: var(--c-good); }
.sb-source__chip--secondary { background: #e8f0fe; color: var(--c-accent); }
.sb-source__chip--unset     { background: #fce8e6; color: var(--c-bad); }

.sb-source__meta {
  display: flex; align-items: center; gap: 8px;
  margin-top: 6px;
  font-size: 11px; color: var(--c-muted);
  flex-wrap: wrap;
}
.sb-source__action {
  background: none; border: none; color: var(--c-accent);
  font-size: 11px; padding: 2px 4px;
}
.sb-source__action:hover { text-decoration: underline; }
.sb-source__expand { /* keep selector for back-compat — handled by .sb-source__action */ }

.sb-source__breakdown {
  display: flex; flex-wrap: wrap; align-items: center; gap: 3px;
  margin-top: 5px;
}
.sb-source__breakdown-dot {
  width: 8px; height: 8px; border-radius: 50%; display: inline-block;
}
.sb-source__breakdown-count {
  font-size: 10px; color: var(--c-muted); margin-right: 4px;
}

.sb-source__filter {
  display: flex; flex-wrap: wrap; gap: 3px;
  margin-top: 8px; padding-top: 6px;
  border-top: 1px dashed var(--c-line);
}
.sb-filter-chip--mini {
  padding: 2px 8px 2px 4px;
  font-size: 10px;
}
.sb-filter-chip--mini .sb-filter-chip__dot { width: 8px; height: 8px; }

.sb-source__form {
  margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed var(--c-line);
  display: flex; flex-direction: column; gap: 6px;
}
.sb-source__form label {
  font-size: 10px; color: var(--c-muted); text-transform: uppercase; letter-spacing: 0.04em;
}
.sb-source__form input, .sb-source__form textarea, .sb-source__form select {
  width: 100%; padding: 5px 7px; border: 1px solid var(--c-line); border-radius: 4px;
  font-size: 12px;
}
.sb-source__form textarea { resize: vertical; min-height: 48px; }
.sb-source__form-row { display: flex; gap: 6px; }
.sb-source__form-row > label { flex: 1; display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--c-text); text-transform: none; letter-spacing: 0; }
.sb-source__preview {
  font-size: 11px; color: var(--c-muted);
  background: var(--c-bg); border: 1px solid var(--c-line); border-radius: 4px;
  padding: 6px 8px; line-height: 1.4;
}
.sb-source__preview em { font-style: italic; }
.sb-source__annotation {
  margin-top: 6px;
}
.sb-source__annotation label { font-size: 10px; color: var(--c-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.sb-source__annotation textarea {
  width: 100%; padding: 5px 7px; border: 1px solid var(--c-line); border-radius: 4px;
  font-size: 12px; resize: vertical; min-height: 48px;
}

.sb-highlights { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.sb-highlight {
  position: relative;
  padding: 6px 8px 6px 14px;
  background: var(--c-bg);
  border: 1px solid var(--c-line); border-radius: 4px;
  font-size: 12px;
}
.sb-highlight__bar {
  position: absolute; top: 6px; bottom: 6px; left: 4px; width: 4px; border-radius: 2px;
}
.sb-highlight__cat {
  font-size: 10px; color: var(--c-muted);
  display: flex; gap: 6px; align-items: center;
  margin-bottom: 2px;
}
.sb-highlight__secondary {
  font-size: 9px; background: #f1f3f4; padding: 1px 6px; border-radius: 3px;
}
.sb-highlight__text { line-height: 1.4; }
.sb-highlight__note { font-style: italic; color: var(--c-muted); font-size: 11px; margin-top: 4px; }
.sb-highlight__actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
.sb-highlight__btn { background: none; border: none; font-size: 10px; padding: 2px 4px; }
.sb-highlight__btn--edit { color: var(--c-accent); }
.sb-highlight__btn--delete { color: var(--c-bad); }
.sb-highlight__btn--cancel { color: var(--c-muted); }
.sb-highlight__btn--confirm {
  background: var(--c-bad); color: #fff;
  border-radius: 3px; padding: 2px 8px; font-weight: 500;
}
.sb-highlight__btn--confirm:hover { filter: brightness(1.05); }

.sb-footer {
  border-top: 1px solid var(--c-line);
  padding: 10px 12px;
  background: var(--c-bg);
  position: sticky; bottom: 0;
}
#sb-insert {
  width: 100%; padding: 8px 12px;
  background: var(--c-accent); color: #fff; border: none; border-radius: 4px;
  font-weight: 500;
}
#sb-insert:disabled { background: #9aa0a6; }
#sb-open-editor {
  width: 100%; padding: 7px 12px;
  background: #fff; color: var(--c-accent);
  border: 1px solid var(--c-accent); border-radius: 4px;
  font-weight: 500;
  margin-bottom: 6px;
}
#sb-open-editor:hover:not(:disabled) { background: #e8f0fe; }
#sb-open-editor:disabled { color: var(--c-muted); border-color: var(--c-line); cursor: not-allowed; }
.sb-status { font-size: 11px; color: var(--c-muted); margin-top: 4px; text-align: center; min-height: 14px; }
.sb-status--good { color: var(--c-good); }
.sb-status--bad  { color: var(--c-bad); }
.sb-status--warn { color: var(--c-warn); }


/* ---- Per-source editor modal ---- */
.sb-body--modal {
  height: 100vh;
  overflow-x: hidden;     /* critical — prevents horizontal scroll under any condition */
  overflow-y: hidden;
  display: flex;
  flex-direction: column;
}
.sb-modal__header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--c-line);
  background: var(--c-bg);
  flex-shrink: 0;
}
.sb-modal__close {
  background: none; border: none; font-size: 22px; line-height: 1;
  color: var(--c-muted); padding: 0 8px; cursor: pointer;
}
.sb-modal__close:hover { color: var(--c-text); }
.sb-modal__title {
  margin: 0; font-size: 16px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1; min-width: 0;
}
.sb-modal__source-select {
  flex: 1; min-width: 0;
  font-size: 15px; font-weight: 600; color: var(--c-text);
  background: var(--c-bg);
  border: 1px solid var(--c-line); border-radius: 4px;
  padding: 6px 28px 6px 10px;
  text-overflow: ellipsis;
  cursor: pointer;
}
.sb-modal__source-select:hover  { border-color: var(--c-accent); }
.sb-modal__source-select:focus  { outline: none; border-color: var(--c-accent); }
.sb-modal__source-select:disabled { cursor: default; color: var(--c-muted); }
.sb-modal__body {
  flex: 1; min-height: 0;
  display: flex; gap: 12px;
  padding: 12px;
}
.sb-modal__pane {
  overflow-y: auto;
  min-width: 0;            /* critical — without this, flex children force horizontal overflow */
  display: flex; flex-direction: column; gap: 10px;
}
.sb-modal__pane--left  { flex: 0 0 46%; padding-right: 6px; border-right: 1px solid var(--c-line); }
.sb-modal__pane--right { flex: 1; }
.sb-modal__paneheader {
  margin: 0; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.04em; color: var(--c-muted);
}
.sb-modal__paneheader-row {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
}
.sb-modal__placeholder {
  padding: 12px; font-size: 12px; color: var(--c-muted); font-style: italic;
}
.sb-modal__status {
  padding: 4px 14px 8px; font-size: 11px; color: var(--c-muted); text-align: center;
  min-height: 14px; flex-shrink: 0;
}
.sb-modal__status--good { color: var(--c-good); }
.sb-modal__status--bad  { color: var(--c-bad); }
.sb-modal__filter {
  display: flex; flex-wrap: wrap; gap: 3px;
}
.sb-modal__banner {
  background: #fef7e0; border: 1px solid #f0d000; border-radius: 4px;
  padding: 8px 10px; font-size: 12px; color: #5f4400; margin-bottom: 8px;
}
.sb-modal__danger {
  margin-top: 16px; padding-top: 12px;
  border-top: 1px solid var(--c-line);
  display: flex; gap: 6px; flex-wrap: wrap;
}
.sb-modal__btn {
  padding: 6px 10px; border-radius: 4px; font-size: 12px;
  border: 1px solid var(--c-line); background: #fff; cursor: pointer;
}
.sb-modal__btn--cancel { color: var(--c-muted); }
.sb-modal__btn--danger-outline {
  color: var(--c-bad); border-color: var(--c-bad); background: #fff;
}
.sb-modal__btn--danger-outline:hover { background: #fce8e6; }
.sb-modal__btn--danger {
  background: var(--c-bad); color: #fff; border-color: var(--c-bad);
  font-weight: 500;
}
.sb-modal__btn--danger:hover { filter: brightness(1.05); }
</style>
