<style>
@import url('https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap');
/* Orono Technology (OPS) brand palette — blue primary, red accents, true-gray
   neutrals. Canonical hexes from the OPS Tech stylesheet; semantic var names
   kept so existing rules pick up the brand colors without renaming. */
:root {
  --c-text: #333333;   /* gray-900 — body text (not pure black) */
  --c-muted: #666666;  /* gray-700 — muted labels / captions */
  --c-line: #e0e0e0;   /* gray-200 — subtle borders / dividers */
  --c-bg: #ffffff;
  --c-soft: #f3f3f3;   /* gray-100 — off-white surfaces */
  --c-accent: #2d3f89; /* brand blue (blue-700) */
  --c-accent-strong: #1d2a5d; /* blue-900 — titles, strongest emphasis */
  --c-accent-hover: #f4f6fa;  /* blue-50 — outlined/ghost hover wash */
  --c-blue-subtle: #eaecf5;   /* blue-100 — info tint / active facet */
  --c-red-subtle: #e5c7c7;    /* red-100 — accent/destructive tint */
  --c-good: #4356a9;   /* blue-600 — success (brand has no green) */
  --c-warn: #c13435;   /* red-600 — warnings (brand warnings are red) */
  --c-bad: #ad2122;    /* brand red (red-700) — destructive / error */
  --c-font-head: "Lexend", -apple-system, BlinkMacSystemFont, "Segoe UI", Calibri, Arial, sans-serif;
  --c-font-body: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--c-font-body);
  font-size: 13px;
  color: var(--c-text);
  background: var(--c-bg);
}
button { font: inherit; cursor: pointer; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
select, input, textarea { font: inherit; }

.sb-header {
  padding: 10px 12px;
  border-bottom: 1px solid var(--c-line);
}
.sb-header__row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.sb-title { margin: 0; font-size: 15px; font-weight: 700; font-family: var(--c-font-head); color: var(--c-accent-strong); letter-spacing: -0.01em; }
.sb-actor { font-size: 11px; color: var(--c-muted); margin-top: 2px; }

.sb-viewmode {
  padding: 6px 10px;
  border-bottom: 1px solid var(--c-line);
}
/* Pills (left) + Sort & Filter (right) share one row to save a row of height. */
.sb-viewmode__row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sb-viewmode__pills {
  display: inline-flex; background: var(--c-soft); border-radius: 999px; padding: 2px;
}
.sb-viewmode__pill {
  background: transparent; border: none; padding: 4px 12px;
  font-size: 11px; color: var(--c-muted); border-radius: 999px;
}
.sb-viewmode__pill--active {
  background: #fff; color: var(--c-accent); font-weight: 500;
  box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}

.sb-project-picker {
  padding: 8px 12px;
  border-bottom: 1px solid var(--c-line);
  display: flex; flex-direction: column; gap: 4px;
}
.sb-project-picker label {
  font-size: 10px; color: var(--c-muted);
  text-transform: uppercase; letter-spacing: 0.04em;
}
.sb-project-picker select {
  padding: 6px 8px; border: 1.5px solid var(--c-line); border-radius: 6px;
}

/* OPS accessibility focus ring on form controls — 3px blue-700 @ ~12%. */
.sb-project-picker select:focus,
.sb-source__form input:focus,
.sb-source__form select:focus,
.sb-source__form textarea:focus,
.sb-source__annotation textarea:focus {
  outline: none;
  border-color: #4356a9;
  box-shadow: 0 0 0 3px rgba(45, 63, 137, 0.12);
}

.sb-filter__row {
  display: flex; gap: 4px;
  margin: 4px 0 0;
}
/* Sort & Filter — a single trigger button (sharing the view-mode row) that
   opens a popover holding the sort options (single-select), category
   checkboxes (multi-select), and the Primary/Secondary/Unset type checkboxes.
   Replaces the always-visible facet list to reclaim vertical space. */
.sb-sortfilter { position: relative; flex-shrink: 0; }
.sb-sortfilter[hidden] { display: none; }
#sb-sortfilter-trigger {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border: 1.5px solid var(--c-line); border-radius: 6px;
  background: #fff; color: var(--c-text); font-size: 12px; font-weight: 500;
  white-space: nowrap;
}
#sb-sortfilter-trigger:hover,
#sb-sortfilter-trigger[aria-expanded="true"] { border-color: var(--c-accent); }
.sb-sortfilter__badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 16px; height: 16px; padding: 0 5px;
  background: var(--c-accent); color: #fff;
  font-size: 10px; font-weight: 600; border-radius: 999px;
}
.sb-sortfilter__badge[hidden] { display: none; }   /* display:inline-flex above beats [hidden] */
.sb-sortfilter__caret { font-size: 9px; line-height: 1; transition: transform 0.15s ease; }
#sb-sortfilter-trigger[aria-expanded="true"] .sb-sortfilter__caret { transform: rotate(180deg); }

.sb-sortfilter-pop {
  position: absolute; right: 0; left: auto; top: calc(100% + 6px); z-index: 30;
  width: 250px; max-width: calc(100vw - 24px);
  max-height: calc(100vh - 130px); overflow-y: auto;
  background: #fff; border: 1px solid var(--c-line); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(29, 42, 93, 0.16);
  padding: 6px;
}
.sb-sortfilter-pop[hidden] { display: none; }
.sb-pop-section { padding: 4px 2px 8px; }
.sb-pop-section + .sb-pop-section { border-top: 1px solid var(--c-line); padding-top: 8px; }
.sb-pop-section__title {
  font-family: var(--c-font-body);
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--c-muted); margin: 0 6px 6px;
}
.sb-pop-opt {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 6px 8px; border-radius: 6px; font-size: 12px; color: var(--c-text);
  cursor: pointer;
}
.sb-pop-opt:hover { background: var(--c-soft); }
.sb-pop-opt input { margin: 0; accent-color: var(--c-accent); flex-shrink: 0; cursor: pointer; }
.sb-pop-opt__dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
.sb-pop-opt__label {
  flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sb-pop-opt__count {
  font-size: 11px; color: var(--c-muted);
  background: rgba(0, 0, 0, 0.05); border-radius: 999px;
  padding: 0 7px; min-width: 22px; text-align: center;
}
.sb-pop-actions { display: flex; justify-content: flex-end; padding: 4px 2px 2px; border-top: 1px solid var(--c-line); }
#sb-filter-clear {
  background: none; border: none; color: var(--c-accent);
  font-size: 12px; font-weight: 500; padding: 4px 8px; border-radius: 6px;
}
#sb-filter-clear:hover:not(:disabled) { background: var(--c-accent-hover); }
#sb-filter-clear:disabled { color: var(--c-muted); cursor: default; }
.sb-filter__row--ps {
  font-size: 11px; color: var(--c-muted); align-items: center; flex-wrap: wrap;
}
.sb-filter-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--c-soft); border: 1px solid transparent;
  border-radius: 999px; padding: 3px 8px 3px 6px;
  font-size: 11px; color: var(--c-muted); white-space: nowrap;
  flex-shrink: 0;
}
.sb-filter-chip--active {
  background: #fff; border-color: var(--c-accent); color: var(--c-accent); font-weight: 500;
}
.sb-filter-chip__dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.sb-filter-chip__count {
  background: rgba(0,0,0,0.05); border-radius: 999px; padding: 0 6px; font-size: 10px;
}

.sb-ps-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; }

.sb-main {
  padding: 8px 0 0;
  overflow-y: auto;
  height: calc(100vh - 230px);
}
.sb-empty {
  padding: 24px 14px; text-align: center;
  color: var(--c-muted); font-size: 12px; line-height: 1.5;
}

/* ---- Loading state shared by sidebar + modal ---- */
.sb-loading {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 32px 14px; color: var(--c-muted); font-size: 12px;
}
.sb-loading__spinner {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--c-line);
  border-top-color: var(--c-accent);
  animation: sb-spin 0.7s linear infinite;
}
.sb-loading__label { font-size: 12px; }
.sb-loading__spinner--sm {
  width: 14px; height: 14px; border-width: 2px;
  display: inline-block; vertical-align: middle; margin-right: 6px;
}
.sb-loading__spinner--on-accent {
  border-color: rgba(255, 255, 255, 0.35);
  border-top-color: #fff;
}
.sb-loading__spinner--on-muted {
  border-color: var(--c-line);
  border-top-color: var(--c-accent);
}
@keyframes sb-spin { to { transform: rotate(360deg); } }

/* Skeleton card placeholder shown while sidebar is fetching sources. */
.sb-skeleton {
  margin: 0 10px 10px;
  padding: 10px 12px;
  background: var(--c-soft);
  border: 1px solid var(--c-line);
  border-radius: 6px;
  animation: sb-pulse 1.4s ease-in-out infinite;
}
.sb-skeleton__line {
  height: 10px; background: var(--c-line); border-radius: 4px;
  margin-bottom: 6px;
}
.sb-skeleton__line--short { width: 40%; }
.sb-skeleton__line--mid   { width: 70%; }
.sb-skeleton__line--long  { width: 95%; }
@keyframes sb-pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* Sources are no longer boxed in a gray container — just a header + its
   highlight cards, with a hairline divider separating one source from the
   next. The bordered highlight cards carry the visual structure. */
.sb-source {
  margin: 0 10px;
  padding: 10px 0;
}
.sb-source + .sb-source { border-top: 1px solid var(--c-line); }
.sb-source__head {
  display: flex; justify-content: space-between; gap: 6px; align-items: flex-start;
}
.sb-source__head--clickable { cursor: pointer; user-select: none; }
.sb-source__head--clickable:hover .sb-source__title { color: var(--c-accent); }
.sb-source__titlewrap { display: flex; align-items: flex-start; gap: 6px; min-width: 0; flex: 1; }
.sb-source__caret { color: var(--c-muted); font-size: 11px; margin-top: 2px; flex-shrink: 0; }
.sb-source__title {
  font-weight: 500; font-size: 13px;
  word-break: break-word;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
}
.sb-source__url {
  font-size: 11px; color: var(--c-muted);
  word-break: break-all;
  margin-top: 2px;
}
.sb-source__chip {
  font-size: 10px; padding: 2px 6px;
  border: 1px solid transparent;
  border-radius: 999px; white-space: nowrap; flex-shrink: 0;
}
.sb-source__chip--primary   { background: var(--c-blue-subtle); color: var(--c-accent-strong); }
.sb-source__chip--secondary { background: var(--c-red-subtle); color: var(--c-bad); }
.sb-source__chip--unset     { background: var(--c-soft); color: var(--c-muted); }
/* Clickable classification chip → opens an anchored picker. */
.sb-source__chip--clickable { cursor: pointer; }
.sb-source__chip--clickable:hover { filter: brightness(0.96); }
.sb-source__chip-caret { font-size: 7px; margin-left: 3px; vertical-align: middle; opacity: 0.75; }

.sb-ps-pop {
  position: fixed; z-index: 60; display: none;
  min-width: 132px; padding: 4px;
  background: #fff; border: 1px solid var(--c-line); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(29, 42, 93, 0.16);
}
.sb-ps-pop__opt {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 7px 10px; border: none; background: none; border-radius: 6px;
  font-size: 12px; color: var(--c-text); text-align: left; cursor: pointer;
}
.sb-ps-pop__opt:hover { background: var(--c-soft); }
.sb-ps-pop__opt--active { font-weight: 600; }
.sb-ps-pop__dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

.sb-source__meta {
  display: flex; align-items: center; gap: 8px;
  margin-top: 6px;
  font-size: 11px; color: var(--c-muted);
  flex-wrap: wrap;
}
.sb-source__action {
  background: none; border: none; color: var(--c-accent);
  font-size: 11px; padding: 2px 4px;
}
.sb-source__action:hover { text-decoration: underline; }
a.sb-source__action { text-decoration: none; }
a.sb-source__action:hover { text-decoration: underline; }
.sb-source__expand { /* keep selector for back-compat — handled by .sb-source__action */ }

/* Per-source depth recap (shown only when a depth requirement is set). Subtle,
   tabular figures so "h/min · c/min" stays legible inline in the meta row. */
.sb-source__depth {
  font-size: 11px; color: var(--c-muted); font-variant-numeric: tabular-nums;
}

/* Overall "Sources: X / N" progress line (shown only when minSources is set). */
.sb-srcprog {
  margin: 0 10px 8px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--c-text);
}
.sb-srcprog--unmet { color: var(--c-warn); font-weight: 600; }
.sb-srcprog--met   { color: var(--c-good); font-weight: 600; }

.sb-source__breakdown {
  display: flex; flex-wrap: wrap; align-items: center; gap: 3px;
  margin-top: 5px;
}
.sb-source__breakdown-dot {
  width: 8px; height: 8px; border-radius: 50%; display: inline-block;
}
.sb-source__breakdown-count {
  font-size: 10px; color: var(--c-muted); margin-right: 4px;
}

.sb-source__filter {
  display: flex; flex-wrap: wrap; gap: 3px;
  margin-top: 8px; padding-top: 6px;
  border-top: 1px dashed var(--c-line);
}
.sb-filter-chip--mini {
  padding: 2px 8px 2px 4px;
  font-size: 10px;
}
.sb-filter-chip--mini .sb-filter-chip__dot { width: 8px; height: 8px; }

.sb-btn {
  border: 1px solid var(--c-line); background: #fff; color: var(--c-text);
  border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;
}
.sb-btn--primary { background: var(--c-accent); border-color: var(--c-accent); color: #fff; font-weight: 600; }
.sb-btn--primary:hover { background: var(--c-accent-strong); }

.sb-highlights { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
/* Category color is carried by a subtle tinted fill + thin same-hue border
   (both set inline from the category color via tint_()), not a left bar. */
.sb-highlight {
  padding: 7px 9px;
  background: var(--c-bg);
  border: 1px solid var(--c-line); border-radius: 6px;
  font-size: 12px;
}
.sb-highlight__cat {
  font-size: 10px; color: var(--c-muted);
  display: flex; gap: 5px; align-items: center; flex-wrap: wrap;
  margin-bottom: 2px;
}
.sb-highlight__secondary {
  font-size: 9px; background: var(--c-soft); padding: 1px 6px; border-radius: 3px;
}

/* Category tags on a highlight card (swatch · label). The one matching the
   active filter is bold + tinted (background set inline to its category color),
   so a card matched via its secondary tag visibly shows why. */
.sb-hl-tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; color: var(--c-muted);
  padding: 1px 6px 1px 5px; border-radius: 999px;
}
.sb-hl-tag__dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sb-hl-tag--secondary { background: var(--c-soft); }
.sb-hl-tag--match { color: var(--c-text); font-weight: 600; }
.sb-highlight__text { line-height: 1.4; white-space: pre-wrap; }
/* Whole card is the expand/collapse target when text is trimmed. */
.sb-highlight--expandable { cursor: pointer; }
.sb-highlight--expandable:hover { box-shadow: 0 1px 5px rgba(29, 42, 93, 0.13); }
.sb-highlight__chevron { margin-left: auto; flex-shrink: 0; color: var(--c-muted); font-size: 9px; }
.sb-highlight__note { font-style: italic; color: var(--c-muted); font-size: 11px; margin-top: 4px; }

.sb-footer {
  border-top: 1px solid var(--c-line);
  padding: 10px 12px;
  background: var(--c-bg);
  position: sticky; bottom: 0;
}
/* Insert References — single primary action that opens an anchored popover
   menu (Annotated Bibliography / Works Cited, room for future insert types).
   The footer is pinned to the bottom, so the menu opens upward. */
.sb-insert-menu { position: relative; }
#sb-insert-trigger {
  width: 100%; padding: 8px 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--c-accent); color: #fff; border: none; border-radius: 4px;
  font-weight: 500;
}
#sb-insert-trigger:hover:not(:disabled) { filter: brightness(1.05); }
#sb-insert-trigger:disabled { background: #cccccc; color: #808080; cursor: not-allowed; }
.sb-insert__caret { font-size: 9px; line-height: 1; transition: transform 0.15s ease; }
#sb-insert-trigger[aria-expanded="true"] .sb-insert__caret { transform: rotate(180deg); }

.sb-insert-pop {
  position: absolute; left: 0; right: 0; bottom: calc(100% + 6px);
  z-index: 20;
  display: flex; flex-direction: column; gap: 2px;
  padding: 4px;
  background: #fff; border: 1px solid var(--c-line); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(29, 42, 93, 0.16);
}
.sb-insert-pop[hidden] { display: none; }
.sb-insert-pop__item {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  width: 100%; text-align: left;
  padding: 8px 10px;
  background: none; border: none; border-radius: 6px; color: var(--c-text);
}
.sb-insert-pop__item:hover { background: var(--c-soft); }
.sb-insert-pop__item:focus-visible { outline: 2px solid var(--c-accent); outline-offset: -2px; }
.sb-insert-pop__title { font-size: 13px; font-weight: 500; }
.sb-insert-pop__sub { font-size: 11px; color: var(--c-muted); }
#sb-open-editor {
  width: 100%; padding: 7px 12px;
  background: #fff; color: var(--c-accent);
  border: 1px solid var(--c-accent); border-radius: 4px;
  font-weight: 500;
  margin-bottom: 6px;
}
#sb-open-editor:hover:not(:disabled) { background: var(--c-accent-hover); }
#sb-open-editor:disabled { color: var(--c-muted); border-color: var(--c-line); cursor: not-allowed; }
.sb-status { font-size: 11px; color: var(--c-muted); margin-top: 4px; text-align: center; min-height: 14px; }
.sb-status--good { color: var(--c-good); }
.sb-status--bad  { color: var(--c-bad); }
.sb-status--warn { color: var(--c-warn); }


</style>
