<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OPS Research Tool</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>OPS Research Tool</h1>
    <div id="sync-status" class="sync-status sync-status--idle">All saved</div>
  </header>

  <section class="power-toggle">
    <label class="switch">
      <input type="checkbox" id="enabled-toggle" checked />
      <span class="switch__slider"></span>
    </label>
    <div class="power-toggle__text">
      <span class="power-toggle__label" id="enabled-label">Extension on</span>
      <span class="power-toggle__hint">Highlighting + sidebar active on web pages</span>
    </div>
  </section>

  <section id="identity" class="identity">
    <div class="identity__name" id="identity-name">…</div>
    <div class="identity__email" id="identity-email"></div>
  </section>

  <section id="error" class="error" hidden></section>

  <footer>
    <div class="footer__actions">
      <button id="force-drain" type="button">Sync now</button>
      <button id="reconnect" type="button" class="btn-secondary" hidden>Reconnect</button>
    </div>
    <span id="last-sync" class="last-sync"></span>
  </footer>

  <script src="../config.js"></script>
  <script src="../shared/ids.js"></script>
  <script src="../shared/url.js"></script>
  <script src="popup.js"></script>
</body>
</html>
